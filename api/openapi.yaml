openapi: 3.1.0
info:
  title: PONI GBP Manager API
  version: 0.6.0
  summary: REST API of the PONI GBP Manager engine.
  description: |
    The dashboard talks only to this API (D-003). This file is the source of
    truth (D-004): change it first, then the engine and the generated
    dashboard client.

    **Signing in.** Staff sign in with Google (D-033). The engine keeps the
    session and gives the browser a cookie that scripts can't read. Every
    request that changes something (`POST`, `PUT`, `PATCH`, `DELETE`) must also carry the
    session's CSRF token, from `GET /api/session`, in the `X-CSRF-Token`
    header.

    The phone app signs in with the same Google sign-in and gets a bearer
    token instead of the cookie (D-095): `GET /api/auth/google/start` with
    `client=ios` and a PKCE challenge, then `POST /api/auth/app-token`. It
    sends the token as `Authorization: Bearer <token>` with every request.
    Every endpoint that takes the cookie takes the token. A request with a
    token needs no CSRF token. A token ends 30 days after its last use and
    at the latest 90 days after signing in; the answer is then a 401.

    **Compatibility** (D-095). A member of a response is not removed or
    renamed, and an enum a response carries is not narrowed, without telling
    the app's side before it ships. A new member or a new enum value may
    come at any time, so a client ignores what it does not know in a
    response. The engine is released before a client that sends a new
    request member.

    **Lists** take `page` (from 1) and `per_page` (up to 100) and answer with
    `items` and the `total` number of matches.

    **Times** are RFC 3339 strings in UTC.

    **Request bodies** are read exactly as their schemas say (D-092), the
    same on every endpoint. A member the schema does not list is refused,
    and so is `null` for a member whose type does not include it; a
    member the schema requires must be there. A whole number may be
    written with a fraction of zero (`100.0`). A `PATCH` follows JSON
    Merge Patch (RFC 7396): a member left out keeps its value, `null`
    clears a member that can be empty, and any other value replaces it.
    Each refusal is a 400 with the code `invalid_request` and a message
    that names the member. Query parameters the engine does not know are
    ignored.

    **Posting.** The engine analyzes reviews and drafts replies, and records
    what the reply policy would do with each draft. A reply reaches Google
    when a signed-in person approves a draft (`POST
    /api/drafts/{id}/approve`), or by auto-posting where a person switched it
    on for the location. A local post reaches Google only when a signed-in
    person approves it (`POST /api/local-posts/{id}/approve`), and a post
    that is at Google is changed there only when a signed-in person
    approves an edit of it (`POST /api/local-posts/{id}/edit/approve`). The
    engine writes nothing else to a profile, and deletes one thing there: a
    local post, when a signed-in person asks for it (`POST
    /api/local-posts/{id}/remove`).

    **Errors** the engine produces have the `Error` shape. An unknown path is
    a 404 and a wrong method a 405, on every endpoint.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same origin as the dashboard (Caddy forwards /api to the engine).
tags:
  - name: system
    description: Engine health and status.
  - name: session
    description: Signing in and out.
  - name: connections
    description: |
      Connecting the two Google accounts the engine works with (D-079): the
      GBP managing account, whose token reads reviews and posts replies, and
      the mailbox notifications are sent from. Each is the account a person
      signed in with, one of each at a time, and the system status shows its
      address (D-100).
  - name: clients
    description: Clients (brands) that PONI works for, as groups of locations for bookkeeping (D-102).
  - name: locations
    description: |
      Google Business Profile locations, discovered from GBP. Everything the
      engine does is a location's, and a location is worked on only once a
      person switched it on (D-102).
  - name: reviews
    description: The review inbox, a read-only mirror of the reviews on Google.
  - name: analysis
    description: Review analysis and reply drafts.
  - name: replies
    description: The approval queue. Edit, regenerate, approve (which posts) or reject a draft.
  - name: escalations
    description: Reviews with a severity flag that a person must handle.
  - name: notifications
    description: Notification rules and the delivery log.
  - name: auto-posting
    description: Replies posted without a person (D-069), per location, with their switches, limits and pauses.
  - name: go-live
    description: The go-live test (D-074), which a configuration must pass before anything is auto-posted with it.
  - name: reports
    description: |
      Location reports (FR-8, D-085, D-102, D-104): one location's, built once from
      its stored reviews and Google's visibility numbers, read by staff here.
      Its page is one object in a public bucket, put there when the report is
      built; that object's address is the report's only link. The engine
      serves no report to anyone who is not signed in.
  - name: local-posts
    description: |
      The posts a business publishes on its profile (FR-14, D-088): updates,
      offers and events. Staff write a draft, a signed-in person approves
      its exact content, and Google publishes, schedules and repeats it. The
      list also shows posts made in Google's own interface.
  - name: settings
    description: Voices, localization, reply policies and the pipeline's settings, per location.
  - name: knowledge
    description: |
      The knowledge base (FR-13), read-only: supported industries with their
      profiles and test corpora, voice templates, defaults and model prices.
      It is seeded from files by `poni-tools`; no route changes it.
  - name: llm
    description: LLM usage and cost.
  - name: audit
    description: The append-only audit log.
security:
  - session: []
  - bearer: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Engine health
      description: |
        Reports whether the engine is up, which version it is, and whether it
        can reach its database. Needs no login, so monitoring can call it.
      tags: [system]
      security: []
      responses:
        "200":
          description: The engine and its database are working.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                version: 0.1.0
                database:
                  reachable: true
        "503":
          description: The engine is up but cannot reach its database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: degraded
                version: 0.1.0
                database:
                  reachable: false

  /api/session:
    get:
      operationId: getSession
      summary: Current session
      description: |
        Who is signed in, and the CSRF token for changing requests. When
        nobody is signed in, `sign_in` says which ways of signing in the
        engine offers. Never fails for a missing or expired session. With a
        bearer token the answer is the same, and `csrf_token` is null: a
        token needs none. A bearer token that is unknown or has ended, and
        a header that begins with `Bearer` and has no token after it, are
        answered with a 200 and `authenticated: false`, never a 401, and so
        is a request with no header at all and no session cookie. A header
        with another scheme is not the app's: the request is judged by its
        cookie, so a browser's valid cookie still gives `authenticated:
        true`. A client signed in with a token treats `authenticated: false`
        as signed out.
      tags: [session]
      security: []
      responses:
        "200":
          description: The session, signed in or not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /api/auth/google/start:
    get:
      operationId: startGoogleSignIn
      summary: Start Google sign-in
      description: |
        Sends the browser to Google. Open it as a page (a link or
        `location.assign`), not with `fetch`. Google sends the browser back
        to `/api/auth/google/callback`.

        The phone app opens it in the system's browser sheet with
        `client=ios` and the S256 challenge of a PKCE verifier it keeps
        (RFC 7636). The sign-in then ends at `gbpmanager://auth` with a
        one-time code for `POST /api/auth/app-token`.

        Every request counts against the attempt limit of its address (20
        in 10 minutes, then 15 minutes locked), whatever it asks for, and
        the limit is checked before anything else. Over it, the dashboard's
        start answers 429; the app's (`client=ios`) is sent back to the app
        with `gbpmanager://auth?error=too_many_attempts`, because the browser
        sheet would show the JSON as it is. A start with a `client` there is
        not is answered as the dashboard's.

        A 400 stays JSON, for the app too: `client=ios` without a
        well-formed `code_challenge` is a fault in the app, which no person
        meets in a released app.
      tags: [session]
      security: []
      parameters:
        - name: client
          in: query
          description: Left out by the dashboard. `ios` for the phone app, which must then send `code_challenge`.
          schema:
            type: string
            enum: [ios]
        - name: code_challenge
          in: query
          description: >-
            With `client=ios`: the PKCE challenge, base64url of the SHA-256 of
            the verifier, without padding (43 characters).
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{43}$"
      responses:
        "302":
          description: >-
            Redirect to Google. When Google sign-in is not set up: to the
            sign-in page with `error=not_configured`, or for the app to
            `gbpmanager://auth?error=not_configured`. For the app over the
            attempt limit: to `gbpmanager://auth?error=too_many_attempts`,
            with no attempt started and the attempt's cookie cleared.
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
          description: >-
            The dashboard's start over the attempt limit
            (`too_many_attempts`). The app's start is redirected instead.

  /api/auth/google/callback:
    get:
      operationId: finishGoogleSignIn
      summary: Finish Google sign-in
      description: |
        Where Google sends the browser back. On success the engine sets the
        session cookie and redirects to the dashboard. Otherwise it redirects
        to the dashboard's sign-in page, `/#/login?error=<code>`, with one of:

        - `domain`: the account isn't a Google Workspace account of the allowed domain
        - `disabled`: the user was disabled
        - `cancelled`: the person cancelled at Google
        - `expired`: the sign-in took too long; start again
        - `not_configured`: Google sign-in isn't set up on this engine
        - `failed`: anything else

        A sign-in the phone app started (`client=ios`) sets no cookie. It
        ends at `gbpmanager://auth?code=<one-time code>`, or at
        `gbpmanager://auth?error=<code>` with the same codes and one of the
        app's only:

        - `too_many_attempts`: too many sign-in attempts from this address; wait at most a quarter of an hour and start again

        Every request counts against the attempt limit of its address, the
        same limit as the start's, whatever its cookie says, and the limit
        is checked before anything else. Over it, the dashboard's callback,
        and one without the attempt's cookie, answer 429; the app's is sent
        back to the app with `too_many_attempts`, and nothing is written.

        One case cannot reach the app: when the browser sheet lost the
        cookie of the attempt, the engine does not know whose attempt it
        was, and `expired` goes to the dashboard's sign-in page (or the 429
        over the limit). Whose attempt it was is in that cookie and nowhere
        else, and nothing of a redirect's target is taken from the request.
      tags: [session]
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: >-
            Redirect to the dashboard, signed in or with an error code; for
            the app, to `gbpmanager://auth` with a code or an error code,
            `too_many_attempts` over the attempt limit included.
          headers:
            Location:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/TooManyAttempts"
          description: >-
            Over the attempt limit (`too_many_attempts`): the dashboard's
            callback, or one without the attempt's cookie. The app's callback
            is redirected instead.

  /api/connections/{account}/start:
    parameters:
      - $ref: "#/components/parameters/ConnectionAccount"
    post:
      operationId: startConnection
      summary: Start connecting a Google account
      description: |
        Returns the address at Google where the person signs in with the
        account to connect: the GBP managing account (`gbp`), or the mailbox
        notifications are sent from (`gmail`). Open it as a page
        (`location.assign`). Google sends the browser back to
        `/api/connections/{account}/callback`, which belongs to this attempt
        for 10 minutes and to the browser that started it.

        The account connected is the one the person picks in Google's
        account chooser, which is always shown: no setting of the engine
        names it (D-100). There is one connection of each kind at a time,
        and connecting again, with the same account or another, replaces
        the stored token and its address.

        The client secret, the refresh token and the encryption key never
        reach the browser.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStart"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The engine can't connect an account (`not_configured`): it has
            no OAuth client (`PONI_GBP_OAUTH_CLIENT_ID` and `_SECRET`) or no
            key to encrypt the token with (`PONI_SECRET_KEY`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/connections/{account}/callback:
    parameters:
      - $ref: "#/components/parameters/ConnectionAccount"
    get:
      operationId: finishConnection
      summary: Finish connecting a Google account
      description: |
        Where Google sends the browser back. The engine exchanges the code,
        learns the account's address from Google's answer, checks the
        account (the GBP account sees at least one location; the mailbox
        granted permission to send), encrypts the token and stores it with
        the address, with an audit entry in the name of the person who
        started. It then redirects to the status page:
        `/#/status?connected=<account>`, or
        `/#/status?account=<account>&connect_error=<code>` with one of:

        - `cancelled`: the person cancelled at Google
        - `expired`: the attempt took too long, was used already, or the person signed out meanwhile; start again
        - `refused`: Google did not accept the sign-in
        - `no_refresh_token`: Google returned no refresh token; remove the app's access in the Google account and start again
        - `no_access`: the account can't list Business Profile accounts and locations, or sees no location
        - `no_email`: Google did not name a verified address for the account that signed in
        - `no_send_permission`: the permission to send email was not granted
        - `failed`: anything else

        Nothing is stored unless every check passed.
      tags: [connections]
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the status page, connected or with an error code.
          headers:
            Location:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auth/app-token:
    post:
      operationId: exchangeAppCode
      summary: Exchange the app's one-time code for a token
      description: |
        Turns the one-time code of a sign-in the phone app started into a
        bearer token. A code works once, for 60 seconds, and only with the
        verifier whose challenge started the sign-in. A code that was
        presented is spent, whatever the answer. The answer is never cached
        (`Cache-Control: no-store`, as on every answer).

        Every refusal is the same 400: an unknown, used or expired code, a
        wrong verifier (or one that is not of RFC 7636's form), or a user who
        was disabled in the meantime. The app starts the sign-in again.

        The exchange has an attempt limit of its own, and its 429 stays: it
        is a call the app makes itself, not a page the person sees.
      tags: [session]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppTokenRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppToken"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/TooManyAttempts"

  /api/auth/dev-login:
    post:
      operationId: devSignIn
      summary: Development sign-in
      description: |
        Signs in as the configured development user without Google. Exists
        only when the engine runs with `PONI_DEV_LOGIN_EMAIL` on plain
        `http://localhost`; otherwise it answers 404 like any unknown path.

        With `client=ios` it answers with a bearer token, as `POST
        /api/auth/app-token` does, and sets no cookie.
      tags: [session]
      security: []
      parameters:
        - name: client
          in: query
          description: Left out by the dashboard. `ios` for the phone app.
          schema:
            type: string
            enum: [ios]
      responses:
        "200":
          description: >-
            Signed in. Without `client`: the session, and the session cookie
            is set. With `client=ios`: the token, and no cookie.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Session"
                  - $ref: "#/components/schemas/AppToken"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          description: The development user is disabled (`user_disabled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyAttempts"

  /api/auth/logout:
    post:
      operationId: signOut
      summary: Sign out
      description: |
        Ends the session and clears the cookie. With a bearer token it ends
        that token, needs no CSRF token and touches no cookie.
      tags: [session]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/clients:
    get:
      operationId: listClients
      summary: List clients
      description: Clients in name order.
      tags: [clients]
      parameters:
        - name: archived
          in: query
          description: Only archived (`true`) or only active (`false`) clients. Both when left out.
          schema:
            type: boolean
        - name: q
          in: query
          description: Part of the name.
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createClient
      summary: Create a client
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreate"
      responses:
        "201":
          description: The new client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another client already has this name (`name_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/clients/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getClient
      summary: Get a client
      tags: [clients]
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateClient
      summary: Change a client
      description: |
        Changes the fields that are given. Archiving a client changes nothing
        about its locations (D-102); nothing is deleted.
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: The client after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another client already has this name (`name_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteClient
      summary: Delete a client
      description: |
        Removes the client, archived or not (D-102). Its locations are
        unlinked (`client_id` becomes null) and nothing else about them
        changes: whether they are enabled, their reply settings, switches,
        go-live tests and reports stay as they are. The audit log keeps the
        client's name, notes and `location_ids`, and an unlink entry for
        each location.
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The client is gone.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/locations:
    get:
      operationId: listLocations
      summary: List locations
      description: Every location the GBP managing account can see or could see, in title order.
      tags: [locations]
      parameters:
        - name: client_id
          in: query
          description: Only this client's locations.
          schema:
            type: integer
            format: int64
        - name: linked
          in: query
          description: Only locations linked to a client (`true`) or not yet linked (`false`).
          schema:
            type: boolean
        - name: enabled
          in: query
          description: Only locations the engine works on (`true`) or only those it lists alone (`false`).
          schema:
            type: boolean
        - name: access_status
          in: query
          schema:
            $ref: "#/components/schemas/AccessStatus"
        - name: q
          in: query
          description: Part of the title.
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of locations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/locations/discover:
    post:
      operationId: discoverLocations
      summary: Look for locations now
      description: |
        Asks the engine to list the managing account's locations on Google
        right away instead of waiting for the next scheduled discovery. The
        work runs in the background; reload the list a few seconds later.
      tags: [locations]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: Discovery was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enqueued"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/locations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getLocation
      summary: Get a location
      tags: [locations]
      responses:
        "200":
          description: The location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateLocation
      summary: Change a location
      description: |
        Switches the location on or off (`enabled`), sets its industry, the
        day its analysis starts from and its audience, groups it under a
        client or clears that, changes how often its reviews are polled, or
        flips its posting switch. Everything else about a location comes
        from Google and can't be changed here.

        The engine works only on an enabled location (D-102); a discovered
        location starts switched off. Linking, unlinking and moving the
        location to another client change only the grouping: its reply
        settings, switches, tests and reports stay as they are. Its reply
        settings are its own from discovery (D-093), and change only through
        `PUT /api/locations/{id}/reply-settings`.
      tags: [locations]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: The location after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The client doesn't exist or is archived (`client_not_found`), or
            the location can't be switched on because the managing account no
            longer sees it (`location_not_accessible`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/reviews:
    get:
      operationId: listReviews
      summary: List reviews
      description: The review inbox. Newest first unless `sort` and `order` say otherwise.
      tags: [reviews]
      parameters:
        - name: location_id
          in: query
          schema:
            type: integer
            format: int64
        - name: rating
          in: query
          description: Star ratings to include, for example `rating=1,2`.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 5
        - name: status
          in: query
          description: "`active` (the default): on Google now. `removed`: gone from Google. `all`: both."
          schema:
            type: string
            enum: [active, removed, all]
            default: active
        - name: language
          in: query
          description: A language code as in `Review.language`, or `none` for reviews without text.
          schema:
            type: string
        - name: has_reply
          in: query
          schema:
            type: boolean
        - name: q
          in: query
          description: Part of the review text or the reviewer's name.
          schema:
            type: string
        - name: analyzed
          in: query
          description: Reviews that have (or lack) an analysis.
          schema:
            type: boolean
        - name: sentiment
          in: query
          description: Of the review's newest analysis.
          schema:
            type: string
            enum: [positive, mixed, neutral, negative, none]
        - name: flagged
          in: query
          description: Reviews whose newest analysis raised (or didn't raise) a severity flag.
          schema:
            type: boolean
        - name: manipulation
          in: query
          description: Reviews suspected (or not) of trying to manipulate the AI.
          schema:
            type: boolean
        - name: ignored
          in: query
          description: Reviews a person marked as needing no reply (or the others).
          schema:
            type: boolean
        - name: has_draft
          in: query
          description: Reviews that have (or lack) a draft, whatever its status.
          schema:
            type: boolean
        - name: route
          in: query
          description: The route of the review's newest draft.
          schema:
            $ref: "#/components/schemas/DraftRoute"
        - name: draft_status
          in: query
          description: The status of the review's newest draft. The approval queue is `draft_status=draft`.
          schema:
            type: string
            enum: [draft, scheduled, approved, posting, posted, published, rejected, cancelled, superseded]
        - name: sort
          in: query
          description: "`draft_time`: when the newest draft was written."
          schema:
            type: string
            enum: [created_time, updated_time, rating, draft_time]
            default: created_time
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of reviews.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/reviews/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getReview
      summary: Get a review
      tags: [reviews]
      responses:
        "200":
          description: The review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/reviews/{id}/events:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listReviewEvents
      summary: A review's history
      description: |
        What the sync noticed about the review, oldest first: when it was
        first seen, edits by the reviewer, replies added, changed or removed
        on Google, and whether the review was removed or came back.
      tags: [reviews]
      responses:
        "200":
          description: The review's events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEventList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/reviews/{id}/drafts:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listReviewDrafts
      summary: A review's drafts
      description: |
        Every reply drafted for the review, newest first, each with the
        `inputs` that shaped its prompt (FR-4). At most one has the status
        `draft`; older ones are `superseded` or `cancelled`.
      tags: [analysis]
      responses:
        "200":
          description: The review's drafts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraftList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/reviews/{id}/ignore:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: ignoreReview
      summary: Mark a review as needing no reply
      description: |
        Not every review has to be answered. This records a person's
        decision to leave the review without a reply: its waiting draft is
        cancelled, no new draft is written, and it leaves the approval
        queue. The decision can be undone, and it ends by itself if the
        reviewer edits the review. An escalation of the review is not
        touched. Doing it twice changes nothing.
      tags: [replies]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewIgnoreRequest"
      responses:
        "200":
          description: The review after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The review can't be ignored (`review_not_ignorable`): it was
            removed, it already has a reply, or a reply to it is approved or
            on its way to Google.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/reviews/{id}/unignore:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: unignoreReview
      summary: Undo "no reply needed"
      description: The review is drafted for again on the pipeline's next pass, within about a minute.
      tags: [replies]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The review after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/reviews/{id}/analyze:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: analyzeReview
      summary: Analyze a review again
      description: |
        Queues a fresh analysis of the review and, if it has no reply, a new
        draft that replaces the current one. Use it after changing a voice,
        a policy or an industry profile. Nothing is posted to Google.
      tags: [analysis]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: The analysis was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enqueued"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The review can't be analyzed: it was removed, its location has no
            industry profile, or its location isn't synced (`not_analyzable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/locations/{id}/reply-settings:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getLocationReplySettings
      summary: A location's reply settings
      description: |
        The voice, localization preferences and policy the location's replies
        are written with (FR-4, FR-5, D-093). They are the location's own and
        complete: nothing is merged in from the knowledge base. A location
        gets them when it is discovered, as a copy of the knowledge base's
        defaults, and keeps them whatever client it is grouped under (D-102).
      tags: [settings]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplySettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReplySettingsConflict"
    put:
      operationId: replaceLocationReplySettings
      summary: Replace a location's reply settings
      description: |
        Every field is sent, and what is stored is replaced whole (D-093).
        Taking a voice template is filling the form from `GET /api/knowledge`
        and saving; copying the settings to another location is this call
        for that location. A change of what the models are asked means a new
        go-live test before the location auto-posts again (D-074).
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplySettingsUpdate"
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplySettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReplySettingsConflict"

  /api/knowledge:
    get:
      operationId: getKnowledge
      summary: The knowledge base
      description: |
        Everything the system knows that is the same for every client:
        the supported industries, the severity flags of every industry, the
        voice templates, the defaults and the model prices, with the version
        that is seeded and since when. The corpus texts are left out; see
        `GET /api/knowledge/industries/{key}/corpus`.
      tags: [knowledge]
      responses:
        "200":
          description: The knowledge base as it is seeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Knowledge"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/knowledge/industries/{key}/corpus:
    parameters:
      - name: key
        in: path
        required: true
        description: The industry's key.
        schema:
          type: string
    get:
      operationId: getKnowledgeCorpus
      summary: An industry's test corpus
      description: |
        The synthetic reviews a go-live test of a location of this industry
        runs, with what is expected of each (architecture section 10).
      tags: [knowledge]
      responses:
        "200":
          description: The corpus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeCorpus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/ai/settings:
    get:
      operationId: getAiSettings
      summary: Analysis pipeline settings
      description: |
        The model per task (D-030) and the batch size. Each setting's
        default is in the knowledge base (`Knowledge.defaults.analysis`), and
        so are the model prices for the cost estimate.
      tags: [settings]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateAiSettings
      summary: Change the analysis pipeline settings
      description: Changes the fields that are given. A map or list that is given replaces the stored one.
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSettingsUpdate"
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/llm/usage:
    get:
      operationId: getLlmUsage
      summary: LLM usage and cost
      description: |
        Calls, tokens and estimated cost between two days, in total and by
        day, model, task, provider and location. The cost is an estimate from the prices
        in the pipeline settings at the time of each call.
      tags: [llm]
      parameters:
        - name: from
          in: query
          description: First day (UTC), `YYYY-MM-DD`. Default, 29 days before `to`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Last day (UTC), `YYYY-MM-DD`, included. Default, today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmUsage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/llm/calls:
    get:
      operationId: listLlmCalls
      summary: List LLM calls
      description: Every request sent to the model, newest first, failed attempts included. Prompts and answers are not stored here.
      tags: [llm]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of calls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmCallList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/drafts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getDraft
      summary: Get a draft
      description: The draft with the `inputs` that shaped its prompt and, once approved, the engine's post.
      tags: [replies]
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateDraft
      summary: Edit a draft's text
      description: |
        Replaces the text of a draft that is still waiting (`draft`). The
        reply checks run again on the new text and are stored with it; a
        draft with a failed check is saved but can't be approved.
      tags: [replies]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftUpdate"
      responses:
        "200":
          description: The draft after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DraftConflict"

  /api/drafts/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: approveDraft
      summary: Approve a draft and post it
      description: |
        The only way a reply reaches Google. The body carries the text the
        person read; it must equal the stored text, so nobody approves an
        edit they haven't seen. The draft becomes `approved` and a job posts
        it at once. Just before posting, the engine reads the review from
        Google again and stops unless it still exists, is unchanged since
        the draft was written and has no reply. The draft then moves to
        `posting`, `posted` (Google accepted the reply) and `published` (a
        later read saw it on Google; Google holds a new reply for a few
        minutes).
      tags: [replies]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftApproval"
      responses:
        "202":
          description: The draft was approved and queued for posting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DraftConflict"

  /api/drafts/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: rejectDraft
      summary: Reject a draft
      description: |
        The draft becomes `rejected` with the reason, and no new draft is
        written for this version of the review. "Analyze again" on the
        review starts over.
      tags: [replies]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRejection"
      responses:
        "200":
          description: The rejected draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DraftConflict"

  /api/drafts/{id}/regenerate:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: regenerateDraft
      summary: Write the draft again with instructions
      description: |
        Asks the model for a new reply to the same review, with the staff
        member's instructions added to the prompt. The answer is a new draft
        that replaces this one (which becomes `superseded`). The call waits
        for the model, usually a few seconds.
      tags: [replies]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRegeneration"
      responses:
        "201":
          description: The new draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DraftConflict"
        "502":
          description: The model gave no usable answer (`model_unavailable`). The draft is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/drafts/{id}/unschedule:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: unscheduleDraft
      summary: Take a scheduled reply out of auto-posting
      description: |
        A draft the policy scheduled for an automatic post returns to the
        approval queue as `draft`, where a person edits, approves or rejects
        it. The job that would have posted it finds nothing to do.
      tags: [auto-posting]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The draft, now waiting for a person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`draft_not_scheduled`: the draft is not scheduled (it was posted, stopped or taken back already)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auto-posting:
    get:
      operationId: getAutoPosting
      summary: Auto-posting everywhere
      description: |
        The pause on every location, the global posting switch, and each
        enabled location's auto-posting settings. Everything is off after
        installation.
      tags: [auto-posting]
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPostingOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/auto-posting/resume:
    post:
      operationId: resumeAllAutoPosting
      summary: Lift the pause on every location
      description: |
        The engine pauses auto-posting everywhere when Google refuses its
        token or its permission for an automatic reply. Only a person lifts
        the pause. Replies stopped meanwhile stay in the approval queue.
      tags: [auto-posting]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The overview after resuming.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPostingOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/locations/{id}/auto-posting:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateLocationAutoPosting
      summary: Change a location's auto-posting settings
      description: |
        Switching auto-posting on lets the engine post replies to this
        location's reviews without a person: drafts routed to `auto_post`
        for the chosen star ratings, written from then on. It is refused
        (400) unless a star rating is chosen, the location is enabled and
        accessible (D-102), and the reply policy's timing can be used (a posting
        window needs `time_zone`). The global and the location's posting
        switch still apply on top, and nothing is auto-posted until the
        location's configuration has passed a go-live test (`go_live_state`,
        D-074). Switching on or off is audited under its own action.
      tags: [auto-posting]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoPostingUpdate"
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPosting"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/locations/{id}/auto-posting/resume:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: resumeLocationAutoPosting
      summary: Lift a location's pause
      description: |
        The engine pauses auto-posting at a location when
        `pause_after_failures` replies in a row failed a reply check, when an
        automatic reply did not appear on
        Google, or when Google refused one. Only a person lifts the pause.
        Replies stopped meanwhile stay in the approval queue.
      tags: [auto-posting]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The settings after resuming.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPosting"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auto-posts:
    get:
      operationId: listAutoPosts
      summary: Replies posted without a person
      description: Newest first, with the version of the rules that decided each one and the time from the review to the reply.
      tags: [auto-posting]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of auto-posts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPostList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/go-live:
    get:
      operationId: getGoLive
      summary: Where every location's go-live test stands
      description: |
        A location may auto-post only while its configuration has a passing
        go-live test (D-074). The configuration is identified by a
        fingerprint of everything that changes what the models are asked and
        what the code checks: the prompts as rendered for the location, each
        task's provider, model, temperature, token limit and request extras,
        and the limits the reply checks read. Each location comes with its
        state and an estimate of what a test would take (D-102).
      tags: [go-live]
      responses:
        "200":
          description: Every enabled location, by title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoLiveOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/locations/{id}/go-live-test:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: startGoLiveTest
      summary: Submit a location for go-live testing
      description: |
        Starts one run of the location's configuration, at its reply
        policy's width (D-102). A run sends the attack, severity and control
        cases of the location's industry and the location's own newest 4
        and 5 star reviews (D-075) through the analyzer and the writer three
        times each, and has the judge rate the replies that would have been
        posted without a person. This calls the models and costs money
        (`GoLiveEstimate`). A test never starts by itself, nothing is
        posted, and a pass switches nothing on. A pass counts for every
        location with the same fingerprint. Refused (400) when a task's
        model provider is not configured, or the location is not enabled or
        has no industry profile.
      tags: [go-live]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: The run that was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoLiveRun"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/GoLiveConflict"

  /api/go-live-runs/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getGoLiveRun
      summary: One go-live test with its cases
      tags: [go-live]
      responses:
        "200":
          description: The run; `cases` holds every case with its replies and ratings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoLiveRun"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/go-live-runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: cancelGoLiveRun
      summary: Stop a running go-live test
      description: |
        The run makes no further model calls. What it spent stays recorded,
        and its result counts for nothing: the configuration is as untested
        as before.
      tags: [go-live]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The cancelled run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoLiveRun"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/GoLiveConflict"

  /api/reports:
    get:
      operationId: listReports
      summary: List reports
      description: |
        Newest first. A report's page is not in the answer; `url` is its
        address. A report in the list has empty `recipients` and
        `deliveries`: `GET /api/reports/{id}` and the answer of a send carry
        them.
      tags: [reports]
      parameters:
        - name: location_id
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReportStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/locations/{id}/reports:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: createReport
      summary: Generate a report now
      description: |
        Starts a report of the location for any period that is over (D-102).
        Refused (400) when the location is not enabled, and (409
        `no_public_bucket`) when the engine has no public bucket for the
        report's page. A job builds it: the answer is the report as
        `building`, and it becomes `ready` (or `failed`) shortly after.
        Building puts the page into the public bucket and sends nothing. It
        may call the model once, for the summary.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCreate"
      responses:
        "201":
          description: The report, building.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReportConflict"

  /api/reports/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getReport
      summary: Get a report
      tags: [reports]
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/reports/{id}/send:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: sendReport
      summary: Send a report by email
      description: |
        Sends a `ready` report to the location's recipients (D-104), as often
        as a person likes. Each address gets its own email with the report's
        link: one `To:` and no copy. Without a body, or without
        `recipients`, it goes to every address in `Report.recipients`; with
        `recipients`, to those, each of which must be one of
        `Report.recipients` (compared after trimming and lower-casing).

        The request blocks until every address was tried, one after
        another: a few seconds for ten addresses, and minutes when Gmail
        limits the mailbox. A client shows that it is waiting; one that gave
        up waiting reads the report again.

        The answer is 200 whatever came of each address, and
        `Report.deliveries` carries this send's rows, one per address,
        `sent` or `failed`. `sent` means Gmail accepted the message, not
        that it arrived; a `failed` row after a network error or a timeout
        may be a message Gmail did accept. What was read when the send began
        decides: sending switched off, the location switched off or an
        address taken out of the rule while a send is under way does not
        stop the emails still to come.

        The engine does not check earlier sends: a second send to an
        address that has a `sent` row is a second email. The client reads
        `deliveries` and asks the person before sending again. Nothing about
        the report changes. A report can be discarded while a send is on its
        way; the emails still to come then carry a link that no longer works.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportSendRequest"
      responses:
        "200":
          description: The report, with this send's rows first in `deliveries`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReportConflict"

  /api/report-schedules:
    get:
      operationId: listReportSchedules
      summary: List report schedules
      tags: [reports]
      responses:
        "200":
          description: Every schedule, by location title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportScheduleList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createReportSchedule
      summary: Add a report schedule
      description: |
        A location may have any number. A schedule's first run is the first
        one after it was made; it never runs for a time that has passed.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportScheduleCreate"
      responses:
        "201":
          description: The new schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSchedule"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/report-schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateReportSchedule
      summary: Change a report schedule
      description: Changes the fields that are given. A changed schedule does not run for a time that passed before the change.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportScheduleUpdate"
      responses:
        "200":
          description: The schedule after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSchedule"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteReportSchedule
      summary: Remove a report schedule
      description: Removes the schedule. The reports it built stay.
      tags: [reports]
