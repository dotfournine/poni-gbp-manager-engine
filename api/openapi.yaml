openapi: 3.1.0
info:
  title: PONI GBP Manager API
  version: 0.6.0
  summary: REST API of the PONI GBP Manager engine.
  description: |
    The dashboard talks only to this API (D-003). This file is the source of
    truth (D-004): change it first, then the engine and the generated
    dashboard client.

    **Signing in.** Staff sign in with Google (D-033). The engine keeps the
    session and gives the browser a cookie that scripts can't read. Every
    request that changes something (`POST`, `PUT`, `PATCH`, `DELETE`) must also carry the
    session's CSRF token, from `GET /api/session`, in the `X-CSRF-Token`
    header.

    The phone app signs in with the same Google sign-in and gets a bearer
    token instead of the cookie (D-095): `GET /api/auth/google/start` with
    `client=ios` and a PKCE challenge, then `POST /api/auth/app-token`. It
    sends the token as `Authorization: Bearer <token>` with every request.
    Every endpoint that takes the cookie takes the token. A request with a
    token needs no CSRF token. A token ends 30 days after its last use and
    at the latest 90 days after signing in; the answer is then a 401.

    **Compatibility** (D-095). A member of a response is not removed or
    renamed, and an enum a response carries is not narrowed, without telling
    the app's side before it ships. A new member or a new enum value may
    come at any time, so a client ignores what it does not know in a
    response. The engine is released before a client that sends a new
    request member.

    **Lists** take `page` (from 1) and `per_page` (up to 100) and answer with
    `items` and the `total` number of matches.

    **Times** are RFC 3339 strings in UTC.

    **Request bodies** are read exactly as their schemas say (D-092), the
    same on every endpoint. A member the schema does not list is refused,
    and so is `null` for a member whose type does not include it; a
    member the schema requires must be there. A whole number may be
    written with a fraction of zero (`100.0`). A `PATCH` follows JSON
    Merge Patch (RFC 7396): a member left out keeps its value, `null`
    clears a member that can be empty, and any other value replaces it.
    Each refusal is a 400 with the code `invalid_request` and a message
    that names the member. Query parameters the engine does not know are
    ignored.

    **Posting.** The engine analyzes reviews and drafts replies, and records
    what the reply policy would do with each draft. A reply reaches Google
    when a signed-in person approves a draft (`POST
    /api/drafts/{id}/approve`), or by auto-posting where a person switched it
    on for the location. A local post reaches Google only when a signed-in
    person approves it (`POST /api/local-posts/{id}/approve`). The engine
    writes nothing else to a profile, and deletes one thing there: a local
    post, when a signed-in person asks for it (`POST
    /api/local-posts/{id}/remove`).

    **Errors** the engine produces have the `Error` shape. An unknown path is
    a 404 and a wrong method a 405, on every endpoint.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same origin as the dashboard (Caddy forwards /api to the engine).
tags:
  - name: system
    description: Engine health and status.
  - name: session
    description: Signing in and out.
  - name: connections
    description: |
      Connecting the two Google accounts the engine works with (D-079): the
      GBP managing account, whose token reads reviews and posts replies, and
      the mailbox notifications are sent from.
  - name: clients
    description: Clients (brands) that PONI works for.
  - name: locations
    description: Google Business Profile locations, discovered from GBP and linked to clients.
  - name: reviews
    description: The review inbox, a read-only mirror of the reviews on Google.
  - name: analysis
    description: Review analysis and reply drafts.
  - name: replies
    description: The approval queue. Edit, regenerate, approve (which posts) or reject a draft.
  - name: escalations
    description: Reviews with a severity flag that a person must handle.
  - name: notifications
    description: Notification rules and the delivery log.
  - name: auto-posting
    description: Replies posted without a person (D-069), per location, with their switches, limits and pauses.
  - name: go-live
    description: The go-live test (D-074), which a configuration must pass before anything is auto-posted with it.
  - name: reports
    description: |
      Client reports (FR-8, D-085): built once from the stored reviews and
      Google's visibility numbers, read by staff here, and shared with the
      client as a page in a public bucket. The engine serves no report to
      anyone who is not signed in.
  - name: local-posts
    description: |
      The posts a business publishes on its profile (FR-14, D-088): updates,
      offers and events. Staff write a draft, a signed-in person approves
      its exact content, and Google publishes, schedules and repeats it. The
      list also shows posts made in Google's own interface.
  - name: settings
    description: Voices, localization, reply policies and the pipeline's settings, per client and location.
  - name: knowledge
    description: |
      The knowledge base (FR-13), read-only: supported industries with their
      profiles and test corpora, voice templates, defaults and model prices.
      It is seeded from files by `poni-tools`; no route changes it.
  - name: llm
    description: LLM usage and cost.
  - name: audit
    description: The append-only audit log.
security:
  - session: []
  - bearer: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Engine health
      description: |
        Reports whether the engine is up, which version it is, and whether it
        can reach its database. Needs no login, so monitoring can call it.
      tags: [system]
      security: []
      responses:
        "200":
          description: The engine and its database are working.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                version: 0.1.0
                database:
                  reachable: true
        "503":
          description: The engine is up but cannot reach its database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: degraded
                version: 0.1.0
                database:
                  reachable: false

  /api/session:
    get:
      operationId: getSession
      summary: Current session
      description: |
        Who is signed in, and the CSRF token for changing requests. When
        nobody is signed in, `sign_in` says which ways of signing in the
        engine offers. Never fails for a missing or expired session. With a
        bearer token the answer is the same, and `csrf_token` is null: a
        token needs none. A bearer token that is unknown or has ended, and
        a header that begins with `Bearer` and has no token after it, are
        answered with a 200 and `authenticated: false`, never a 401, and so
        is a request with no header at all and no session cookie. A header
        with another scheme is not the app's: the request is judged by its
        cookie, so a browser's valid cookie still gives `authenticated:
        true`. A client signed in with a token treats `authenticated: false`
        as signed out.
      tags: [session]
      security: []
      responses:
        "200":
          description: The session, signed in or not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /api/auth/google/start:
    get:
      operationId: startGoogleSignIn
      summary: Start Google sign-in
      description: |
        Sends the browser to Google. Open it as a page (a link or
        `location.assign`), not with `fetch`. Google sends the browser back
        to `/api/auth/google/callback`.

        The phone app opens it in the system's browser sheet with
        `client=ios` and the S256 challenge of a PKCE verifier it keeps
        (RFC 7636). The sign-in then ends at `gbpmanager://auth` with a
        one-time code for `POST /api/auth/app-token`.
      tags: [session]
      security: []
      parameters:
        - name: client
          in: query
          description: Left out by the dashboard. `ios` for the phone app, which must then send `code_challenge`.
          schema:
            type: string
            enum: [ios]
        - name: code_challenge
          in: query
          description: >-
            With `client=ios`: the PKCE challenge, base64url of the SHA-256 of
            the verifier, without padding (43 characters).
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{43}$"
      responses:
        "302":
          description: >-
            Redirect to Google. When Google sign-in is not set up: to the
            sign-in page with `error=not_configured`, or for the app to
            `gbpmanager://auth?error=not_configured`.
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/TooManyAttempts"

  /api/auth/google/callback:
    get:
      operationId: finishGoogleSignIn
      summary: Finish Google sign-in
      description: |
        Where Google sends the browser back. On success the engine sets the
        session cookie and redirects to the dashboard. Otherwise it redirects
        to the dashboard's sign-in page, `/#/login?error=<code>`, with one of:

        - `domain`: the account isn't a Google Workspace account of the allowed domain
        - `disabled`: the user was disabled
        - `cancelled`: the person cancelled at Google
        - `expired`: the sign-in took too long; start again
        - `not_configured`: Google sign-in isn't set up on this engine
        - `failed`: anything else

        A sign-in the phone app started (`client=ios`) sets no cookie. It
        ends at `gbpmanager://auth?code=<one-time code>`, or at
        `gbpmanager://auth?error=<code>` with the same codes. One case
        cannot reach the app: when the browser sheet lost the cookie of the
        attempt, the engine does not know whose attempt it was, and
        `expired` goes to the dashboard's sign-in page.
      tags: [session]
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: >-
            Redirect to the dashboard, signed in or with an error code; for
            the app, to `gbpmanager://auth` with a code or an error code.
          headers:
            Location:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/TooManyAttempts"

  /api/connections/{account}/start:
    parameters:
      - $ref: "#/components/parameters/ConnectionAccount"
    post:
      operationId: startConnection
      summary: Start connecting a Google account
      description: |
        Returns the address at Google where the person signs in with the
        account to connect: the GBP managing account (`gbp`), or the mailbox
        notifications are sent from (`gmail`). Open it as a page
        (`location.assign`). Google sends the browser back to
        `/api/connections/{account}/callback`, which belongs to this attempt
        for 10 minutes and to the browser that started it.

        The client secret, the refresh token and the encryption key never
        reach the browser. Connecting again replaces the stored token.
      tags: [connections]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStart"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The engine can't connect an account (`not_configured`): it has
            no OAuth client (`PONI_GBP_OAUTH_CLIENT_ID` and `_SECRET`) or no
            key to encrypt the token with (`PONI_SECRET_KEY`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/connections/{account}/callback:
    parameters:
      - $ref: "#/components/parameters/ConnectionAccount"
    get:
      operationId: finishConnection
      summary: Finish connecting a Google account
      description: |
        Where Google sends the browser back. The engine exchanges the code,
        checks the account (the GBP account sees at least one location; the
        mailbox is the configured sender and granted permission to send),
        encrypts the token and stores it, with an audit entry in the name of
        the person who started. It then redirects to the status page:
        `/#/status?connected=<account>`, or
        `/#/status?account=<account>&connect_error=<code>` with one of:

        - `cancelled`: the person cancelled at Google
        - `expired`: the attempt took too long, was used already, or the person signed out meanwhile; start again
        - `refused`: Google did not accept the sign-in
        - `no_refresh_token`: Google returned no refresh token; remove the app's access in the Google account and start again
        - `no_access`: the account can't list Business Profile accounts and locations, or sees no location
        - `wrong_mailbox`: the account that signed in is not the mailbox notifications are sent from
        - `no_send_permission`: the permission to send email was not granted
        - `failed`: anything else

        Nothing is stored unless every check passed.
      tags: [connections]
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the status page, connected or with an error code.
          headers:
            Location:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auth/app-token:
    post:
      operationId: exchangeAppCode
      summary: Exchange the app's one-time code for a token
      description: |
        Turns the one-time code of a sign-in the phone app started into a
        bearer token. A code works once, for 60 seconds, and only with the
        verifier whose challenge started the sign-in. A code that was
        presented is spent, whatever the answer. The answer is never cached
        (`Cache-Control: no-store`, as on every answer).

        Every refusal is the same 400: an unknown, used or expired code, a
        wrong verifier (or one that is not of RFC 7636's form), or a user who
        was disabled in the meantime. The app starts the sign-in again.
      tags: [session]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppTokenRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppToken"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/TooManyAttempts"

  /api/auth/dev-login:
    post:
      operationId: devSignIn
      summary: Development sign-in
      description: |
        Signs in as the configured development user without Google. Exists
        only when the engine runs with `PONI_DEV_LOGIN_EMAIL` on plain
        `http://localhost`; otherwise it answers 404 like any unknown path.

        With `client=ios` it answers with a bearer token, as `POST
        /api/auth/app-token` does, and sets no cookie.
      tags: [session]
      security: []
      parameters:
        - name: client
          in: query
          description: Left out by the dashboard. `ios` for the phone app.
          schema:
            type: string
            enum: [ios]
      responses:
        "200":
          description: >-
            Signed in. Without `client`: the session, and the session cookie
            is set. With `client=ios`: the token, and no cookie.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Session"
                  - $ref: "#/components/schemas/AppToken"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          description: The development user is disabled (`user_disabled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyAttempts"

  /api/auth/logout:
    post:
      operationId: signOut
      summary: Sign out
      description: |
        Ends the session and clears the cookie. With a bearer token it ends
        that token, needs no CSRF token and touches no cookie.
      tags: [session]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/clients:
    get:
      operationId: listClients
      summary: List clients
      description: Clients in name order.
      tags: [clients]
      parameters:
        - name: archived
          in: query
          description: Only archived (`true`) or only active (`false`) clients. Both when left out.
          schema:
            type: boolean
        - name: q
          in: query
          description: Part of the name.
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createClient
      summary: Create a client
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreate"
      responses:
        "201":
          description: The new client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Another client already has this name (`name_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/clients/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getClient
      summary: Get a client
      tags: [clients]
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateClient
      summary: Change a client
      description: |
        Changes the fields that are given. Archiving a client stops the review
        sync of its locations; nothing is deleted.
      tags: [clients]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: The client after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another client already has this name (`name_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/locations:
    get:
      operationId: listLocations
      summary: List locations
      description: Every location the GBP managing account can see or could see, in title order.
      tags: [locations]
      parameters:
        - name: client_id
          in: query
          description: Only this client's locations.
          schema:
            type: integer
            format: int64
        - name: linked
          in: query
          description: Only locations linked to a client (`true`) or not yet linked (`false`).
          schema:
            type: boolean
        - name: access_status
          in: query
          schema:
            $ref: "#/components/schemas/AccessStatus"
        - name: q
          in: query
          description: Part of the title.
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of locations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/locations/discover:
    post:
      operationId: discoverLocations
      summary: Look for locations now
      description: |
        Asks the engine to list the managing account's locations on Google
        right away instead of waiting for the next scheduled discovery. The
        work runs in the background; reload the list a few seconds later.
      tags: [locations]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: Discovery was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enqueued"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/locations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getLocation
      summary: Get a location
      tags: [locations]
      responses:
        "200":
          description: The location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateLocation
      summary: Link a location to a client
      description: |
        Sets or clears the location's client, changes how often its reviews
        are polled, or flips its posting switch. Reviews are synced only for
        locations that are linked to a client; linking starts a full sync
        within a minute. Everything else about a location comes from Google
        and can't be changed here.

        Linking gives the location its reply settings (D-093): a copy of the
        settings of the client's earliest-linked other location, or of the
        knowledge base's defaults when it is the client's first. Clearing the
        client removes them, and a move to another client replaces them with
        a copy from that client: a voice describes one business.
      tags: [locations]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: The location after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The client doesn't exist or is archived (`client_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/reviews:
    get:
      operationId: listReviews
      summary: List reviews
      description: The review inbox. Newest first unless `sort` and `order` say otherwise.
      tags: [reviews]
      parameters:
        - name: client_id
          in: query
          schema:
            type: integer
            format: int64
        - name: location_id
          in: query
          schema:
            type: integer
            format: int64
        - name: rating
          in: query
          description: Star ratings to include, for example `rating=1,2`.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
              minimum: 1
              maximum: 5
        - name: status
          in: query
          description: "`active` (the default): on Google now. `removed`: gone from Google. `all`: both."
          schema:
            type: string
            enum: [active, removed, all]
            default: active
        - name: language
          in: query
          description: A language code as in `Review.language`, or `none` for reviews without text.
          schema:
            type: string
        - name: has_reply
          in: query
          schema:
            type: boolean
        - name: q
          in: query
          description: Part of the review text or the reviewer's name.
          schema:
            type: string
        - name: analyzed
          in: query
          description: Reviews that have (or lack) an analysis.
          schema:
            type: boolean
        - name: sentiment
          in: query
          description: Of the review's newest analysis.
          schema:
            type: string
            enum: [positive, mixed, neutral, negative, none]
        - name: flagged
          in: query
          description: Reviews whose newest analysis raised (or didn't raise) a severity flag.
          schema:
            type: boolean
        - name: manipulation
          in: query
          description: Reviews suspected (or not) of trying to manipulate the AI.
          schema:
            type: boolean
        - name: ignored
          in: query
          description: Reviews a person marked as needing no reply (or the others).
          schema:
            type: boolean
        - name: has_draft
          in: query
          description: Reviews that have (or lack) a draft, whatever its status.
          schema:
            type: boolean
        - name: route
          in: query
          description: The route of the review's newest draft.
          schema:
            $ref: "#/components/schemas/DraftRoute"
        - name: draft_status
          in: query
          description: The status of the review's newest draft. The approval queue is `draft_status=draft`.
          schema:
            type: string
            enum: [draft, scheduled, approved, posting, posted, published, rejected, cancelled, superseded]
        - name: sort
          in: query
          description: "`draft_time`: when the newest draft was written."
          schema:
            type: string
            enum: [created_time, updated_time, rating, draft_time]
            default: created_time
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of reviews.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/reviews/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getReview
      summary: Get a review
      tags: [reviews]
      responses:
        "200":
          description: The review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/reviews/{id}/events:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listReviewEvents
      summary: A review's history
      description: |
        What the sync noticed about the review, oldest first: when it was
        first seen, edits by the reviewer, replies added, changed or removed
        on Google, and whether the review was removed or came back.
      tags: [reviews]
      responses:
        "200":
          description: The review's events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEventList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/reviews/{id}/drafts:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listReviewDrafts
      summary: A review's drafts
      description: |
        Every reply drafted for the review, newest first, each with the
        `inputs` that shaped its prompt (FR-4). At most one has the status
        `draft`; older ones are `superseded` or `cancelled`.
      tags: [analysis]
      responses:
        "200":
          description: The review's drafts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraftList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/reviews/{id}/ignore:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: ignoreReview
      summary: Mark a review as needing no reply
      description: |
        Not every review has to be answered. This records a person's
        decision to leave the review without a reply: its waiting draft is
        cancelled, no new draft is written, and it leaves the approval
        queue. The decision can be undone, and it ends by itself if the
        reviewer edits the review. An escalation of the review is not
        touched. Doing it twice changes nothing.
      tags: [replies]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewIgnoreRequest"
      responses:
        "200":
          description: The review after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The review can't be ignored (`review_not_ignorable`): it was
            removed, it already has a reply, or a reply to it is approved or
            on its way to Google.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/reviews/{id}/unignore:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: unignoreReview
      summary: Undo "no reply needed"
      description: The review is drafted for again on the pipeline's next pass, within about a minute.
      tags: [replies]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The review after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/reviews/{id}/analyze:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: analyzeReview
      summary: Analyze a review again
      description: |
        Queues a fresh analysis of the review and, if it has no reply, a new
        draft that replaces the current one. Use it after changing a voice,
        a policy or an industry profile. Nothing is posted to Google.
      tags: [analysis]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: The analysis was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enqueued"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The review can't be analyzed: it was removed, its client has no
            industry profile, or its location isn't synced (`not_analyzable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/locations/{id}/reply-settings:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getLocationReplySettings
      summary: A location's reply settings
      description: |
        The voice, localization preferences and policy the location's replies
        are written with (FR-4, FR-5, D-093). They are the location's own and
        complete: nothing is merged in from its client or from the knowledge
        base. A location gets them when it is linked to a client, as a copy
        of the settings of the client's earliest-linked other location, or of
        the knowledge base's defaults when it is the client's first.
      tags: [settings]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplySettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReplySettingsConflict"
    put:
      operationId: replaceLocationReplySettings
      summary: Replace a location's reply settings
      description: |
        Every field is sent, and what is stored is replaced whole (D-093).
        Taking a voice template is filling the form from `GET /api/knowledge`
        and saving; copying the settings to another location is this call
        for that location. A change of what the models are asked means a new
        go-live test before the location auto-posts again (D-074).
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplySettingsUpdate"
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplySettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReplySettingsConflict"

  /api/knowledge:
    get:
      operationId: getKnowledge
      summary: The knowledge base
      description: |
        Everything the system knows that is the same for every client:
        the supported industries, the severity flags of every industry, the
        voice templates, the defaults and the model prices, with the version
        that is seeded and since when. The corpus texts are left out; see
        `GET /api/knowledge/industries/{key}/corpus`.
      tags: [knowledge]
      responses:
        "200":
          description: The knowledge base as it is seeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Knowledge"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/knowledge/industries/{key}/corpus:
    parameters:
      - name: key
        in: path
        required: true
        description: The industry's key.
        schema:
          type: string
    get:
      operationId: getKnowledgeCorpus
      summary: An industry's test corpus
      description: |
        The synthetic reviews a go-live test of a client of this industry
        runs, with what is expected of each (architecture section 10).
      tags: [knowledge]
      responses:
        "200":
          description: The corpus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeCorpus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/ai/settings:
    get:
      operationId: getAiSettings
      summary: Analysis pipeline settings
      description: |
        The model per task (D-030) and the batch size. Each setting's
        default is in the knowledge base (`Knowledge.defaults.analysis`), and
        so are the model prices for the cost estimate.
      tags: [settings]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateAiSettings
      summary: Change the analysis pipeline settings
      description: Changes the fields that are given. A map or list that is given replaces the stored one.
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSettingsUpdate"
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/llm/usage:
    get:
      operationId: getLlmUsage
      summary: LLM usage and cost
      description: |
        Calls, tokens and estimated cost between two days, in total and by
        day, model, task and client. The cost is an estimate from the prices
        in the pipeline settings at the time of each call.
      tags: [llm]
      parameters:
        - name: from
          in: query
          description: First day (UTC), `YYYY-MM-DD`. Default, 29 days before `to`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Last day (UTC), `YYYY-MM-DD`, included. Default, today.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmUsage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/llm/calls:
    get:
      operationId: listLlmCalls
      summary: List LLM calls
      description: Every request sent to the model, newest first, failed attempts included. Prompts and answers are not stored here.
      tags: [llm]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of calls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmCallList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/drafts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getDraft
      summary: Get a draft
      description: The draft with the `inputs` that shaped its prompt and, once approved, the engine's post.
      tags: [replies]
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateDraft
      summary: Edit a draft's text
      description: |
        Replaces the text of a draft that is still waiting (`draft`). The
        reply checks run again on the new text and are stored with it; a
        draft with a failed check is saved but can't be approved.
      tags: [replies]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftUpdate"
      responses:
        "200":
          description: The draft after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DraftConflict"

  /api/drafts/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: approveDraft
      summary: Approve a draft and post it
      description: |
        The only way a reply reaches Google. The body carries the text the
        person read; it must equal the stored text, so nobody approves an
        edit they haven't seen. The draft becomes `approved` and a job posts
        it at once. Just before posting, the engine reads the review from
        Google again and stops unless it still exists, is unchanged since
        the draft was written and has no reply. The draft then moves to
        `posting`, `posted` (Google accepted the reply) and `published` (a
        later read saw it on Google; Google holds a new reply for a few
        minutes).
      tags: [replies]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftApproval"
      responses:
        "202":
          description: The draft was approved and queued for posting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DraftConflict"

  /api/drafts/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: rejectDraft
      summary: Reject a draft
      description: |
        The draft becomes `rejected` with the reason, and no new draft is
        written for this version of the review. "Analyze again" on the
        review starts over.
      tags: [replies]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRejection"
      responses:
        "200":
          description: The rejected draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DraftConflict"

  /api/drafts/{id}/regenerate:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: regenerateDraft
      summary: Write the draft again with instructions
      description: |
        Asks the model for a new reply to the same review, with the staff
        member's instructions added to the prompt. The answer is a new draft
        that replaces this one (which becomes `superseded`). The call waits
        for the model, usually a few seconds.
      tags: [replies]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRegeneration"
      responses:
        "201":
          description: The new draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DraftConflict"
        "502":
          description: The model gave no usable answer (`model_unavailable`). The draft is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/drafts/{id}/unschedule:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: unscheduleDraft
      summary: Take a scheduled reply out of auto-posting
      description: |
        A draft the policy scheduled for an automatic post returns to the
        approval queue as `draft`, where a person edits, approves or rejects
        it. The job that would have posted it finds nothing to do.
      tags: [auto-posting]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The draft, now waiting for a person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyDraft"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`draft_not_scheduled`: the draft is not scheduled (it was posted, stopped or taken back already)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auto-posting:
    get:
      operationId: getAutoPosting
      summary: Auto-posting everywhere
      description: |
        The pause on every location, the global posting switch, and each
        linked location's auto-posting settings. Everything is off after
        installation.
      tags: [auto-posting]
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPostingOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/auto-posting/resume:
    post:
      operationId: resumeAllAutoPosting
      summary: Lift the pause on every location
      description: |
        The engine pauses auto-posting everywhere when Google refuses its
        token or its permission for an automatic reply. Only a person lifts
        the pause. Replies stopped meanwhile stay in the approval queue.
      tags: [auto-posting]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The overview after resuming.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPostingOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/locations/{id}/auto-posting:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateLocationAutoPosting
      summary: Change a location's auto-posting settings
      description: |
        Switching auto-posting on lets the engine post replies to this
        location's reviews without a person: drafts routed to `auto_post`
        for the chosen star ratings, written from then on. It is refused
        (400) unless a star rating is chosen, the location is linked and
        accessible, and the reply policy's timing can be used (a posting
        window needs `time_zone`). The global and the location's posting
        switch still apply on top, and nothing is auto-posted until the
        location's configuration has passed a go-live test (`go_live_state`,
        D-074). Switching on or off is audited under its own action.
      tags: [auto-posting]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoPostingUpdate"
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPosting"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/locations/{id}/auto-posting/resume:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: resumeLocationAutoPosting
      summary: Lift a location's pause
      description: |
        The engine pauses auto-posting at a location when
        `pause_after_failures` replies in a row failed a reply check, when an
        automatic reply did not appear on
        Google, or when Google refused one. Only a person lifts the pause.
        Replies stopped meanwhile stay in the approval queue.
      tags: [auto-posting]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The settings after resuming.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPosting"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auto-posts:
    get:
      operationId: listAutoPosts
      summary: Replies posted without a person
      description: Newest first, with the version of the rules that decided each one and the time from the review to the reply.
      tags: [auto-posting]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of auto-posts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoPostList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/go-live:
    get:
      operationId: getGoLive
      summary: Where every client's go-live test stands
      description: |
        A location may auto-post only while its configuration has a passing
        go-live test (D-074). The configuration is identified by a
        fingerprint of everything that changes what the models are asked and
        what the code checks: the prompts as rendered for the location, each
        task's provider, model, temperature, token limit and request extras,
        and the limits the reply checks read. Locations of a client with the
        same fingerprint are one configuration. Each comes with its state
        and an estimate of what a test would take.
      tags: [go-live]
      responses:
        "200":
          description: Every client that has a linked location, by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoLiveOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/clients/{id}/go-live-test:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: startGoLiveTest
      summary: Submit a client for go-live testing
      description: |
        Starts one run for each configuration of the client that has none
        running. A run sends the attack, severity and control cases of the
        client's industry and the client's own newest 4 and 5 star reviews
        (D-075) through the analyzer and the writer three times each, and
        has the judge rate the replies that would have been posted without a
        person. This calls the models and costs money (`GoLiveEstimate`). A
        test never starts by itself, nothing is posted, and a pass switches
        nothing on. Refused (400) when a task's model provider is not
        configured or the client has no linked location or industry profile.
      tags: [go-live]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: The runs that were started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoLiveRunList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/GoLiveConflict"

  /api/go-live-runs/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getGoLiveRun
      summary: One go-live test with its cases
      tags: [go-live]
      responses:
        "200":
          description: The run; `cases` holds every case with its replies and ratings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoLiveRun"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/go-live-runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: cancelGoLiveRun
      summary: Stop a running go-live test
      description: |
        The run makes no further model calls. What it spent stays recorded,
        and its result counts for nothing: the configuration is as untested
        as before.
      tags: [go-live]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The cancelled run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoLiveRun"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/GoLiveConflict"

  /api/reports:
    get:
      operationId: listReports
      summary: List reports
      description: Newest first, without their pages and share links.
      tags: [reports]
      parameters:
        - name: client_id
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReportStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/clients/{id}/reports:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: createReport
      summary: Generate a report now
      description: |
        Starts a report of the client for any period that is over. A job
        builds it: the answer is the report as `building`, and it becomes a
        `draft` (or `failed`) shortly after. Building sends nothing and
        shares nothing. It may call the model once, for the summary.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCreate"
      responses:
        "201":
          description: The report, building.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/reports/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getReport
      summary: Get a report
      description: With its share links.
      tags: [reports]
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/reports/{id}/html:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getReportPage
      summary: The report's page
      description: |
        The stored page, exactly as a client sees it through a share link:
        one HTML document without scripts. It holds review text, which is
        untrusted, so it is sent with a sandboxing content security policy;
        show it in a sandboxed frame or its own tab.
      tags: [reports]
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/reports/{id}/send:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: sendReport
      summary: Send a report to the client
      description: |
        Puts the page into the public bucket under a new share link and
        emails the client's recipients (the `client_report` rule of the
        client) the headline numbers and that link. Only a `draft` can be
        sent, once. Refused while email sending is switched off or the
        client has no recipients: a report is never marked sent that reached
        nobody.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The report, sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReportConflict"
        "502":
          $ref: "#/components/responses/StorageFailed"

  /api/reports/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: rejectReport
      summary: Reject a report
      description: A `draft` or `failed` report becomes `rejected`. It stays in the list; nothing is deleted.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The report, rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReportConflict"

  /api/reports/{id}/share-links:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: createReportShareLink
      summary: Make a share link
      description: |
        Puts a copy of the page into the public bucket under a random name
        (32 random bytes) and returns its address. Anyone who has the
        address can read the page, without signing in; nobody can list the
        bucket. For a `draft` or a `sent` report.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: The new link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportShareLink"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReportConflict"
        "502":
          $ref: "#/components/responses/StorageFailed"

  /api/report-share-links/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: revokeReportShareLink
      summary: Revoke a share link
      description: |
        Replaces the link's page in the bucket with a page that says the
        report is no longer available, then marks the link revoked. Revoking
        a revoked link changes nothing.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The link, revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportShareLink"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReportConflict"
        "502":
          $ref: "#/components/responses/StorageFailed"

  /api/report-schedules:
    get:
      operationId: listReportSchedules
      summary: List report schedules
      tags: [reports]
      responses:
        "200":
          description: Every schedule, by client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportScheduleList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createReportSchedule
      summary: Add a report schedule
      description: |
        A client may have any number. A schedule's first run is the first
        one after it was made; it never runs for a time that has passed.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportScheduleCreate"
      responses:
        "201":
          description: The new schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSchedule"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/report-schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateReportSchedule
      summary: Change a report schedule
      description: Changes the fields that are given. A changed schedule does not run for a time that passed before the change.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportScheduleUpdate"
      responses:
        "200":
          description: The schedule after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSchedule"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteReportSchedule
      summary: Remove a report schedule
      description: Removes the schedule. The reports it built stay.
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The schedule is gone.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/local-posts:
    get:
      operationId: listLocalPosts
      summary: List local posts
      description: |
        The posts of every location: drafts, posts the engine sent, and
        posts made in Google's own interface, which the sync finds.

        They are ordered by one key: the time Google created the post, or,
        for a post Google does not have, the time the draft was written;
        then by `id`. Newest first unless `order=asc`, which reverses both,
        so that paging is stable either way.
      tags: [local-posts]
      parameters:
        - name: client_id
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: location_id
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: status
          in: query
          description: Our states to include, for example `status=draft` or `status=rejected,removed`.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LocalPostStatus"
        - name: google_state
          in: query
          description: |
            Google's states to include, for example `google_state=live,recurring`.
            `none` takes every post that has no state from Google, whatever its
            `status`: a draft, a rejected draft, a post that is `approved`,
            `sending`, `unknown` or `failed`, and a sent post Google has not been
            read back for yet. It combines with the others:
            `google_state=none,processing` adds the posts Google is still taking
            in, and `status` narrows the result as usual. `none` is a word of
            this filter only; a post's `google_state` is then null.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LocalPostGoogleStateFilter"
        - name: order
          in: query
          description: "`desc`: newest first. `asc`: oldest first. The key is in the description above."
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of local posts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPostList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/local-posts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getLocalPost
      summary: Get a local post
      description: |
        The post as the engine holds it. Who did what to it is in the audit
        log: `GET /api/audit-log?object_type=local_post&object_id={id}`.
      tags: [local-posts]
      responses:
        "200":
          description: The local post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPost"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateLocalPost
      summary: Edit a draft
      description: |
        Replaces the content of a post that is still a `draft`; the body
        carries every field. The checks run again and are stored with it: a
        draft with a failed check is saved but can't be approved. A post
        that is at Google is never edited: remove it and make a new one.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalPostContent"
      responses:
        "200":
          description: The draft after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPost"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"
    delete:
      operationId: deleteLocalPost
      summary: Delete a draft
      description: |
        Deletes a post that Google never had: a `draft` or a `rejected`
        draft (D-094). The audit entry keeps its content. Its uploaded
        photo or video stays for other posts until the bucket's lifecycle
        rule removes it. Every other status is refused with
        `local_post_not_open`, `failed` included: a send that was given up
        is still adopted when the post turns up at Google. A post that is at
        Google is removed there instead (`POST /api/local-posts/{id}/remove`).
        A copy that is deleted leaves its source's `copies`; the copies of a
        post that is deleted keep their content and get `copied_from_id: null`.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The draft is gone.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"

  /api/local-posts/{id}/copy:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: copyLocalPost
      summary: Copy a post as a new draft
      description: |
        A new `draft` for the same location with the post's content as the
        engine holds it now, written by the caller (D-094). Any post can be
        copied, whatever its status, also one made in Google's own
        interface. Nothing goes to Google and nothing is queued: the copy is
        approved like any other draft.

        What a draft cannot hold is left out, and the draft's
        `status_reason` names each thing: an alert becomes an update, a
        button outside the six a draft has is dropped, a time to publish at
        that has passed is dropped. A post written here keeps its uploaded
        photo or video (`media_id`). A post made at Google brings no photo
        and no video: the engine fetches nothing from Google, and the reason
        says to upload the file again. The checks run on the copy as on any
        draft.

        The copy's `copied_from_id` names the post it was copied from, and
        that post lists the copy in its `copies` (D-098).
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: The new draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPost"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"

  /api/local-posts/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: approveLocalPost
      summary: Approve a draft and send it to Google
      description: |
        The only way a local post reaches Google (D-088). The body carries
        the content the person read; it must equal the stored content, so
        nobody approves an edit they haven't seen. The post becomes
        `approved` and a job sends it at once, with its `scheduled_time` and
        repeat: Google publishes it, the engine has no timer. The post then
        moves to `sending` and `sent`; `google_state` says where it stands
        at Google. Refused while a posting switch is off.

        Google refusing the content returns the post to `draft` with
        Google's message. A send whose outcome is not known (a timeout, a
        5xx) is never repeated: the post is `unknown` until the sync finds
        it at Google, or `failed` when it is not there 15 minutes later.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalPostContent"
      responses:
        "202":
          description: The post was approved and queued for sending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPost"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"

  /api/local-posts/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: rejectLocalPost
      summary: Reject a draft
      description: The draft becomes `rejected` and stays in the list. Only a `draft` can be rejected.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalPostRejection"
      responses:
        "200":
          description: The rejected post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPost"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"

  /api/local-posts/{id}/remove:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: removeLocalPost
      summary: Delete a local post at Google
      description: |
        Asks for the post to be deleted at Google: any post of a linked
        location that Google has, also one made in Google's own interface.
        This is the only way to stop a scheduled post or take one down. A
        job sends the delete; the post is `removed` once Google has
        confirmed it (or answers that it is already gone). The audit entry
        keeps a copy of the post's content. It works while posting is
        switched off. Asking again for a post whose removal is under way,
        or that is removed, changes nothing.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: The post, with the removal requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPost"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"

  /api/local-post-media:
    post:
      operationId: uploadLocalPostMedia
      summary: Upload a photo or a video for a local post
      description: |
        The body is the file itself. The engine reads what the file is from
        its own bytes, not from the Content-Type, and checks what Google
        requires: of a photo, JPG or PNG, 10 KB to 5 MB and at least 250
        pixels on the short side; of a video (D-090), an MP4 or QuickTime
        file of at most 30 seconds, at most 75 MB and at least 720 pixels
        on the short side. It puts the bytes, unchanged, into the public
        bucket under a random name (`p/` and 32 random bytes): Google takes
        a post's media only from a public address. The answer's `id` goes
        into a draft's `media_id`; one upload can serve several posts.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          video/mp4:
            schema:
              type: string
              format: binary
          video/quicktime:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The stored file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPostMedia"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/LocalPostConflict"
        "413":
          description: The file is larger than the engine accepts (`payload_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The file could not be put into the public bucket (`storage_failed`). Nothing was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/locations/{id}/local-posts:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: createLocalPost
      summary: Write a draft of a local post
      description: |
        A new `draft` for the location. Nothing goes to Google until a
        person approves it. The same content for several locations is
        several posts: one call per location.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalPostContent"
      responses:
        "201":
          description: The draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPost"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"

  /api/locations/{id}/local-posts/refresh:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: refreshLocalPosts
      summary: Read the location's posts from Google now
      description: |
        Queues the read that otherwise runs once an hour: the location's
        posts are listed at Google and stored, so states, posts made at
        Google and removals show up. The answer comes before the read. To
        see that a read has ended, read `Location.local_posts_synced_at` and
        `Location.local_posts_sync_error_at` before asking and again later:
        a read that succeeded moved the first, one that failed moved the
        second (the engine's clock wrote both, so compare the two values,
        not a time of the client's). A read already under way may move
        either too. A read that fails is tried again after a delay, up to
        three reads in all, so a failure may still be followed by a success.
        Neither moves when the location stopped being synced in between (it
        was unlinked, its client archived, or access lost), so a client
        stops waiting after a time of its own choosing. Posts that
        Google no longer has are marked removed after
        `local_posts_synced_at` has moved, one by one, so a removal can
        show up a moment later.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: The read was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enqueued"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"

  /api/locations/{id}/review-highlights:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getReviewHighlights
      summary: What customers praised lately
      description: |
        From the stored analysis of the location's reviews of the last 90
        days, without a model call: the topics and items praised most, the
        languages the reviews are in, and a few recent reviews. Reviews
        flagged for a severity issue or suspected manipulation are left out.
      tags: [local-posts]
      responses:
        "200":
          description: The highlights.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewHighlights"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/locations/{id}/local-post-ideas:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: suggestLocalPostIdeas
      summary: Ask the model for ideas for posts
      description: |
        Three to five ideas, from the location's reviews of the last 90
        days and their analysis, Google's performance figures and search
        keywords, the recent posts, the industry profile, the voice and the
        client's `audience`. A reviewer's name or photo is never given to
        the model. Nothing is stored. The call waits for the model. Refused
        with fewer than 10 analysed reviews in the period.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The ideas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPostIdeas"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"
        "502":
          description: The model gave no usable answer (`model_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/locations/{id}/local-post-drafts:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: suggestLocalPostDraft
      summary: Ask the model for a post's text
      description: |
        Writes a text from a brief, or improves the current one, with the
        same knowledge of the location as the ideas. Nothing is stored: the
        answer goes into the form, and a person decides what becomes a
        draft. The call waits for the model.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalPostDraftRequest"
      responses:
        "200":
          description: The suggested text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPostSuggestion"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"
        "502":
          description: The model gave no usable answer (`model_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/escalations:
    get:
      operationId: listEscalations
      summary: List escalations
      description: |
        Reviews on which the analyzer raised a severity flag (FR-6), newest
        first. An escalation is the simplest form of a case (D-054): opened
        by a flag, assigned to one person, closed with a reason.
      tags: [escalations]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EscalationStatus"
        - name: client_id
          in: query
          schema:
            type: integer
            format: int64
        - name: location_id
          in: query
          schema:
            type: integer
            format: int64
        - name: assignee_id
          in: query
          description: Only escalations assigned to this user.
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of escalations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/escalations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getEscalation
      summary: Get an escalation
      description: |
        The escalation as it is now, with its review. What happened to it
        is in two logs, which a client reads and puts in order by time:

        - Who did what: `GET /api/audit-log?object_type=escalation&object_id={id}`.
          `escalation.open` and `escalation.reopen` (a closed escalation
          opened again because a newer analysis of the review still flags
          it) are done by `system:review-analysis`; their `after` holds
          `review_id` and `severity_flags`, the ids of the flags raised.
          `escalation.assign` is done by the person who assigned it (the
          `actor`); `before.assignee_id` and `after.assignee_id` are user
          ids, and `after.assignee_id` is null when the assignment was
          lifted. `GET /api/users` lists active users only, so the id of a
          person who was disabled since does not resolve there: show the
          id, or the `actor`'s address where it is the same person. `escalation.close` is done by the person
          who closed it; its `after` holds `status`, `reason` and `note`.
        - What was sent: `GET /api/notification-deliveries?escalation_id={id}`,
          one row per recipient and channel, the emails and the pushes, or
          a single row with an empty `recipient` and the status `not_sent`
          when no rule names a recipient. Deliveries written before push was
          added carry no `escalation_id`.
      tags: [escalations]
      responses:
        "200":
          description: The escalation with its review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escalation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/escalations/{id}/assign:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: assignEscalation
      summary: Assign an escalation
      description: Gives the escalation to one staff member, or to nobody (`assignee_id` null).
      tags: [escalations]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationAssignment"
      responses:
        "200":
          description: The escalation after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escalation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EscalationConflict"

  /api/escalations/{id}/close:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: closeEscalation
      summary: Close an escalation
      tags: [escalations]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationClosure"
      responses:
        "200":
          description: The closed escalation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escalation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EscalationConflict"

  /api/users:
    get:
      operationId: listUsers
      summary: List staff
      description: Everyone who has signed in and isn't disabled, by name. Used to assign an escalation.
      tags: [session]
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/notification-rules:
    get:
      operationId: listNotificationRules
      summary: List notification rules
      description: |
        Who is told about what (FR-7): event type × client → recipients. A
        rule without a client applies to every client and to events that
        belong to none (system problems). A rule for `client_report` holds
        the addresses a client's reports are sent to and must name the
        client (D-085). A `push` rule (D-097) is for `escalation` or
        `system_problem` only; its recipients are staff, and each is
        delivered to that person's devices with the phone app.
      tags: [notifications]
      responses:
        "200":
          description: Every rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRuleList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createNotificationRule
      summary: Add a notification rule
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRuleCreate"
      responses:
        "201":
          description: The new rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRule"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/RuleConflict"

  /api/notification-rules/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getNotificationRule
      summary: Get a notification rule
      tags: [notifications]
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRule"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateNotificationRule
      summary: Change a notification rule
      description: Changes the fields that are given.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRuleUpdate"
      responses:
        "200":
          description: The rule after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRule"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RuleConflict"
    delete:
      operationId: deleteNotificationRule
      summary: Remove a notification rule
      description: Removes the rule. Deliveries it caused stay in the log.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The rule is gone.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/notification-deliveries:
    get:
      operationId: listNotificationDeliveries
      summary: The delivery log
      description: |
        Every notification the engine tried to deliver, newest first, one
        row per recipient. `not_sent` means the engine did not try: sending
        is switched off, the sender isn't signed in, or no rule names a
        recipient for the event. A `push` row is one person: it is sent to
        each of their devices, and `status_reason` says how many it reached;
        it is `not_sent` when the person has no device.
      tags: [notifications]
      parameters:
        - name: event_type
          in: query
          schema:
            $ref: "#/components/schemas/NotificationEventType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DeliveryStatus"
        - name: escalation_id
          in: query
          description: Only the deliveries of this escalation's events (`NotificationDelivery.escalation_id`).
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of deliveries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeliveryList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/devices:
    post:
      operationId: registerDevice
      summary: Register this device for push
      description: |
        Registers the phone app's APNs token for the session that sends it
        (D-097): a device belongs to its app session, so signing out, a
        session that ends and a user who is disabled stop its pushes. One
        device per session: registering again replaces the token. A token
        another session had moves to this one, since a shared device
        changes hands. A registration that changes nothing writes nothing.
        Only the app's bearer token registers a device. An engine sends to
        one APNs environment; a token of the other is refused with a 400.
        What a push carries, and what raises one, is `PushPayload` and
        `NotificationEventType`.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: unregisterDevice
      summary: Stop push to this device
      description: Removes a device of the signed-in user; another user's device is a 404.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/notifications/test:
    post:
      operationId: sendTestNotification
      summary: Send a test email
      description: |
        Queues one test message to the address given, through the same
        channel and log as every other notification. With sending switched
        off it ends as `not_sent` in the delivery log.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestNotification"
      responses:
        "202":
          description: The delivery that was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDelivery"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/system/settings:
    get:
      operationId: getSystemSettings
      summary: The posting and sending switches
      description: |
        `posting_enabled` is the global kill switch: off,
        no reply is posted to Google and no draft can be approved. Each
        location has its own switch on top (`Location.posting_enabled`).
        `email_sending_enabled` lets notifications leave as email.
      tags: [system]
      responses:
        "200":
          description: The switches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateSystemSettings
      summary: Flip the posting or sending switch
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemSettingsUpdate"
      responses:
        "200":
          description: The switches after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/audit-log:
    get:
      operationId: listAuditLog
      summary: List audit entries
      description: Who did what, newest first. Entries are never changed or deleted.
      tags: [audit]
      parameters:
        - name: action
          in: query
          description: An exact action, for example `location.link`.
          schema:
            type: string
        - name: object_type
          in: query
          schema:
            type: string
        - name: object_id
          in: query
          schema:
            type: string
        - name: actor
          in: query
          description: Part of the actor (an email address, or `system:`).
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/system/status:
    get:
      operationId: getSystemStatus
      summary: System status
      description: |
        The state of the engine's integrations: whether the GBP token works,
        when locations were last discovered, the last review sync of every
        location, Pub/Sub notifications, the analysis pipeline, and jobs that
        failed.
      tags: [system]
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-poni_session
      description: |
        The session cookie set by signing in: HttpOnly, SameSite=Strict, and
        Secure. On plain `http://localhost` in development it is called
        `poni_session` and isn't Secure. A changing request with it must
        carry `X-CSRF-Token`.
    bearer:
      type: http
      scheme: bearer
      description: |
        The phone app's token, from `POST /api/auth/app-token` (D-095), sent
        as `Authorization: Bearer <token>`. The engine reads it from that
        header and from nowhere else. A request with this header is the
        token's alone: a cookie sent beside it is not looked at, and a token
        that is unknown or has ended is a 401 on every route that needs a
        session. A route that needs none (`GET /api/session`, the sign-in
        routes, `GET /api/health`) does not refuse an unknown token, and
        `GET /api/session` among them answers it with a 200 and
        `authenticated: false`. A token needs no CSRF token.

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: The engine's own id of the object.
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      description: Page number, from 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ConnectionAccount:
      name: account
      in: path
      required: true
      description: Which Google account. `gbp`, the GBP managing account; `gmail`, the mailbox notifications are sent from.
      schema:
        type: string
        enum: [gbp, gmail]
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: >-
        The session's CSRF token, from `GET /api/session`. A request with
        the session cookie must carry it, or the answer is a 403. A request
        with a bearer token needs none and leaves it out.
      schema:
        type: string

  responses:
    Unauthenticated:
      description: Nobody is signed in, or the session has ended (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        The request was refused: the CSRF token is missing or wrong
        (`csrf_token_invalid`), or it came from another site (`forbidden_origin`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: There is no such object (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: A parameter or the body is not valid (`invalid_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReplySettingsConflict:
      description: |
        `location_not_linked`: the location is not linked to a client, and
        only a linked location has reply settings. `reply_settings_incomplete`
        (reading only): the stored settings lack a field, which the message
        names; replacing them repairs it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DraftConflict:
      description: |
        The draft can't take this action. `draft_not_open`: it is no longer
        waiting (already approved, posted, rejected, replaced). `draft_changed`:
        the text sent is not the stored text. `draft_empty`: there is no text
        to post. `checks_failed`: a reply check fails on the text.
        `posting_disabled`: the global or the location's posting switch is
        off. `review_not_postable`: the review was removed, edited since the
        draft was written, already has a reply, or its location isn't synced.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GoLiveConflict:
      description: |
        `go_live_running`: every configuration of the client already has a
        test running. `go_live_not_running`: the test has ended, so there is
        nothing to cancel.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EscalationConflict:
      description: |
        The escalation is closed (`escalation_closed`), or the user named
        doesn't exist or is disabled (`user_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReportConflict:
      description: |
        `report_not_ready`: the report is not in the state the request needs
        (still building, failed, sent or rejected). `sending_off`: email
        sending is switched off, so a report would reach nobody.
        `no_recipients`: no enabled `client_report` rule names an address for
        the client. `client_archived`: the client is archived.
        `no_public_bucket`: the engine has no public bucket
        (`PONI_PUBLIC_BUCKET`), so nothing can be shared. `report_shared`: a
        report with share links that work can't be rejected; revoke them
        first.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StorageFailed:
      description: |
        The page could not be put into the public bucket (`storage_failed`).
        Nothing was recorded and nothing was sent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LocalPostConflict:
      description: |
        The request can't be carried out as things are. `local_post_not_open`:
        the post is no longer a `draft`, so it can't be edited, approved or
        rejected; or it is not a `draft` or a `rejected` post, so it can't be
        deleted. `local_post_not_copyable`: the post's content can't be held
        by a draft at all (a part longer than a draft takes). `local_post_changed`: the content sent is not the stored
        content. `checks_failed`: a check fails on the content.
        `posting_disabled`: the global or the location's posting switch is
        off. `location_not_synced`: the location is not linked to a client
        that is active, or the engine has lost access to it.
        `local_post_not_at_google`: the post was never sent, or the engine
        does not yet know its name at Google, so there is nothing to
        delete. `no_public_bucket`: the engine has no public bucket
        (`PONI_PUBLIC_BUCKET`), so a post can have no media.
        `too_few_reviews`: fewer than 10 analysed reviews in the last 90
        days, so no ideas are asked for. `local_posts_unavailable`: the
        engine runs against the Google mock, which has no posts.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RuleConflict:
      description: |
        The client named doesn't exist (`client_not_found`), a rule for
        this event type, channel and client already exists (`rule_exists`),
        or a push rule was asked of an engine without the APNs settings
        (`push_not_configured`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: Too many sign-in attempts from this address (`too_many_attempts`).
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: "`ok` when every dependency works, `degraded` otherwise."
        version:
          type: string
          description: Engine version.
          examples: ["0.1.0"]
        database:
          $ref: "#/components/schemas/DatabaseHealth"
    DatabaseHealth:
      type: object
      additionalProperties: false
      required: [reachable]
      properties:
        reachable:
          type: boolean
          description: Whether the engine could run a query just now.

    Error:
      type: object
      description: Body of every error response the engine itself produces.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              examples: [not_found]
            message:
              type: string
              description: Human-readable explanation.

    Session:
      type: object
      additionalProperties: false
      required: [authenticated, user, csrf_token, sign_in, google_mock]
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
          description: The signed-in user; null when nobody is signed in.
        csrf_token:
          type: [string, "null"]
          description: >-
            Send this in `X-CSRF-Token` with every changing request. Null when
            nobody is signed in, and for a bearer token, which needs none.
        sign_in:
          $ref: "#/components/schemas/SignInMethods"
        google_mock:
          type: boolean
          description: >-
            The engine sends its Google calls to the local mock (`poni-tools
            mock-google`, development only, D-087): every location, review and
            reply it shows is made up, and nothing reaches Google.
    AppTokenRequest:
      type: object
      additionalProperties: false
      required: [code, code_verifier]
      properties:
        code:
          type: string
          description: The one-time code `gbpmanager://auth` was opened with.
        code_verifier:
          type: string
          description: >-
            The PKCE verifier whose S256 challenge started the sign-in: 43 to
            128 characters of letters, digits, `-`, `.`, `_` and `~` (RFC 7636).
    AppToken:
      type: object
      additionalProperties: false
      required: [token, expires_at, session]
      properties:
        token:
          type: string
          description: "Send as `Authorization: Bearer <token>`. Shown this once; the engine keeps only its hash."
        expires_at:
          type: string
          format: date-time
          description: >-
            When the token ends at the latest (90 days after signing in). It
            ends earlier after 30 days without a request; either way the
            answer is then a 401 and the person signs in again.
        session:
          $ref: "#/components/schemas/Session"
    User:
      type: object
      additionalProperties: false
      required: [id, email, name, picture_url]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        picture_url:
          type: [string, "null"]
    SignInMethods:
      type: object
      description: The ways of signing in this engine offers.
      additionalProperties: false
      required: [google, dev, domains]
      properties:
        google:
          type: boolean
          description: Google sign-in is set up.
        dev:
          type: boolean
          description: Development sign-in is switched on (local development only).
        domains:
          type: array
          description: >-
            The Google Workspace domains whose accounts may sign in with Google,
            for the sign-in page to show.
          items:
            type: string

    Client:
      type: object
      additionalProperties: false
      required:
        [id, name, notes, audience, archived, industry_key, analyze_from, location_count, reply_settings_variants, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        notes:
          type: string
        audience:
          type: string
          description: |
            Who the customers are, in a line written by staff (D-088). The
            model reads it when it is asked for ideas and texts for local
            posts. Empty when nobody has written one.
        archived:
          type: boolean
          description: Archived clients stay for history; their locations are no longer synced.
        industry_key:
          type: [string, "null"]
          description: |
            The `key` of the industry whose profile the client's reviews are
            analyzed with: one of `Knowledge.industries`. Null, or a key
            that is not among them because a later knowledge base dropped
            it: its reviews are not analyzed until it is given one.
        analyze_from:
          type: [string, "null"]
          format: date
          description: |
            Only reviews written on or after this day (UTC) are analyzed and
            drafted on their own (D-055). Null, every review is. Staff can
            still ask for the analysis of an older review by hand.
        location_count:
          type: integer
          format: int64
          description: Locations linked to the client.
        reply_settings_variants:
          type: integer
          format: int64
          description: |
            How many different reply settings the client's linked locations
            have (D-093): 0 without a linked location, 1 when they are all
            equal. A location whose settings are missing counts as one of its
            own.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ClientCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 5000
        audience:
          type: string
          maxLength: 500
          description: As in `Client`.
        analyze_from:
          type: [string, "null"]
          format: date
          description: As in `Client`. Left out, every review is analyzed.
    ClientUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 5000
        audience:
          type: string
          maxLength: 500
          description: As in `Client`.
        archived:
          type: boolean
        industry_key:
          type: [string, "null"]
          description: The `key` of an industry profile, or null for none.
        analyze_from:
          type: [string, "null"]
          format: date
          description: As in `Client`; null for every review. Left out, it stays as it is.
    ClientList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        total:
          type: integer
          format: int64

    AccessStatus:
      type: string
      enum: [active, lost]
      description: |
        `active`: the managing account can see the location. `lost`: it was
        missing from two discoveries in a row, so access was removed or the
        profile is gone.
    Location:
      type: object
      additionalProperties: false
      required:
        - id
        - gbp_location_id
        - gbp_account_id
        - client_id
        - client_name
        - title
        - store_code
        - primary_category
        - address
        - locality
        - administrative_area
        - postal_code
        - region_code
        - phone
        - website_uri
        - maps_uri
        - access_status
        - access_lost_at
        - first_seen_at
        - last_seen_at
        - review_poll_interval_s
        - posting_enabled
        - review_count
        - unreplied_count
        - average_rating
        - reviews_polled_at
        - reviews_full_synced_at
        - last_sync_error
        - last_sync_error_at
        - local_posts_synced_at
        - local_posts_sync_error
        - local_posts_sync_error_at
        - time_zone
      properties:
        id:
          type: integer
          format: int64
        gbp_location_id:
          type: string
          description: Google's id of the location.
        gbp_account_id:
          type: string
          description: The GBP account the location is reached through.
        client_id:
          type: [integer, "null"]
          format: int64
          description: The client the location is linked to; null until staff link it.
        client_name:
          type: [string, "null"]
        title:
          type: string
        store_code:
          type: [string, "null"]
        primary_category:
          type: [string, "null"]
        address:
          type: [string, "null"]
          description: Street address lines, joined with commas.
        locality:
          type: [string, "null"]
        administrative_area:
          type: [string, "null"]
        postal_code:
          type: [string, "null"]
        region_code:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        website_uri:
          type: [string, "null"]
        maps_uri:
          type: [string, "null"]
        access_status:
          $ref: "#/components/schemas/AccessStatus"
        access_lost_at:
          type: [string, "null"]
          format: date-time
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: The last discovery that saw the location.
        review_poll_interval_s:
          type: integer
          format: int64
          description: Seconds between review polls of this location.
        posting_enabled:
          type: boolean
          description: The location's kill switch for posting replies and local posts; the global switch must be on too.
        review_count:
          type: integer
          format: int64
          description: Reviews on Google now (removed ones not counted).
        unreplied_count:
          type: integer
          format: int64
          description: Of those, the ones without a reply.
        average_rating:
          type: [number, "null"]
          description: Average star rating of the stored reviews; null without reviews.
        reviews_polled_at:
          type: [string, "null"]
          format: date-time
          description: Last successful review poll.
        reviews_full_synced_at:
          type: [string, "null"]
          format: date-time
          description: Last successful full reconciliation of the reviews.
        last_sync_error:
          type: [string, "null"]
          description: Why the last review sync failed; null after a success.
        last_sync_error_at:
          type: [string, "null"]
          format: date-time
        local_posts_synced_at:
          type: [string, "null"]
          format: date-time
          description: When the location's local posts were last read from Google; null before the first read.
        local_posts_sync_error:
          type: [string, "null"]
          description: Why the last read of the local posts failed; null after a success.
        local_posts_sync_error_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the last read of the local posts failed; null after a
            success and before the first failure. A read that fails again
            with the same message moves this time and nothing else, which is
            why it is here: see `POST /api/locations/{id}/local-posts/refresh`
            for how to tell that a read has ended.
        time_zone:
          type: [string, "null"]
          description: |
            The location's time zone, an IANA name such as
            `America/New_York`. It is the same value as
            `AutoPosting.time_zone`, where the posting window uses it, and
            the only one a location has. Google gives none, so it is null
            until a person enters it, in one place only,
            `PATCH /api/locations/{id}/auto-posting`; `LocationUpdate` does
            not take it. A report takes the zone of the client's
            location with the lowest id that has one (`ReportCreate.time_zone`). It does not change how
            date-times are written: they stay UTC, `scheduled_time` and
            `recurrence.until` of a local post included.
    LocationUpdate:
      type: object
      additionalProperties: false
      properties:
        client_id:
          type: [integer, "null"]
          format: int64
          description: The client to link to; null unlinks. Left out, the link stays as it is.
        review_poll_interval_s:
          type: integer
          minimum: 60
          maximum: 86400
        posting_enabled:
          type: boolean
          description: The location's kill switch. Off, no reply and no local post is sent to this location.
    LocationList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        total:
          type: integer
          format: int64
    Enqueued:
      type: object
      additionalProperties: false
      required: [enqueued]
      properties:
        enqueued:
          type: boolean

    Review:
      type: object
      additionalProperties: false
      required:
        - id
        - location_id
        - location_title
        - client_id
        - client_name
        - rating
        - comment
        - original_text
        - translated_text
        - language
        - reviewer_name
        - reviewer_photo_url
        - reviewer_anonymous
        - created_time
        - updated_time
        - has_reply
        - reply
        - status
        - removed_at
        - first_seen_at
        - last_seen_at
        - ignored
        - analysis
        - draft
      properties:
        id:
          type: integer
          format: int64
        location_id:
          type: integer
          format: int64
        location_title:
          type: string
        client_id:
          type: [integer, "null"]
          format: int64
        client_name:
          type: [string, "null"]
        rating:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
          description: Stars, 1 to 5.
        comment:
          type: [string, "null"]
          description: The review text exactly as Google sent it; null for a rating-only review.
        original_text:
          type: [string, "null"]
          description: What the reviewer wrote, without Google's translation.
        translated_text:
          type: [string, "null"]
          description: Google's English translation, when the review came with one.
        language:
          type: [string, "null"]
          description: |
            The engine's guess at the review's language from its script:
            `en`, `zh`, `ja`, `ko`, `es`, `fr` or `other`; null without text.
            Google provides no language field.
        reviewer_name:
          type: [string, "null"]
        reviewer_photo_url:
          type: [string, "null"]
        reviewer_anonymous:
          type: boolean
        created_time:
          type: string
          format: date-time
          description: When the review was written (Google's time).
        updated_time:
          type: string
          format: date-time
          description: When the reviewer last changed it (Google's time).
        has_reply:
          type: boolean
        reply:
          oneOf:
            - $ref: "#/components/schemas/ReviewReply"
            - type: "null"
          description: The reply on Google now; null when there is none.
        status:
          type: string
          enum: [active, removed]
          description: "`removed`: Google no longer has the review (deleted by its author or taken down)."
        removed_at:
          type: [string, "null"]
          format: date-time
        first_seen_at:
          type: string
          format: date-time
          description: When the engine first stored the review.
        last_seen_at:
          type: string
          format: date-time
          description: The last time Google returned the review.
        ignored:
          description: |
            Set when a person decided that this review needs no reply; null
            otherwise. An ignored review is not drafted for and is not in
            the approval queue. The decision ends when the reviewer edits
            the review.
          oneOf:
            - $ref: "#/components/schemas/ReviewIgnore"
            - type: "null"
        analysis:
          description: The newest analysis; null if the review has not been analyzed.
          oneOf:
            - $ref: "#/components/schemas/ReviewAnalysis"
            - type: "null"
        draft:
          description: |
            The newest reply draft, whatever its status, without its
            `inputs`; null if none was written. A review that already had a
            reply gets an analysis and no draft.
          oneOf:
            - $ref: "#/components/schemas/ReplyDraft"
            - type: "null"
    ReviewIgnore:
      type: object
      description: A person's decision that a review needs no reply.
      additionalProperties: false
      required: [by, at, reason]
      properties:
        by:
          type: string
          description: The email of the person who decided.
        at:
          type: string
          format: date-time
        reason:
          type: string
          description: Why, if they said; may be empty.
    ReviewIgnoreRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
    ReviewReply:
      type: object
      additionalProperties: false
      required: [text, updated_time, state, origin]
      properties:
        text:
          type: string
        updated_time:
          type: [string, "null"]
          format: date-time
        state:
          type: [string, "null"]
          description: Google's review state of the reply, for example `APPROVED`.
        origin:
          type: [string, "null"]
          enum: [external, system, null]
          description: "`external`: posted outside this system. `system`: posted by the engine (from Phase 3)."
    ReviewList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        total:
          type: integer
          format: int64
    ReviewEvent:
      type: object
      additionalProperties: false
      required: [id, kind, source, occurred_at, detail]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [discovered, review_edited, reply_added, reply_changed, reply_removed, removed, restored]
        source:
          type: string
          enum: [poll, full_sync, notification]
          description: Which sync path noticed it.
        occurred_at:
          type: string
          format: date-time
          description: When the engine noticed, not when it happened on Google.
        detail:
          type: object
          description: Values before and after, depending on the kind.
          additionalProperties: true
    ReviewEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewEvent"

    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, occurred_at, actor_type, actor, action, object_type, object_id, before, after, ip]
      properties:
        id:
          type: integer
          format: int64
        occurred_at:
          type: string
          format: date-time
        actor_type:
          type: string
          enum: [user, system, anonymous]
        actor:
          type: string
          description: The user's email address, or `system:<component>` for the engine itself.
        action:
          type: string
          description: |
            `<object>.<verb>`, for example `location.link`. New actions are
            added as the engine learns to do more, and a client shows one it
            does not know as it is. The verb is not always a plain verb
            (`reply.post_outcome_unknown`), and the object is not always the
            `object_type` (`reply.posted` is about a `draft`,
            `reply_settings.update` and `local_posts.refresh` about a
            `location`).
        object_type:
          type: string
          description: |
            What the entry is about. The engine writes these today: `client`,
            `location`, `system_settings`, `ai_settings`, `review`, `draft`
            (a reply draft), `escalation`, `local_post`, `local_post_media`,
            `notification_rule`, `notification_delivery`, `report`,
            `report_share_link`, `report_schedule`, `go_live_run`, `user`
            (signing in and out), `device` and `credential`. The list grows
            like the actions do.
        object_id:
          type: string
        before:
          description: The values before the change; null when there are none.
        after:
          description: The values after the change; null when there are none.
        ip:
          type: [string, "null"]
          description: The address the request came from, for changes made by people.
    AuditList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        total:
          type: integer
          format: int64

    SystemStatus:
      type: object
      additionalProperties: false
      required:
        - version
        - database
        - knowledge
        - connect_configured
        - gbp
        - location_discovery
        - pubsub
        - ai
        - posting
        - email
        - locations
        - jobs
      properties:
        version:
          type: string
        database:
          $ref: "#/components/schemas/DatabaseHealth"
        knowledge:
          $ref: "#/components/schemas/KnowledgeStatus"
        connect_configured:
          type: boolean
          description: |
            The engine can connect a Google account from the dashboard: it
            has the OAuth client and the key that encrypts stored tokens.
        gbp:
          $ref: "#/components/schemas/GbpStatus"
        location_discovery:
          $ref: "#/components/schemas/IntegrationStatus"
        pubsub:
          $ref: "#/components/schemas/PubsubStatus"
        ai:
          $ref: "#/components/schemas/AiStatus"
        posting:
          $ref: "#/components/schemas/PostingStatus"
        email:
          $ref: "#/components/schemas/EmailStatus"
        locations:
          type: array
          items:
            $ref: "#/components/schemas/LocationSyncStatus"
        jobs:
          $ref: "#/components/schemas/JobsStatus"
    ConnectionStart:
      type: object
      additionalProperties: false
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
          format: uri
          description: The address at Google to send the browser to.
    KnowledgeStatus:
      type: object
      description: Which knowledge base is seeded (FR-13).
      additionalProperties: false
      required: [version, seeded_at]
      properties:
        version:
          type: string
          description: A hash of the knowledge files' content.
        seeded_at:
          type: string
          description: When this version was seeded.
    IntegrationStatus:
      type: object
      description: The last success and the last failure. `last_error` is null after a success.
      additionalProperties: false
      required: [last_ok_at, last_error, last_error_at]
      properties:
        last_ok_at:
          type: [string, "null"]
          format: date-time
        last_error:
          type: [string, "null"]
        last_error_at:
          type: [string, "null"]
          format: date-time
    GbpStatus:
      type: object
      description: The GBP managing account's token.
      additionalProperties: false
      required: [connected, last_ok_at, last_error, last_error_at]
      properties:
        connected:
          type: boolean
          description: A token is stored. Whether Google still accepts it shows in the other fields.
        last_ok_at:
          type: [string, "null"]
          format: date-time
          description: The last time Google accepted the token.
        last_error:
          type: [string, "null"]
        last_error_at:
          type: [string, "null"]
          format: date-time
    PubsubStatus:
      type: object
      description: Review notifications through Pub/Sub, the second source next to polling.
      additionalProperties: false
      required: [enabled, last_ok_at, last_error, last_error_at, last_message_at]
      properties:
        enabled:
          type: boolean
        last_ok_at:
          type: [string, "null"]
          format: date-time
          description: The last successful pull.
        last_error:
          type: [string, "null"]
        last_error_at:
          type: [string, "null"]
          format: date-time
        last_message_at:
          type: [string, "null"]
          format: date-time
          description: The last pull that brought a notification.
    LocationSyncStatus:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - client_name
        - access_status
        - syncing
        - review_count
        - reviews_polled_at
        - reviews_full_synced_at
        - last_sync_error
        - last_sync_error_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        client_name:
          type: [string, "null"]
        access_status:
          $ref: "#/components/schemas/AccessStatus"
        syncing:
          type: boolean
          description: Linked to an active client and accessible, so its reviews are being synced.
        review_count:
          type: integer
          format: int64
        reviews_polled_at:
          type: [string, "null"]
          format: date-time
        reviews_full_synced_at:
          type: [string, "null"]
          format: date-time
        last_sync_error:
          type: [string, "null"]
        last_sync_error_at:
          type: [string, "null"]
          format: date-time
    JobsStatus:
      type: object
      additionalProperties: false
      required: [queued, running, failed, failures]
      properties:
        queued:
          type: integer
          format: int64
        running:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
          description: Jobs that failed for good in the last 7 days.
        failures:
          type: array
          description: The most recent of them, newest first (at most 20).
          items:
            $ref: "#/components/schemas/JobFailure"
    JobFailure:
      type: object
      additionalProperties: false
      required: [id, kind, attempts, last_error, failed_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        attempts:
          type: integer
          format: int64
        last_error:
          type: [string, "null"]
        failed_at:
          type: [string, "null"]
          format: date-time

    # ---- analysis and drafts (Phase 2) -------------------------------------------

    TopicMention:
      type: object
      additionalProperties: false
      required: [id, polarity]
      properties:
        id:
          type: string
          description: A topic of the client's industry profile.
        polarity:
          type: string
          enum: [positive, negative, neutral]
    ItemMention:
      type: object
      description: A dish, treatment, staff member or the like that the reviewer mentions.
      additionalProperties: false
      required: [name, type, polarity]
      properties:
        name:
          type: string
          description: As the reviewer wrote it.
        type:
          type: string
          description: An item type of the client's industry profile.
        polarity:
          type: string
          enum: [positive, negative, neutral]
    RaisedFlag:
      type: object
      description: A severity flag raised on a review.
      additionalProperties: false
      required: [id, label, evidence]
      properties:
        id:
          type: string
        label:
          type: string
        evidence:
          type: string
          description: A short quote from the review. Untrusted text.
    ReviewAnalysis:
      type: object
      description: What the analyzer found in one version of a review (FR-3).
      additionalProperties: false
      required:
        - id
        - status
        - error
        - language
        - script
        - sentiment
        - contains_complaint
        - topics
        - items
        - severity_flags
        - manipulation_suspected
        - manipulation_evidence
        - summary_en
        - industry_key
        - model
        - prompt_version
        - is_current
        - created_at
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [ok, failed]
          description: "`failed`: the model gave no usable answer. The review can't go to auto-post."
        error:
          type: [string, "null"]
        language:
          type: string
          description: ISO 639-1 code of the reviewer's own words, `other`, or `none` for a review without text.
        script:
          type: string
          enum: [Hans, Hant, Hani, Latn, Hang, other, none]
          description: "`Hans`: Simplified Chinese. `Hant`: Traditional Chinese. `Hani`: Chinese, and the analyzer did not say which (D-056)."
        sentiment:
          type: string
          enum: [positive, mixed, neutral, negative, none]
        contains_complaint:
          type: boolean
          description: The text holds a complaint, however small, even in a 5-star review.
        topics:
          type: array
          items:
            $ref: "#/components/schemas/TopicMention"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemMention"
        severity_flags:
          type: array
          items:
            $ref: "#/components/schemas/RaisedFlag"
        manipulation_suspected:
          type: boolean
          description: The review seems to instruct an AI or to dictate what the reply should contain.
        manipulation_evidence:
          type: string
          description: A short quote from the review. Untrusted text.
        summary_en:
          type: string
          description: One sentence in English for staff.
        industry_key:
          type: string
        model:
          type: [string, "null"]
          description: The analyzer model; null when no model was called (a review without text).
        prompt_version:
          type: string
        is_current:
          type: boolean
          description: False when the review was edited since; a new analysis is on its way.
        created_at:
          type: string
          format: date-time
    CheckResult:
      type: object
      description: One mechanical check on a drafted reply (architecture section 10) or on a local post's content.
      additionalProperties: false
      required: [name, passed, detail]
      properties:
        name:
          type: string
          description: |
            `not_empty`, `no_url`, `no_email`, `no_phone`, `emoji_limit`,
            `length` or `language_match` for a reply. Drafts made before
            D-058 may carry other names, and a local post has its own.
        passed:
          type: boolean
        detail:
          type: string
          description: What was found, when the check failed.
    DraftRoute:
      type: string
      enum: [auto_post, approval_queue, escalate]
      description: |
        What the policy does with the draft (FR-5). In shadow mode (Phase 2)
        nothing is posted: `auto_post` means the reply would have been posted
        without a person.
    ReplyDraft:
      type: object
      description: |
        A drafted reply and its route. The route is what the policy would do
        (FR-5). A draft routed to `auto_post` is scheduled for posting only
        where a person switched auto-posting on for the location and the
        star rating (`AutoPosting`); every other draft waits for a person.
      additionalProperties: false
      required:
        - id
        - review_id
        - status
        - status_reason
        - route
        - route_reasons
        - mode
        - text
        - language
        - script
        - generator_manipulation_suspected
        - notes_for_staff
        - checks
        - model
        - prompt_version
        - inputs
        - generated_text
        - instructions
        - created_by
        - edited_by
        - edited_at
        - decided_by
        - decided_at
        - post
        - post_at
        - policy_version
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        review_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [draft, approved, scheduled, posting, posted, published, rejected, cancelled, superseded]
          description: |
            `draft`: waiting for a person. `approved`: a person approved the
            text and the posting job has not started. `posting`: the reply is
            being sent, or was sent and Google's answer is not known.
            `posted`: Google accepted it. `published`: a later read saw it on
            Google. `rejected`: a person decided against it. `superseded`: a
            newer draft replaced it, or the review was edited. `cancelled`:
            the review got a reply outside the system, or was removed.
            `scheduled`: the policy decided to post it without a person, at
            `post_at` (auto-posting). A draft that could not be posted, or
            that may no longer be posted without a person, returns to `draft`
            with the reason in `status_reason`.
        status_reason:
          type: [string, "null"]
        route:
          $ref: "#/components/schemas/DraftRoute"
        route_reasons:
          type: array
          description: |
            Why the policy did not send the draft to auto-post, written once
            when the draft is made and never changed after. Empty for a
            draft the policy routed to `auto_post`, also when it then did not
            get posted automatically: that is in `status_reason`, prose for
            people with no fixed form (it often begins "Not posted
            automatically.", but a refused or unconfirmed reply and a review
            that could not be read say other things), and it is null when
            only a switch or the location's auto-posting configuration kept
            the draft from being scheduled. A pause is on the location
            (`AutoPosting.paused`, `pause_reason`), never among the reasons.
            The values, in this order when several apply, in the engine's
            wording:

            - `severity: <flag ids>`: the severity flag ids that were
              raised, sorted and joined with ", ", for example
              `severity: allergen_incident, hygiene`. The route is
              `escalate`, and this is then the only reason.
            - `analysis failed`: the analysis could not be used.
            - `generation failed`: the writer gave no usable reply.
            - `manipulation suspected`: the analysis or the writer suspected
              it.
            - `check failed: <check names>`: the names of the reply checks
              that failed, sorted and joined with ", ": `emoji_limit`,
              `language_match`, `length`, `no_email`, `no_phone`, `no_url`,
              `not_empty`.
            - One of these, the first that applies:
              `<n> stars` (the rating is below the policy's minimum for
              auto-posting; `<n>` is the rating, so `1 stars`, `2 stars` and
              so on), `no star rating`, `contains a complaint`,
              `auto-post is off for rating-only reviews`,
              `auto-post is off for positive reviews`.
            - `regenerated_with_instructions`: a person wrote the reply
              again with instructions of their own and the policy would have
              auto-posted it. The route is `approval_queue` and this is the
              only reason.
          items:
            type: string
        mode:
          type: string
          enum: [positive, complaint, severity, rating_only, rating_only_low]
          description: The kind of reply that was asked for.
        text:
          type: string
          description: The reply as it would be posted, either the model's text or a person's edit of it. Empty when generation failed.
        language:
          type: string
          description: The language the reply had to be in.
        script:
          type: [string, "null"]
          enum: [Hans, Hant, null]
          description: The Chinese script the generator was asked to write. Nothing checks that it did (D-056).
        generator_manipulation_suspected:
          type: boolean
        notes_for_staff:
          type: string
          description: A note from the model for the person reviewing the draft.
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
        model:
          type: string
        prompt_version:
          type: string
        inputs:
          type: [object, "null"]
          description: |
            What shaped the prompt: the review as sent, the mode, the target
            language, and the resolved voice, localization and policy. Null
            where drafts are embedded in reviews; `GET /api/reviews/{id}/drafts`
            has it.
          additionalProperties: true
        generated_text:
          type: string
          description: The reply exactly as the model wrote it, kept when `text` is edited.
        instructions:
          type: [string, "null"]
          description: The staff instructions this draft was regenerated with.
        created_by:
          type: [string, "null"]
          description: The email of the person who asked for this draft; null for the pipeline.
        edited_by:
          type: [string, "null"]
          description: The email of the person who last edited the text.
        edited_at:
          type: [string, "null"]
          format: date-time
        decided_by:
          type: [string, "null"]
          description: The email of the person who approved or rejected the draft.
        decided_at:
          type: [string, "null"]
          format: date-time
        post:
          description: The engine's newest attempt to post this draft, if it was approved.
          oneOf:
            - $ref: "#/components/schemas/ReplyPost"
            - type: "null"
        post_at:
          type: [string, "null"]
          format: date-time
          description: When a scheduled draft is posted; kept after it was.
        policy_version:
          type: [string, "null"]
          description: |
            For a draft the policy scheduled: the version of the rules that
            decided it (a short hash of the prompt version, the resolved reply
            policy and the location's auto-posting settings).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReplyDraftList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReplyDraft"

    AiStatus:
      type: object
      description: The analysis pipeline.
      additionalProperties: false
      required:
        - llm_configured
        - providers
        - enabled
        - analyzer_provider
        - analyzer_model
        - generator_provider
        - generator_model
        - last_ok_at
        - last_error
        - last_error_at
        - waiting_reviews
        - analyzed_reviews
      properties:
        llm_configured:
          type: boolean
          description: The providers both tasks name have an address and a key. Otherwise nothing is analyzed.
        providers:
          type: array
          description: The model providers the engine has an address and a key for (D-059), in name order.
          items:
            type: string
        enabled:
          type: boolean
        analyzer_provider:
          type: string
        analyzer_model:
          type: string
        generator_provider:
          type: string
        generator_model:
          type: string
        last_ok_at:
          type: [string, "null"]
          format: date-time
        last_error:
          type: [string, "null"]
        last_error_at:
          type: [string, "null"]
          format: date-time
        waiting_reviews:
          type: integer
          format: int64
          description: Reviews that still lack an analysis, or a draft while they have no reply.
        analyzed_reviews:
          type: integer
          format: int64

    # ---- industry profiles -------------------------------------------------------

    Topic:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        label:
          type: string
    ItemType:
      type: object
      additionalProperties: false
      required: [id, description, person]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        description:
          type: string
        person:
          description: >-
            True: an item of this type is a staff member a reviewer named; a client report lists such items in its
            employee recognition section, not among the items (D-086). Null where the profile does not say, which
            means no. The analyzer is not told it.
          type: [boolean, "null"]
    SeverityFlag:
      type: object
      additionalProperties: false
      required: [id, label, description, enabled]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        label:
          type: string
        description:
          type: string
          description: The definition the analyzer is given.
        enabled:
          type: boolean
          description: Off, the analyzer is not told about the flag and can't raise it.

    # ---- voice, localization, policy ---------------------------------------------

    EmojiRule:
      type: object
      additionalProperties: false
      required: [allowed, max, preferred]
      properties:
        allowed:
          type: boolean
        max:
          type: integer
          minimum: 0
          maximum: 10
        preferred:
          type: array
          items:
            type: string
    LengthRange:
      type: object
      description: Characters.
      additionalProperties: false
      required: [min, max]
      properties:
        min:
          type: integer
          minimum: 0
        max:
          type: integer
          maximum: 4000
    LengthLimits:
      type: object
      description: Reply length per kind of reply.
      additionalProperties: false
      required: [rating_only, positive, complaint, severity]
      properties:
        rating_only:
          description: |
            For a review with no text. A draft of `mode` `rating_only_low`
            (no text, three stars or fewer) uses this range too: there is no
            range of its own.
          $ref: "#/components/schemas/LengthRange"
        positive:
          $ref: "#/components/schemas/LengthRange"
        complaint:
          $ref: "#/components/schemas/LengthRange"
        severity:
          $ref: "#/components/schemas/LengthRange"
    Voice:
      type: object
      description: A complete brand voice (FR-4).
      additionalProperties: false
      required:
        - reply_name
        - business_facts
        - sign_off
        - owner_name
        - emoji
        - promos_allowed
        - contact_allowed
        - words_to_avoid
        - length
        - style_notes
        - example_replies
        - temperature
        - base_style
      properties:
        reply_name:
          type: string
          description: How replies refer to the business. Empty, the client's name.
        business_facts:
          type: array
          description: The only facts about the business the generator may rely on.
          items:
            type: string
        sign_off:
          type: string
          description: May contain `{owner_name}`.
        owner_name:
          type: string
        emoji:
          $ref: "#/components/schemas/EmojiRule"
        promos_allowed:
          type: boolean
          description: May a reply mention promotions, discounts or free items?
        contact_allowed:
          type: boolean
          description: May a reply carry a phone number, an email address or a link?
        words_to_avoid:
          type: array
          items:
            type: string
        length:
          type: object
          description: By reply language (`en`, `zh`, `es`).
          additionalProperties:
            $ref: "#/components/schemas/LengthLimits"
        style_notes:
          type: array
          items:
            type: string
        example_replies:
          type: array
          description: Replies the business wrote itself. A tone reference, never copied.
          items:
            type: string
        temperature:
          type: number
          minimum: 0
          maximum: 2
          description: |
            The temperature the writer is asked with (D-074). Not part of
            the prompt. A change needs a new go-live test.
        base_style:
          type: string
          maxLength: 2000
          description: |
            One line the writer is given as the base of the style. Taking a
            voice template fills it with the template's label and
            description (D-080); empty, the writer is given none.
    VoiceLayer:
      type: object
      description: |
        The voice fields a voice template sets; a field that is absent is
        left as it is by taking the template. `emoji` and `length` may be
        partial too: `{"emoji": {"max": 1}}` changes only that number.
      additionalProperties: false
      properties:
        reply_name:
          type: string
        business_facts:
          type: array
          items:
            type: string
        sign_off:
          type: string
        owner_name:
          type: string
        emoji:
          type: object
          additionalProperties: false
          properties:
            allowed:
              type: boolean
            max:
              type: integer
              minimum: 0
              maximum: 10
            preferred:
              type: array
              items:
                type: string
        promos_allowed:
          type: boolean
        contact_allowed:
          type: boolean
        words_to_avoid:
          type: array
          items:
            type: string
        length:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              rating_only:
                $ref: "#/components/schemas/LengthRange"
              positive:
                $ref: "#/components/schemas/LengthRange"
              complaint:
                $ref: "#/components/schemas/LengthRange"
              severity:
                $ref: "#/components/schemas/LengthRange"
        style_notes:
          type: array
          items:
            type: string
        example_replies:
          type: array
          items:
            type: string
        temperature:
          type: number
          minimum: 0
          maximum: 2
        base_style:
          type: string
          maxLength: 2000
    ReplyLanguage:
      type: string
      enum: [en, zh, es]
      description: The languages the engine can check a reply in.
    Localization:
      type: object
      description: Complete localization preferences (FR-4, D-022).
      additionalProperties: false
      required: [reply_languages, chinese_script, chinese_region, english_variant, fallback_language]
      properties:
        reply_languages:
          type: array
          description: A review in one of these languages is answered in it; any other gets `fallback_language`.
          minItems: 1
          items:
            $ref: "#/components/schemas/ReplyLanguage"
        chinese_script:
          type: string
          enum: [match, simplified, traditional]
          description: "`match`: the script the reviewer used."
        chinese_region:
          type: string
          enum: [mainland, taiwan, hong_kong]
          description: Phrasing of a Traditional reply.
        english_variant:
          type: string
          enum: [us, ca]
        fallback_language:
          $ref: "#/components/schemas/ReplyLanguage"
    PolicyRules:
      type: object
      description: The complete tiered reply policy (FR-5), with the timing of auto-posts.
      additionalProperties: false
      required:
        - auto_post_positive
        - auto_post_rating_only
        - auto_post_min_stars
        - auto_post_delay_min_minutes
        - auto_post_delay_max_minutes
        - auto_post_window_start
        - auto_post_window_end
      properties:
        auto_post_positive:
          type: boolean
          description: A review with text, enough stars and no complaint goes to auto-post when every check passes.
        auto_post_rating_only:
          type: boolean
          description: The same for a review without text.
        auto_post_min_stars:
          type: integer
          minimum: 1
          maximum: 5
          description: Reviews below this many stars always wait for a person.
        auto_post_delay_min_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: An auto-post waits a random time between this and the maximum, so replies look human. 0 and 0, no delay.
        auto_post_delay_max_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        auto_post_window_start:
          type: string
          pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9])?$"
          description: |
            The posting window in the location's local time, `HH:MM`; empty,
            none. A reply due outside it moves into the next one. A start
            later than the end crosses midnight. A window needs the
            location's time zone (`AutoPosting.time_zone`).
        auto_post_window_end:
          type: string
          pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9])?$"
    ReplySettings:
      type: object
      description: What a location's replies are written with (D-093).
      additionalProperties: false
      required: [location_id, location_title, client_id, client_name, industry_key, voice, localization, policy, updated_at]
      properties:
        location_id:
          type: integer
          format: int64
        location_title:
          type: string
        client_id:
          type: integer
          format: int64
          description: The client the location is linked to; only a linked location has reply settings.
        client_name:
          type: string
        industry_key:
          type: [string, "null"]
          description: The client's industry (`Client.industry_key`); null, the location's reviews are not analyzed.
        voice:
          $ref: "#/components/schemas/Voice"
        localization:
          $ref: "#/components/schemas/Localization"
        policy:
          $ref: "#/components/schemas/PolicyRules"
        updated_at:
          type: string
          format: date-time
    ReplySettingsUpdate:
      type: object
      description: A location's complete reply settings; every field of every part is sent.
      additionalProperties: false
      required: [voice, localization, policy]
      properties:
        voice:
          $ref: "#/components/schemas/Voice"
        localization:
          $ref: "#/components/schemas/Localization"
        policy:
          $ref: "#/components/schemas/PolicyRules"

    # ---- pipeline settings and LLM usage -----------------------------------------

    ModelPrice:
      type: object
      description: USD per million tokens.
      additionalProperties: false
      required: [input_per_mtok, output_per_mtok]
      properties:
        input_per_mtok:
          type: number
          minimum: 0
        output_per_mtok:
          type: number
          minimum: 0

    # ---- the knowledge base (read-only) ------------------------------------------

    Knowledge:
      type: object
      description: The knowledge base as it is seeded (FR-13, D-078).
      additionalProperties: false
      required: [version, format, seeded_at, industries, common_severity_flags, voice_templates, defaults, model_prices]
      properties:
        version:
          type: string
          description: A hash of the knowledge files' content.
        format:
          type: integer
          description: The shape of the knowledge files.
        seeded_at:
          type: string
          description: When this version was seeded.
        industries:
          type: array
          description: The supported industries; a client can be given one of these.
          items:
            $ref: "#/components/schemas/KnowledgeIndustry"
        common_severity_flags:
          type: array
          description: The severity flags of every industry.
          items:
            $ref: "#/components/schemas/SeverityFlag"
        voice_templates:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeVoiceTemplate"
        defaults:
          $ref: "#/components/schemas/KnowledgeDefaults"
        model_prices:
          type: object
          description: By model name, for the cost estimate. A model without a price has no estimate.
          additionalProperties:
            $ref: "#/components/schemas/ModelPrice"
    KnowledgeIndustry:
      type: object
      description: A supported industry. Its pack was complete when it was seeded.
      additionalProperties: false
      required: [key, label, topics, item_types, severity_flags, test_client_name, corpus, client_count]
      properties:
        key:
          type: string
          description: What `Client.industry_key` names.
        label:
          type: string
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
        item_types:
          type: array
          items:
            $ref: "#/components/schemas/ItemType"
        severity_flags:
          type: array
          description: The industry's own flags; `common_severity_flags` apply as well.
          items:
            $ref: "#/components/schemas/SeverityFlag"
        test_client_name:
