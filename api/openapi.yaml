      responses:
        "204":
          description: The schedule is gone.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/local-posts:
    get:
      operationId: listLocalPosts
      summary: List local posts
      description: |
        The posts of every location: drafts, posts the engine sent, and
        posts made in Google's own interface, which the sync finds.

        They are ordered by one key: the time Google created the post, or,
        for a post Google does not have, the time the draft was written;
        then by `id`. Newest first unless `order=asc`, which reverses both,
        so that paging is stable either way.
      tags: [local-posts]
      parameters:
        - name: location_id
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: status
          in: query
          description: Our states to include, for example `status=draft` or `status=rejected,removed`.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LocalPostStatus"
        - name: google_state
          in: query
          description: |
            Google's states to include, for example `google_state=live,recurring`.
            `none` takes every post that has no state from Google, whatever its
            `status`: a draft, a rejected draft, a post that is `approved`,
            `sending`, `unknown` or `failed`, and a sent post Google has not been
            read back for yet. It combines with the others:
            `google_state=none,processing` adds the posts Google is still taking
            in, and `status` narrows the result as usual. `none` is a word of
            this filter only; a post's `google_state` is then null.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LocalPostGoogleStateFilter"
        - name: order
          in: query
          description: "`desc`: newest first. `asc`: oldest first. The key is in the description above."
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of local posts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPostList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/local-posts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getLocalPost
      summary: Get a local post
      description: |
        The post as the engine holds it. Who did what to it is in the audit
        log: `GET /api/audit-log?object_type=local_post&object_id={id}`.
      tags: [local-posts]
      responses:
        "200":
          description: The local post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPost"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateLocalPost
      summary: Edit a draft
      description: |
        Replaces the content of a post that is still a `draft`; the body
        carries every field. The checks run again and are stored with it: a
        draft with a failed check is saved but can't be approved. A post
        that is at Google is not changed by this route: it gets an edit of
        its own, which a person approves (`PUT /api/local-posts/{id}/edit`).
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalPostContent"
      responses:
        "200":
          description: The draft after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPost"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"
    delete:
      operationId: deleteLocalPost
      summary: Delete a draft
      description: |
        Deletes a post that Google never had: a `draft` or a `rejected`
        draft (D-094). The audit entry keeps its content. Its uploaded
        photos and videos stay for other posts until the bucket's lifecycle
        rule removes them. Every other status is refused with
        `local_post_not_open`, `failed` included: a send that was given up
        is still adopted when the post turns up at Google. A post that is at
        Google is removed there instead (`POST /api/local-posts/{id}/remove`).
        A copy that is deleted leaves its source's `copies`; the copies of a
        post that is deleted keep their content and get `copied_from_id: null`.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The draft is gone.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"

  /api/local-posts/{id}/edit:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: writeLocalPostEdit
      summary: Write an edit of a post that is at Google
      description: |
        Proposes a change to a post Google has (D-099). The body has two
        members, each a whole `LocalPostContent`: `content`, what the post
        should say, and `based_on`, the post's content exactly as the client
        last got it from the engine, which is what the person was looking at
        when they wrote `content`. Nothing goes to Google: the edit is kept
        beside the post as `LocalPost.edit`, a `draft`, until a person
        approves it (`POST /api/local-posts/{id}/edit/approve`). The post
        keeps its id, its `google_name`, its history and, until Google has
        accepted the edit, its content.

        `based_on` is the post's content the form was built from, not one
        loaded at the moment of saving: the engine cannot tell the two
        apart, and a `content` written from an older post beside a fresh
        `based_on` would make every field that changed in between a change
        of this edit's. It must be the post's content as the engine holds it
        now. If the post has changed since the client read it (the engine
        reads Google every hour, and people change posts in Google's own
        interface), the answer is 409 `local_post_changed` and nothing is
        stored: load the post again and write the edit from what it says
        now.

        An edit changes the fields in which `content` differs from
        `based_on`, and it never writes any other field at Google:
        `LocalPost.edit.fields` lists them. Whatever else `content` carries
        is the post's own, sent along because the content travels whole,
        and is not kept as the edit's.

        A post has at most one open edit. Sending this again replaces the
        edit while it is a `draft`, whoever wrote it, also with the content
        it already has: the edit then names the person who sent it last. An
        edit that is `approved` or `sending` is refused with
        `local_post_edit_not_open`.

        A post can have an edit when it is `sent`, has a `google_name`, has
        no removal requested and belongs to a location that is enabled and
        accessible; a post made in Google's own interface can have one
        too. Otherwise the answer is `local_post_not_editable` or
        `location_not_synced`. A post that holds what a draft cannot hold
        (an alert, a button a draft does not have, an event without its
        dates) is refused with `local_post_not_editable` as well: an edit
        could not say how to keep that part.

        An edit changes what the post says and shows, not what kind of post
        it is or when Google publishes it: a `topic_type`, a
        `scheduled_time` or an `event.recurrence` other than the post's is a
        400 that names the member. To change those, copy the post and
        remove it.

        `media_ids` names uploads, in the order the post shows them. The
        post's own list (`LocalPost.media_ids`) keeps its photos and videos
        as they are; any other list, a new order included, replaces all of
        them at Google, and `[]` takes them away. A post made at Google has
        no uploads: `[]` leaves what it shows at Google untouched, and a
        list of uploads replaces everything it shows there, Google's own
        copies of files included (D-101).

        The content is normalized and checked as a draft's is, and the
        checks are stored with the edit: an edit with a failed check is
        saved but can't be approved. Two checks always pass for an edit,
        because an edit does not send what they are about:
        `scheduled_in_future` and `recurrence_end`. `media_usable` looks at
        the uploads only when they are not the post's own.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalPostEditRequest"
      responses:
        "200":
          description: The post, with the edit as `edit`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPost"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"
    delete:
      operationId: discardLocalPostEdit
      summary: Discard an edit
      description: |
        Discards the post's edit while it is a `draft`; the audit entry
        keeps its content. Nothing at Google is touched and the post stays
        as it is. An edit that is `approved` or `sending`, and a post
        without an edit, are refused with `local_post_edit_not_open`.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The edit is gone; the post is as it was.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"

  /api/local-posts/{id}/edit/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: approveLocalPostEdit
      summary: Approve an edit and send it to Google
      description: |
        The only way a post that is at Google is changed there (D-099). The
        body carries the edit's content as the person read it
        (`LocalPost.edit.content`: the post as it would say with the edit
        applied). It must equal what the engine would serve now, so nobody
        approves a change they haven't seen: not an edit that was replaced
        since, and not a post that changed at Google since in a field the
        edit leaves alone. Either is a 409 `local_post_changed`; load the
        post again. The edit becomes `approved` and
        a job sends it at once: it reads the post from Google, and sends one
        request that names the fields the edit changes (`edit.fields`) and
        Google does not have yet, and no other field. Refused while a
        posting switch is off, while a check fails, and for an edit that
        changes nothing or nothing Google does not have already
        (`local_post_edit_unchanged`).

        A field the edit changes that was also changed at Google since the
        edit was written stops it, here with `local_post_changed` and in the
        job by returning the edit to `draft` with a reason that names the
        field: the edit would write over a change its author never saw.
        Nothing is sent. To go on, load the post and save the edit again:
        `PUT` the served `edit.content` as `content`, with the post's
        content as it is now as `based_on`. The edit then changes the same
        fields as before, against a post the person has seen, and can be
        approved. A field the edit does not change stays as Google has it.

        The job also sends nothing if the post changed at Google after the
        approval so that it would no longer say what was approved: the edit
        is a `draft` again with that reason, and is approved again from what
        the engine then serves.

        When Google accepts, the post takes what Google answered,
        `edited_by` and `edited_at` name the edit's author and the moment,
        and `edit` is null again. `google_state` then says what Google does
        with the changed post; the engine reads the post again 1, 5 and 15
        minutes later.

        When Google refuses, the post is as it was and the edit is a
        `draft` again with Google's message in its `status_reason`. When
        the outcome is not known (a timeout, a 5xx), the request is not sent
        again: the edit is a `draft` again and its `status_reason` says that
        the post may or may not have changed. Read the post from Google
        (`POST /api/locations/{id}/local-posts/refresh`) to see what it says
        now; approving the edit again is safe. An approval that could not be
        carried out (a switch turned off meanwhile, the post removed, a
        removal requested, not within 30 minutes) leaves the edit a `draft`
        with the reason; nothing is sent later by itself.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalPostContent"
      responses:
        "202":
          description: The post; its edit was approved and queued for sending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPost"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"

  /api/local-posts/{id}/copy:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: copyLocalPost
      summary: Copy a post as a new draft
      description: |
        A new `draft` for the same location with the post's content as the
        engine holds it now, written by the caller (D-094). Any post can be
        copied, whatever its status, also one made in Google's own
        interface. Nothing goes to Google and nothing is queued: the copy is
        approved like any other draft.

        What a draft cannot hold is left out, and the draft's
        `status_reason` names each thing: an alert becomes an update, a
        button outside the six a draft has is dropped, a time to publish at
        that has passed is dropped. A post written here keeps its uploaded
        photos and videos (`media_ids`). A post made at Google brings no
        photo and no video: the engine fetches nothing from Google, and the
        reason says to upload the files again. The checks run on the copy as on any
        draft.

        The copy's `copied_from_id` names the post it was copied from, and
        that post lists the copy in its `copies` (D-098).
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: The new draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPost"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"

  /api/local-posts/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: approveLocalPost
      summary: Approve a draft and send it to Google
      description: |
        The only way a local post reaches Google (D-088). The body carries
        the content the person read; it must equal the stored content, so
        nobody approves an edit they haven't seen. The post becomes
        `approved` and a job sends it at once, with its `scheduled_time` and
        repeat: Google publishes it, the engine has no timer. The post then
        moves to `sending` and `sent`; `google_state` says where it stands
        at Google. Refused while a posting switch is off.

        Google refusing the content returns the post to `draft` with
        Google's message. A send whose outcome is not known (a timeout, a
        5xx) is never repeated: the post is `unknown` until the sync finds
        it at Google, or `failed` when it is not there 15 minutes later.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalPostContent"
      responses:
        "202":
          description: The post was approved and queued for sending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPost"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"

  /api/local-posts/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: rejectLocalPost
      summary: Reject a draft
      description: The draft becomes `rejected` and stays in the list. Only a `draft` can be rejected.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalPostRejection"
      responses:
        "200":
          description: The rejected post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPost"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"

  /api/local-posts/{id}/remove:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: removeLocalPost
      summary: Delete a local post at Google
      description: |
        Asks for the post to be deleted at Google: any post of a location
        that Google has, also while the location is switched off (D-102), also one made in Google's own interface.
        This is the only way to stop a scheduled post or take one down. A
        job sends the delete; the post is `removed` once Google has
        confirmed it (or answers that it is already gone). The audit entry
        keeps a copy of the post's content. It works while posting is
        switched off. Asking again for a post whose removal is under way,
        or that is removed, changes nothing.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: The post, with the removal requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPost"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"

  /api/local-post-media:
    post:
      operationId: uploadLocalPostMedia
      summary: Upload a photo or a video for a local post
      description: |
        The body is the file itself. The engine reads what the file is from
        its own bytes, not from the Content-Type, and checks what Google
        requires: of a photo, JPG or PNG, 10 KB to 5 MB and at least 250
        pixels on the short side; of a video (D-090), an MP4 or QuickTime
        file of at most 30 seconds, at most 75 MB and at least 720 pixels
        on the short side. It puts the bytes, unchanged, into the public
        bucket under a random name (`p/` and 32 random bytes): Google takes
        a post's media only from a public address. The answer's `id` goes
        into a draft's `media_ids`; one upload can serve several posts.

        One file per request. A post with several photos or videos uploads
        each of them, in parallel if the client likes, and lists the ids in
        the order the post shows them. The engine writes the file to its
        own disk while it reads and checks it, not to memory (D-101).
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          video/mp4:
            schema:
              type: string
              format: binary
          video/quicktime:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The stored file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPostMedia"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/LocalPostConflict"
        "413":
          description: The file is larger than the engine accepts (`payload_too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The file could not be put into the public bucket (`storage_failed`). Nothing was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            The engine could not take the file to disk (`no_room`, D-101): no file could be
            made in its temporary folder, or the one it wrote could not be read. Nothing was
            stored; the same upload may be sent again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/locations/{id}/local-posts:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: createLocalPost
      summary: Write a draft of a local post
      description: |
        A new `draft` for the location. Nothing goes to Google until a
        person approves it. The same content for several locations is
        several posts: one call per location.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalPostContent"
      responses:
        "201":
          description: The draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPost"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"

  /api/locations/{id}/local-posts/refresh:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: refreshLocalPosts
      summary: Read the location's posts from Google now
      description: |
        Queues the read that otherwise runs once an hour: the location's
        posts are listed at Google and stored, so states, posts made at
        Google and removals show up. The answer comes before the read. To
        see that a read has ended, read `Location.local_posts_synced_at` and
        `Location.local_posts_sync_error_at` before asking and again later:
        a read that succeeded moved the first, one that failed moved the
        second (the engine's clock wrote both, so compare the two values,
        not a time of the client's). A read already under way may move
        either too. A read that fails is tried again after a delay, up to
        three reads in all, so a failure may still be followed by a success.
        Neither moves when the location stopped being synced in between (it
        was switched off, or access was lost), so a client
        stops waiting after a time of its own choosing. Posts that
        Google no longer has are marked removed after
        `local_posts_synced_at` has moved, one by one, so a removal can
        show up a moment later.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: The read was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enqueued"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"

  /api/locations/{id}/review-highlights:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getReviewHighlights
      summary: What customers praised lately
      description: |
        From the stored analysis of the location's reviews of the last 90
        days, without a model call: the topics and items praised most, the
        languages the reviews are in, and a few recent reviews. Reviews
        flagged for a severity issue or suspected manipulation are left out.
      tags: [local-posts]
      responses:
        "200":
          description: The highlights.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewHighlights"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/locations/{id}/local-post-ideas:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: suggestLocalPostIdeas
      summary: Ask the model for ideas for posts
      description: |
        Three to five ideas, from the location's reviews of the last 90
        days and their analysis, Google's performance figures and search
        keywords, the recent posts, the industry profile, the voice and the
        location's `audience`. A reviewer's name or photo is never given to
        the model. Nothing is stored. The call waits for the model. Refused
        with fewer than 10 analysed reviews in the period.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The ideas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPostIdeas"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"
        "502":
          description: The model gave no usable answer (`model_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/locations/{id}/local-post-drafts:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: suggestLocalPostDraft
      summary: Ask the model for a post's text
      description: |
        Writes a text from a brief, or improves the current one, with the
        same knowledge of the location as the ideas. Nothing is stored: the
        answer goes into the form, and a person decides what becomes a
        draft. The call waits for the model.
      tags: [local-posts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalPostDraftRequest"
      responses:
        "200":
          description: The suggested text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalPostSuggestion"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LocalPostConflict"
        "502":
          description: The model gave no usable answer (`model_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/escalations:
    get:
      operationId: listEscalations
      summary: List escalations
      description: |
        Reviews on which the analyzer raised a severity flag (FR-6), newest
        first. An escalation is the simplest form of a case (D-054): opened
        by a flag, assigned to one person, closed with a reason.
      tags: [escalations]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EscalationStatus"
        - name: location_id
          in: query
          schema:
            type: integer
            format: int64
        - name: assignee_id
          in: query
          description: Only escalations assigned to this user.
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of escalations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/escalations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getEscalation
      summary: Get an escalation
      description: |
        The escalation as it is now, with its review. What happened to it
        is in two logs, which a client reads and puts in order by time:

        - Who did what: `GET /api/audit-log?object_type=escalation&object_id={id}`.
          `escalation.open` and `escalation.reopen` (a closed escalation
          opened again because a newer analysis of the review still flags
          it) are done by `system:review-analysis`; their `after` holds
          `review_id` and `severity_flags`, the ids of the flags raised.
          `escalation.assign` is done by the person who assigned it (the
          `actor`); `before.assignee_id` and `after.assignee_id` are user
          ids, and `after.assignee_id` is null when the assignment was
          lifted. `GET /api/users` lists active users only, so the id of a
          person who was disabled since does not resolve there: show the
          id, or the `actor`'s address where it is the same person. `escalation.close` is done by the person
          who closed it; its `after` holds `status`, `reason` and `note`.
        - What was sent: `GET /api/notification-deliveries?escalation_id={id}`,
          one row per recipient and channel, the emails and the pushes, or
          a single row with an empty `recipient` and the status `not_sent`
          when no rule names a recipient. Deliveries written before push was
          added carry no `escalation_id`.
      tags: [escalations]
      responses:
        "200":
          description: The escalation with its review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escalation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/escalations/{id}/assign:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: assignEscalation
      summary: Assign an escalation
      description: Gives the escalation to one staff member, or to nobody (`assignee_id` null).
      tags: [escalations]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationAssignment"
      responses:
        "200":
          description: The escalation after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escalation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EscalationConflict"

  /api/escalations/{id}/close:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: closeEscalation
      summary: Close an escalation
      tags: [escalations]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationClosure"
      responses:
        "200":
          description: The closed escalation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escalation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EscalationConflict"

  /api/users:
    get:
      operationId: listUsers
      summary: List staff
      description: Everyone who has signed in and isn't disabled, by name. Used to assign an escalation.
      tags: [session]
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/notification-rules:
    get:
      operationId: listNotificationRules
      summary: List notification rules
      description: |
        Who is told about what (FR-7): event type × location → recipients
        (D-102). A rule without a location applies to every location and to
        events that belong to none (system problems). A rule for
        `location_report` holds the addresses a location's reports are sent
        to, for example its store manager's, and must name the location
        (D-085). A `push` rule (D-097) is for `escalation` or
        `system_problem` only; its recipients are staff, and each is
        delivered to that person's devices with the phone app.
      tags: [notifications]
      responses:
        "200":
          description: Every rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRuleList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createNotificationRule
      summary: Add a notification rule
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRuleCreate"
      responses:
        "201":
          description: The new rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRule"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/RuleConflict"

  /api/notification-rules/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getNotificationRule
      summary: Get a notification rule
      tags: [notifications]
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRule"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateNotificationRule
      summary: Change a notification rule
      description: Changes the fields that are given.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRuleUpdate"
      responses:
        "200":
          description: The rule after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRule"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RuleConflict"
    delete:
      operationId: deleteNotificationRule
      summary: Remove a notification rule
      description: Removes the rule. Deliveries it caused stay in the log.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The rule is gone.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/notification-deliveries:
    get:
      operationId: listNotificationDeliveries
      summary: The delivery log
      description: |
        Every notification the engine tried to deliver, newest first, one
        row per recipient. `not_sent` means the engine did not try: sending
        is switched off, the sender isn't signed in, or no rule names a
        recipient for the event. A `push` row is one person: it is sent to
        each of their devices, and `status_reason` says how many it reached;
        it is `not_sent` when the person has no device.
      tags: [notifications]
      parameters:
        - name: event_type
          in: query
          schema:
            $ref: "#/components/schemas/NotificationEventType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DeliveryStatus"
        - name: escalation_id
          in: query
          description: Only the deliveries of this escalation's events (`NotificationDelivery.escalation_id`).
          schema:
            type: integer
            format: int64
        - name: report_id
          in: query
          description: Only the deliveries of this report's sends (`NotificationDelivery.report_id`).
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of deliveries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeliveryList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/devices:
    post:
      operationId: registerDevice
      summary: Register this device for push
      description: |
        Registers the phone app's APNs token for the session that sends it
        (D-097): a device belongs to its app session, so signing out, a
        session that ends and a user who is disabled stop its pushes. One
        device per session: registering again replaces the token. A token
        another session had moves to this one, since a shared device
        changes hands. A registration that changes nothing writes nothing.
        Only the app's bearer token registers a device. An engine sends to
        one APNs environment; a token of the other is refused with a 400.
        What a push carries, and what raises one, is `PushPayload` and
        `NotificationEventType`.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: unregisterDevice
      summary: Stop push to this device
      description: Removes a device of the signed-in user; another user's device is a 404.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/notifications/test:
    post:
      operationId: sendTestNotification
      summary: Send a test email
      description: |
        Queues one test message to the address given, through the same
        channel and log as every other notification. With sending switched
        off it ends as `not_sent` in the delivery log.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestNotification"
      responses:
        "202":
          description: The delivery that was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDelivery"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/system/settings:
    get:
      operationId: getSystemSettings
      summary: The posting and sending switches
      description: |
        `posting_enabled` is the global kill switch: off,
        no reply is posted to Google and no draft can be approved. Each
        location has its own switch on top (`Location.posting_enabled`).
        `email_sending_enabled` lets notifications leave as email.
      tags: [system]
      responses:
        "200":
          description: The switches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateSystemSettings
      summary: Flip the posting or sending switch
      tags: [system]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemSettingsUpdate"
      responses:
        "200":
          description: The switches after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/audit-log:
    get:
      operationId: listAuditLog
      summary: List audit entries
      description: Who did what, newest first. Entries are never changed or deleted.
      tags: [audit]
      parameters:
        - name: action
          in: query
          description: An exact action, for example `location.link`.
          schema:
            type: string
        - name: object_type
          in: query
          schema:
            type: string
        - name: object_id
          in: query
          schema:
            type: string
        - name: actor
          in: query
          description: Part of the actor (an email address, or `system:`).
          schema:
            type: string
        - name: location_id
          in: query
          description: |
            Only the entries about this location (`AuditEntry.location_id`).
            Entries written before the engine recorded a location have none
            and are not found by this filter.
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/system/status:
    get:
      operationId: getSystemStatus
      summary: System status
      description: |
        The state of the engine's integrations: whether the GBP token works,
        when locations were last discovered, the last review sync of every
        location, Pub/Sub notifications, the analysis pipeline, and jobs that
        failed.
      tags: [system]
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-poni_session
      description: |
        The session cookie set by signing in: HttpOnly, SameSite=Strict, and
        Secure. On plain `http://localhost` in development it is called
        `poni_session` and isn't Secure. A changing request with it must
        carry `X-CSRF-Token`.
    bearer:
      type: http
      scheme: bearer
      description: |
        The phone app's token, from `POST /api/auth/app-token` (D-095), sent
        as `Authorization: Bearer <token>`. The engine reads it from that
        header and from nowhere else. A request with this header is the
        token's alone: a cookie sent beside it is not looked at, and a token
        that is unknown or has ended is a 401 on every route that needs a
        session. A route that needs none (`GET /api/session`, the sign-in
        routes, `GET /api/health`) does not refuse an unknown token, and
        `GET /api/session` among them answers it with a 200 and
        `authenticated: false`. A token needs no CSRF token.

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: The engine's own id of the object.
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      description: Page number, from 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ConnectionAccount:
      name: account
      in: path
      required: true
      description: Which Google account. `gbp`, the GBP managing account; `gmail`, the mailbox notifications are sent from.
      schema:
        type: string
        enum: [gbp, gmail]
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: >-
        The session's CSRF token, from `GET /api/session`. A request with
        the session cookie must carry it, or the answer is a 403. A request
        with a bearer token needs none and leaves it out.
      schema:
        type: string

  responses:
    Unauthenticated:
      description: Nobody is signed in, or the session has ended (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        The request was refused: the CSRF token is missing or wrong
        (`csrf_token_invalid`), or it came from another site (`forbidden_origin`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: There is no such object (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: A parameter or the body is not valid (`invalid_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReplySettingsConflict:
      description: |
        `reply_settings_incomplete` (reading only): the stored settings lack
        a field, which the message names; replacing them repairs it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DraftConflict:
      description: |
        The draft can't take this action. `draft_not_open`: it is no longer
        waiting (already approved, posted, rejected, replaced). `draft_changed`:
        the text sent is not the stored text. `draft_empty`: there is no text
        to post. `checks_failed`: a reply check fails on the text.
        `posting_disabled`: the global or the location's posting switch is
        off. `review_not_postable`: the review was removed, edited since the
        draft was written, already has a reply, or its location isn't synced.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GoLiveConflict:
      description: |
        `go_live_running`: a test of the location's configuration is already
        running. `go_live_not_running`: the test has ended, so there is
        nothing to cancel.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    EscalationConflict:
      description: |
        The escalation is closed (`escalation_closed`), or the user named
        doesn't exist or is disabled (`user_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReportConflict:
      description: |
        `report_not_ready`: the report is not `ready`, so it cannot be sent.
        `location_not_enabled`: the location is switched off, so its
        reports are not sent. `sending_off`: email sending is switched off,
        or no sending mailbox is connected, so a report would reach nobody.
        `no_public_bucket`: the engine has no public bucket
        (`PONI_PUBLIC_BUCKET`): a report is not created without one, and
        one cannot be sent after the bucket was taken away, because its
        page has no address. `no_recipients`: no enabled `location_report`
        rule names an address for the location.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StorageFailed:
      description: |
        The page could not be put into the public bucket (`storage_failed`).
        Nothing was recorded and nothing was sent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LocalPostConflict:
      description: |
        The request can't be carried out as things are. `local_post_not_open`:
        the post is no longer a `draft`, so it can't be edited, approved or
        rejected; or it is not a `draft` or a `rejected` post, so it can't be
        deleted. `local_post_not_copyable`: the post's content can't be held
        by a draft at all (a part longer than a draft takes). `local_post_changed`: the content sent is not the stored
        content. `checks_failed`: a check fails on the content.
        `posting_disabled`: the global or the location's posting switch is
        off. `location_not_synced`: the location is switched off
        (`Location.enabled`), or the engine has lost access to it.
        `local_post_not_at_google`: the post was never sent, or the engine
        does not yet know its name at Google, so there is nothing to
        delete. `no_public_bucket`: the engine has no public bucket
        (`PONI_PUBLIC_BUCKET`), so a post can have no media.
        `too_few_reviews`: fewer than 10 analysed reviews in the last 90
        days, so no ideas are asked for. `local_posts_unavailable`: the
        engine runs against the Google mock, which has no posts.

        About an edit of a post that is at Google (D-099).
        `local_post_not_editable`: the post can't have an edit (it is not
        `sent`, has no name at Google, its removal was requested, or it
        holds what a draft cannot hold). `local_post_edit_not_open`: the
        post has no edit that is a `draft` (none at all, or one that is
        `approved` or `sending`). `local_post_edit_unchanged`: the edit says
        what the post already says, so there is nothing to send.
        `local_post_changed`, for an edit: writing it, `based_on` is not
        the post's content now; approving it, the content sent is not what
        the engine serves as the edit's content now, or a field the edit
        changes was changed at Google since the edit was written (the
        message names it).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RuleConflict:
      description: |
        The location named doesn't exist (`location_not_found`), a rule for
        this event type, channel and location already exists (`rule_exists`),
        or a push rule was asked of an engine without the APNs settings
        (`push_not_configured`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: Too many sign-in attempts from this address (`too_many_attempts`).
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: "`ok` when every dependency works, `degraded` otherwise."
        version:
          type: string
          description: Engine version.
          examples: ["0.1.0"]
        database:
          $ref: "#/components/schemas/DatabaseHealth"
    DatabaseHealth:
      type: object
      additionalProperties: false
      required: [reachable]
      properties:
        reachable:
          type: boolean
          description: Whether the engine could run a query just now.

    Error:
      type: object
      description: Body of every error response the engine itself produces.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              examples: [not_found]
            message:
              type: string
              description: Human-readable explanation.

    Session:
      type: object
      additionalProperties: false
      required: [authenticated, user, csrf_token, sign_in, google_mock]
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
          description: The signed-in user; null when nobody is signed in.
        csrf_token:
          type: [string, "null"]
          description: >-
            Send this in `X-CSRF-Token` with every changing request. Null when
            nobody is signed in, and for a bearer token, which needs none.
        sign_in:
          $ref: "#/components/schemas/SignInMethods"
        google_mock:
          type: boolean
          description: >-
            The engine sends its Google calls to the local mock (`poni-tools
            mock-google`, development only, D-087): every location, review and
            reply it shows is made up, and nothing reaches Google.
    AppTokenRequest:
      type: object
      additionalProperties: false
      required: [code, code_verifier]
      properties:
        code:
          type: string
          description: The one-time code `gbpmanager://auth` was opened with.
        code_verifier:
          type: string
          description: >-
            The PKCE verifier whose S256 challenge started the sign-in: 43 to
            128 characters of letters, digits, `-`, `.`, `_` and `~` (RFC 7636).
    AppToken:
      type: object
      additionalProperties: false
      required: [token, expires_at, session]
      properties:
        token:
          type: string
          description: "Send as `Authorization: Bearer <token>`. Shown this once; the engine keeps only its hash."
        expires_at:
          type: string
          format: date-time
          description: >-
            When the token ends at the latest (90 days after signing in). It
            ends earlier after 30 days without a request; either way the
            answer is then a 401 and the person signs in again.
        session:
          $ref: "#/components/schemas/Session"
    User:
      type: object
      additionalProperties: false
      required: [id, email, name, picture_url]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        picture_url:
          type: [string, "null"]
    SignInMethods:
      type: object
      description: The ways of signing in this engine offers.
      additionalProperties: false
      required: [google, dev, domains]
      properties:
        google:
          type: boolean
          description: Google sign-in is set up.
        dev:
          type: boolean
          description: Development sign-in is switched on (local development only).
        domains:
          type: array
          description: >-
            The Google Workspace domains whose accounts may sign in with Google,
            for the sign-in page to show.
          items:
            type: string

    Client:
      type: object
      additionalProperties: false
      description: |
        A group of locations, for bookkeeping only (D-102): a name, notes and
        the locations linked to it. No setting, switch, test or report is a
        client's; each is its location's. A client's figures are read
        location by location, from `location_ids`.
      required: [id, name, notes, archived, location_count, location_ids, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        notes:
          type: string
        archived:
          type: boolean
          description: |
            Archived clients stay for history and are left out of lists that
            ask for active ones. Archiving changes nothing about the
            client's locations.
        location_count:
          type: integer
          format: int64
          description: Locations linked to the client.
        location_ids:
          type: array
          description: The ids of the locations linked to the client, in id order.
          items:
            type: integer
            format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ClientCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 5000
    ClientUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 5000
        archived:
          type: boolean
    ClientList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        total:
          type: integer
          format: int64

    AccessStatus:
      type: string
      enum: [active, lost]
      description: |
        `active`: the managing account can see the location. `lost`: it was
        missing from two discoveries in a row, so access was removed or the
        profile is gone.
    Location:
      type: object
      additionalProperties: false
      required:
        - id
        - gbp_location_id
        - gbp_account_id
        - client_id
        - client_name
        - enabled
        - industry_key
        - analyze_from
        - audience
        - title
        - store_code
        - primary_category
        - address
        - locality
        - administrative_area
        - postal_code
        - region_code
        - phone
        - website_uri
        - maps_uri
        - access_status
        - access_lost_at
        - first_seen_at
        - last_seen_at
        - review_poll_interval_s
        - posting_enabled
        - review_count
        - unreplied_count
        - average_rating
        - reviews_polled_at
        - reviews_full_synced_at
        - last_sync_error
        - last_sync_error_at
        - local_posts_synced_at
        - local_posts_sync_error
        - local_posts_sync_error_at
        - time_zone
      properties:
        id:
          type: integer
          format: int64
        gbp_location_id:
          type: string
          description: Google's id of the location.
        gbp_account_id:
          type: string
          description: The GBP account the location is reached through.
        client_id:
          type: [integer, "null"]
          format: int64
          description: |
            The client the location is grouped under; null until staff link
            it. Bookkeeping only (D-102): the link changes nothing about what
            the engine does with the location.
        client_name:
          type: [string, "null"]
        enabled:
          type: boolean
          description: |
            Whether the engine works on this location (D-102). False when
            the location is discovered: it is then only listed, with no
            review poll or sync, no analysis or draft, no local posts, no
            go-live test, no report and no auto-post. Only a person switches
            it, with `PATCH /api/locations/{id}`; no client is needed.
        industry_key:
          type: [string, "null"]
          description: |
            The `key` of the industry whose profile the location's reviews
            are analyzed with: one of `Knowledge.industries`. Null, or a key
            that is not among them because a later knowledge base dropped
            it: its reviews are not analyzed until it is given one. The
            engine does not take it from `primary_category`.
        analyze_from:
          type: [string, "null"]
          format: date
          description: |
            Only reviews written on or after this day (UTC) are analyzed and
            drafted on their own (D-102). Null, every review is. Staff can
            still ask for the analysis of an older review by hand.
        audience:
          type: string
          description: |
            Who the customers are, in a line written by staff (D-088). The
            model reads it when it is asked for ideas and texts for local
            posts. Empty when nobody has written one.
        title:
          type: string
        store_code:
          type: [string, "null"]
        primary_category:
          type: [string, "null"]
        address:
          type: [string, "null"]
          description: Street address lines, joined with commas.
        locality:
          type: [string, "null"]
        administrative_area:
          type: [string, "null"]
        postal_code:
          type: [string, "null"]
        region_code:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        website_uri:
          type: [string, "null"]
        maps_uri:
          type: [string, "null"]
        access_status:
          $ref: "#/components/schemas/AccessStatus"
        access_lost_at:
          type: [string, "null"]
          format: date-time
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: The last discovery that saw the location.
        review_poll_interval_s:
          type: integer
          format: int64
          description: Seconds between review polls of this location.
        posting_enabled:
          type: boolean
          description: The location's kill switch for posting replies and local posts; the global switch must be on too.
        review_count:
          type: integer
          format: int64
          description: Reviews on Google now (removed ones not counted).
        unreplied_count:
          type: integer
          format: int64
          description: Of those, the ones without a reply.
        average_rating:
          type: [number, "null"]
          description: Average star rating of the stored reviews; null without reviews.
        reviews_polled_at:
          type: [string, "null"]
          format: date-time
          description: Last successful review poll.
        reviews_full_synced_at:
          type: [string, "null"]
          format: date-time
          description: Last successful full reconciliation of the reviews.
        last_sync_error:
          type: [string, "null"]
          description: Why the last review sync failed; null after a success.
        last_sync_error_at:
          type: [string, "null"]
          format: date-time
        local_posts_synced_at:
          type: [string, "null"]
          format: date-time
          description: When the location's local posts were last read from Google; null before the first read.
        local_posts_sync_error:
          type: [string, "null"]
          description: Why the last read of the local posts failed; null after a success.
        local_posts_sync_error_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the last read of the local posts failed; null after a
            success and before the first failure. A read that fails again
            with the same message moves this time and nothing else, which is
            why it is here: see `POST /api/locations/{id}/local-posts/refresh`
            for how to tell that a read has ended.
        time_zone:
          type: [string, "null"]
          description: |
            The location's time zone, an IANA name such as
            `America/New_York`. It is the same value as
            `AutoPosting.time_zone`, where the posting window uses it, and
            the only one a location has. Google gives none, so it is null
            until a person enters it, in one place only,
            `PATCH /api/locations/{id}/auto-posting`; `LocationUpdate` does
            not take it. A report of the location takes this zone unless
            it names another (`ReportCreate.time_zone`). It does not change how
            date-times are written: they stay UTC, `scheduled_time` and
            `recurrence.until` of a local post included.
    LocationUpdate:
      type: object
      additionalProperties: false
      properties:
        client_id:
          type: [integer, "null"]
          format: int64
          description: The client to group the location under; null unlinks. Left out, the link stays as it is.
        enabled:
          type: boolean
          description: |
            As in `Location`. Switching on needs a location whose
            `access_status` is `active`, and starts a full sync within a
            minute; it switches nothing else on and lifts no pause.
            Switching off also switches the location's auto-posting off,
            and stops an approved reply, local post or edit before it is
            sent; a removal of a local post that a person asked for still
            goes ahead.
        industry_key:
          type: [string, "null"]
          description: The `key` of an industry in `Knowledge.industries`, or null for none.
        analyze_from:
          type: [string, "null"]
          format: date
          description: As in `Location`; null for every review. Left out, it stays as it is.
        audience:
          type: string
          maxLength: 500
          description: As in `Location`.
        review_poll_interval_s:
          type: integer
          minimum: 60
          maximum: 86400
        posting_enabled:
          type: boolean
          description: The location's kill switch. Off, no reply and no local post is sent to this location.
    LocationList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        total:
          type: integer
          format: int64
    Enqueued:
      type: object
      additionalProperties: false
      required: [enqueued]
      properties:
        enqueued:
          type: boolean

    Review:
      type: object
      additionalProperties: false
      required:
        - id
        - location_id
        - location_title
        - client_id
        - client_name
        - rating
        - comment
        - original_text
        - translated_text
        - language
        - reviewer_name
        - reviewer_photo_url
        - reviewer_anonymous
        - created_time
        - updated_time
        - has_reply
        - reply
        - status
        - removed_at
        - first_seen_at
        - last_seen_at
        - ignored
        - analysis
        - draft
      properties:
        id:
          type: integer
          format: int64
        location_id:
          type: integer
          format: int64
        location_title:
          type: string
        client_id:
          type: [integer, "null"]
          format: int64
        client_name:
          type: [string, "null"]
        rating:
          type: [integer, "null"]
          minimum: 1
          maximum: 5
          description: Stars, 1 to 5.
        comment:
          type: [string, "null"]
          description: The review text exactly as Google sent it; null for a rating-only review.
        original_text:
          type: [string, "null"]
          description: What the reviewer wrote, without Google's translation.
        translated_text:
          type: [string, "null"]
          description: Google's English translation, when the review came with one.
        language:
          type: [string, "null"]
          description: |
            The engine's guess at the review's language from its script:
            `en`, `zh`, `ja`, `ko`, `es`, `fr` or `other`; null without text.
            Google provides no language field.
        reviewer_name:
          type: [string, "null"]
        reviewer_photo_url:
          type: [string, "null"]
        reviewer_anonymous:
          type: boolean
        created_time:
          type: string
          format: date-time
          description: When the review was written (Google's time).
        updated_time:
          type: string
          format: date-time
          description: When the reviewer last changed it (Google's time).
        has_reply:
          type: boolean
        reply:
          oneOf:
            - $ref: "#/components/schemas/ReviewReply"
            - type: "null"
          description: The reply on Google now; null when there is none.
        status:
          type: string
          enum: [active, removed]
          description: "`removed`: Google no longer has the review (deleted by its author or taken down)."
        removed_at:
          type: [string, "null"]
          format: date-time
        first_seen_at:
          type: string
          format: date-time
          description: When the engine first stored the review.
        last_seen_at:
          type: string
          format: date-time
          description: The last time Google returned the review.
        ignored:
          description: |
            Set when a person decided that this review needs no reply; null
            otherwise. An ignored review is not drafted for and is not in
            the approval queue. The decision ends when the reviewer edits
            the review.
          oneOf:
            - $ref: "#/components/schemas/ReviewIgnore"
            - type: "null"
        analysis:
          description: The newest analysis; null if the review has not been analyzed.
          oneOf:
            - $ref: "#/components/schemas/ReviewAnalysis"
            - type: "null"
        draft:
          description: |
            The newest reply draft, whatever its status, without its
            `inputs`; null if none was written. A review that already had a
            reply gets an analysis and no draft.
          oneOf:
            - $ref: "#/components/schemas/ReplyDraft"
            - type: "null"
    ReviewIgnore:
      type: object
      description: A person's decision that a review needs no reply.
      additionalProperties: false
      required: [by, at, reason]
      properties:
        by:
          type: string
          description: The email of the person who decided.
        at:
          type: string
          format: date-time
        reason:
          type: string
          description: Why, if they said; may be empty.
    ReviewIgnoreRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
    ReviewReply:
      type: object
      additionalProperties: false
      required: [text, updated_time, state, origin]
      properties:
        text:
          type: string
        updated_time:
          type: [string, "null"]
          format: date-time
        state:
          type: [string, "null"]
          description: Google's review state of the reply, for example `APPROVED`.
        origin:
          type: [string, "null"]
          enum: [external, system, null]
          description: "`external`: posted outside this system. `system`: posted by the engine (from Phase 3)."
    ReviewList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        total:
          type: integer
          format: int64
    ReviewEvent:
      type: object
      additionalProperties: false
      required: [id, kind, source, occurred_at, detail]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [discovered, review_edited, reply_added, reply_changed, reply_removed, removed, restored]
        source:
          type: string
          enum: [poll, full_sync, notification]
          description: Which sync path noticed it.
        occurred_at:
          type: string
          format: date-time
          description: When the engine noticed, not when it happened on Google.
        detail:
          type: object
          description: Values before and after, depending on the kind.
          additionalProperties: true
    ReviewEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewEvent"

    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, occurred_at, actor_type, actor, action, object_type, object_id, location_id, location_title, before, after, ip]
      properties:
        id:
          type: integer
          format: int64
        occurred_at:
          type: string
          format: date-time
        actor_type:
          type: string
          enum: [user, system, anonymous]
        actor:
          type: string
          description: The user's email address, or `system:<component>` for the engine itself.
        action:
          type: string
          description: |
            `<object>.<verb>`, for example `location.link`. New actions are
            added as the engine learns to do more, and a client shows one it
            does not know as it is. The verb is not always a plain verb
            (`reply.post_outcome_unknown`), and the object is not always the
            `object_type` (`reply.posted` is about a `draft`,
            `reply_settings.update` and `local_posts.refresh` about a
            `location`).
        object_type:
          type: string
          description: |
            What the entry is about. The engine writes these today: `client`,
            `location`, `system_settings`, `ai_settings`, `review`, `draft`
            (a reply draft), `escalation`, `local_post`, `local_post_media`,
            `notification_rule`, `notification_delivery`, `report`,
            `report_schedule`, `go_live_run`, `user` (signing in and out),
            `device` and `credential`. Entries about a `report_share_link`
            are from before D-104, which removed share links. The list grows
            like the actions do.
        object_id:
          type: string
        location_id:
          type: [integer, "null"]
          format: int64
          description: |
            The location the entry is about, recorded when the entry was
            written (D-103), so it stays when the object is deleted later.
            For a `location` it is that location; for a `review`, `draft`,
            `escalation`, `local_post`, `report`, `report_share_link` (an
            entry from before D-104), `report_schedule` and `go_live_run` it
            is the object's location;
            for a `notification_rule` it is the rule's location, or null for
            a rule of every location. Null for an entry about no one
            location (a `client`, `system_settings`, `ai_settings`, a
            `user`, a `device`, a `credential`, a `local_post_media`, a
            `notification_delivery`, `location.discovery_requested`), and for
            entries written before the engine recorded a location.
        location_title:
          type: [string, "null"]
          description: The location's title as it is now, for display; null when `location_id` is.
        before:
          description: The values before the change; null when there are none.
        after:
          description: The values after the change; null when there are none.
        ip:
          type: [string, "null"]
          description: The address the request came from, for changes made by people.
    AuditList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        total:
          type: integer
          format: int64

    SystemStatus:
      type: object
      additionalProperties: false
      required:
        - version
        - database
        - knowledge
        - connect_configured
        - gbp
        - location_discovery
        - pubsub
        - ai
        - posting
        - email
        - locations
        - jobs
      properties:
        version:
          type: string
        database:
          $ref: "#/components/schemas/DatabaseHealth"
        knowledge:
          $ref: "#/components/schemas/KnowledgeStatus"
        connect_configured:
          type: boolean
          description: |
            The engine can connect a Google account from the dashboard: it
            has the OAuth client and the key that encrypts stored tokens.
        gbp:
          $ref: "#/components/schemas/GbpStatus"
        location_discovery:
          $ref: "#/components/schemas/IntegrationStatus"
        pubsub:
          $ref: "#/components/schemas/PubsubStatus"
        ai:
          $ref: "#/components/schemas/AiStatus"
        posting:
          $ref: "#/components/schemas/PostingStatus"
        email:
          $ref: "#/components/schemas/EmailStatus"
        locations:
          type: array
          items:
            $ref: "#/components/schemas/LocationSyncStatus"
        jobs:
          $ref: "#/components/schemas/JobsStatus"
    ConnectionStart:
      type: object
      additionalProperties: false
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
          format: uri
          description: The address at Google to send the browser to.
    KnowledgeStatus:
      type: object
      description: Which knowledge base is seeded (FR-13).
      additionalProperties: false
      required: [version, seeded_at]
      properties:
        version:
          type: string
          description: A hash of the knowledge files' content.
        seeded_at:
          type: string
          description: When this version was seeded.
    IntegrationStatus:
      type: object
      description: The last success and the last failure. `last_error` is null after a success.
      additionalProperties: false
      required: [last_ok_at, last_error, last_error_at]
      properties:
        last_ok_at:
          type: [string, "null"]
          format: date-time
        last_error:
          type: [string, "null"]
        last_error_at:
          type: [string, "null"]
          format: date-time
    GbpStatus:
      type: object
      description: The GBP managing account's token.
      additionalProperties: false
      required: [connected, account_email, last_ok_at, last_error, last_error_at]
      properties:
        connected:
          type: boolean
          description: A token is stored. Whether Google still accepts it shows in the other fields.
        account_email:
          type: [string, "null"]
          description: |
            The address of the Google account that is connected, as Google
            named it when the account was connected (D-100): the account a
            client invites to manage its Business Profile. Null while
            nothing is connected, and for a token stored before the engine
            kept the address, until the account is connected again.
        last_ok_at:
          type: [string, "null"]
          format: date-time
          description: The last time Google accepted the token.
        last_error:
          type: [string, "null"]
        last_error_at:
          type: [string, "null"]
          format: date-time
    PubsubStatus:
      type: object
      description: Review notifications through Pub/Sub, the second source next to polling.
      additionalProperties: false
      required: [enabled, last_ok_at, last_error, last_error_at, last_message_at]
      properties:
        enabled:
          type: boolean
        last_ok_at:
          type: [string, "null"]
          format: date-time
          description: The last successful pull.
        last_error:
          type: [string, "null"]
        last_error_at:
          type: [string, "null"]
          format: date-time
        last_message_at:
          type: [string, "null"]
          format: date-time
          description: The last pull that brought a notification.
    LocationSyncStatus:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - client_name
        - access_status
        - syncing
        - review_count
        - reviews_polled_at
        - reviews_full_synced_at
        - last_sync_error
        - last_sync_error_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        client_name:
          type: [string, "null"]
        access_status:
          $ref: "#/components/schemas/AccessStatus"
        syncing:
          type: boolean
          description: Enabled and accessible, so its reviews are being synced.
        review_count:
          type: integer
          format: int64
        reviews_polled_at:
          type: [string, "null"]
          format: date-time
        reviews_full_synced_at:
          type: [string, "null"]
          format: date-time
        last_sync_error:
          type: [string, "null"]
        last_sync_error_at:
          type: [string, "null"]
          format: date-time
    JobsStatus:
      type: object
      additionalProperties: false
      required: [queued, running, failed, failures]
      properties:
        queued:
          type: integer
          format: int64
        running:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
          description: Jobs that failed for good in the last 7 days.
        failures:
          type: array
          description: The most recent of them, newest first (at most 20).
          items:
            $ref: "#/components/schemas/JobFailure"
    JobFailure:
      type: object
      additionalProperties: false
      required: [id, kind, attempts, last_error, failed_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        attempts:
          type: integer
          format: int64
        last_error:
          type: [string, "null"]
        failed_at:
          type: [string, "null"]
          format: date-time

    # ---- analysis and drafts (Phase 2) -------------------------------------------

    TopicMention:
      type: object
      additionalProperties: false
      required: [id, polarity]
      properties:
        id:
          type: string
          description: A topic of the location's industry profile.
        polarity:
          type: string
          enum: [positive, negative, neutral]
    ItemMention:
      type: object
      description: A dish, treatment, staff member or the like that the reviewer mentions.
      additionalProperties: false
      required: [name, type, polarity]
      properties:
        name:
          type: string
          description: As the reviewer wrote it.
        type:
          type: string
          description: An item type of the location's industry profile.
        polarity:
          type: string
          enum: [positive, negative, neutral]
    RaisedFlag:
      type: object
      description: A severity flag raised on a review.
      additionalProperties: false
      required: [id, label, evidence]
      properties:
        id:
          type: string
        label:
          type: string
        evidence:
          type: string
          description: A short quote from the review. Untrusted text.
    ReviewAnalysis:
      type: object
      description: What the analyzer found in one version of a review (FR-3).
      additionalProperties: false
      required:
        - id
        - status
        - error
        - language
        - script
        - sentiment
        - contains_complaint
        - topics
        - items
        - severity_flags
        - manipulation_suspected
        - manipulation_evidence
        - summary_en
        - industry_key
        - model
        - prompt_version
        - is_current
        - created_at
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [ok, failed]
          description: "`failed`: the model gave no usable answer. The review can't go to auto-post."
        error:
          type: [string, "null"]
        language:
          type: string
          description: ISO 639-1 code of the reviewer's own words, `other`, or `none` for a review without text.
        script:
          type: string
          enum: [Hans, Hant, Hani, Latn, Hang, other, none]
          description: "`Hans`: Simplified Chinese. `Hant`: Traditional Chinese. `Hani`: Chinese, and the analyzer did not say which (D-056)."
        sentiment:
          type: string
          enum: [positive, mixed, neutral, negative, none]
        contains_complaint:
          type: boolean
          description: The text holds a complaint, however small, even in a 5-star review.
        topics:
          type: array
          items:
            $ref: "#/components/schemas/TopicMention"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemMention"
        severity_flags:
          type: array
          items:
            $ref: "#/components/schemas/RaisedFlag"
        manipulation_suspected:
          type: boolean
          description: The review seems to instruct an AI or to dictate what the reply should contain.
        manipulation_evidence:
          type: string
          description: A short quote from the review. Untrusted text.
        summary_en:
          type: string
          description: One sentence in English for staff.
        industry_key:
          type: string
        model:
          type: [string, "null"]
          description: The analyzer model; null when no model was called (a review without text).
        prompt_version:
          type: string
        is_current:
          type: boolean
          description: False when the review was edited since; a new analysis is on its way.
        created_at:
          type: string
          format: date-time
    CheckResult:
      type: object
      description: One mechanical check on a drafted reply (architecture section 10) or on a local post's content.
      additionalProperties: false
      required: [name, passed, detail]
      properties:
        name:
          type: string
          description: |
            `not_empty`, `no_url`, `no_email`, `no_phone`, `emoji_limit`,
            `length` or `language_match` for a reply. Drafts made before
            D-058 may carry other names, and a local post has its own.
        passed:
          type: boolean
        detail:
          type: string
          description: What was found, when the check failed.
    DraftRoute:
      type: string
      enum: [auto_post, approval_queue, escalate]
      description: |
        What the policy does with the draft (FR-5). In shadow mode (Phase 2)
        nothing is posted: `auto_post` means the reply would have been posted
        without a person.
    ReplyDraft:
      type: object
      description: |
        A drafted reply and its route. The route is what the policy would do
        (FR-5). A draft routed to `auto_post` is scheduled for posting only
        where a person switched auto-posting on for the location and the
        star rating (`AutoPosting`); every other draft waits for a person.
      additionalProperties: false
      required:
        - id
        - review_id
        - status
        - status_reason
        - route
        - route_reasons
        - mode
        - text
        - language
        - script
        - generator_manipulation_suspected
        - notes_for_staff
        - checks
        - model
        - prompt_version
        - inputs
        - generated_text
        - instructions
        - created_by
        - edited_by
        - edited_at
        - decided_by
        - decided_at
        - post
        - post_at
        - policy_version
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        review_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [draft, approved, scheduled, posting, posted, published, rejected, cancelled, superseded]
          description: |
            `draft`: waiting for a person. `approved`: a person approved the
            text and the posting job has not started. `posting`: the reply is
            being sent, or was sent and Google's answer is not known.
            `posted`: Google accepted it. `published`: a later read saw it on
            Google. `rejected`: a person decided against it. `superseded`: a
            newer draft replaced it, or the review was edited. `cancelled`:
            the review got a reply outside the system, or was removed.
            `scheduled`: the policy decided to post it without a person, at
            `post_at` (auto-posting). A draft that could not be posted, or
            that may no longer be posted without a person, returns to `draft`
            with the reason in `status_reason`.
        status_reason:
          type: [string, "null"]
        route:
          $ref: "#/components/schemas/DraftRoute"
        route_reasons:
          type: array
          description: |
            Why the policy did not send the draft to auto-post, written once
            when the draft is made and never changed after. Empty for a
            draft the policy routed to `auto_post`, also when it then did not
            get posted automatically: that is in `status_reason`, prose for
            people with no fixed form (it often begins "Not posted
            automatically.", but a refused or unconfirmed reply and a review
            that could not be read say other things), and it is null when
            only a switch or the location's auto-posting configuration kept
            the draft from being scheduled. A pause is on the location
            (`AutoPosting.paused`, `pause_reason`), never among the reasons.
            The values, in this order when several apply, in the engine's
            wording:

            - `severity: <flag ids>`: the severity flag ids that were
              raised, sorted and joined with ", ", for example
              `severity: allergen_incident, hygiene`. The route is
              `escalate`, and this is then the only reason.
            - `analysis failed`: the analysis could not be used.
            - `generation failed`: the writer gave no usable reply.
            - `manipulation suspected`: the analysis or the writer suspected
              it.
            - `check failed: <check names>`: the names of the reply checks
              that failed, sorted and joined with ", ": `emoji_limit`,
              `language_match`, `length`, `no_email`, `no_phone`, `no_url`,
              `not_empty`.
            - One of these, the first that applies:
              `<n> stars` (the rating is below the policy's minimum for
              auto-posting; `<n>` is the rating, so `1 stars`, `2 stars` and
              so on), `no star rating`, `contains a complaint`,
              `auto-post is off for rating-only reviews`,
              `auto-post is off for positive reviews`.
            - `regenerated_with_instructions`: a person wrote the reply
              again with instructions of their own and the policy would have
              auto-posted it. The route is `approval_queue` and this is the
              only reason.
          items:
            type: string
        mode:
          type: string
          enum: [positive, complaint, severity, rating_only, rating_only_low]
          description: The kind of reply that was asked for.
        text:
          type: string
          description: The reply as it would be posted, either the model's text or a person's edit of it. Empty when generation failed.
        language:
          type: string
          description: The language the reply had to be in.
        script:
          type: [string, "null"]
          enum: [Hans, Hant, null]
          description: The Chinese script the generator was asked to write. Nothing checks that it did (D-056).
        generator_manipulation_suspected:
          type: boolean
        notes_for_staff:
          type: string
          description: A note from the model for the person reviewing the draft.
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
        model:
          type: string
        prompt_version:
          type: string
        inputs:
          type: [object, "null"]
          description: |
            What shaped the prompt: the review as sent, the mode, the target
            language, and the resolved voice, localization and policy. Null
            where drafts are embedded in reviews; `GET /api/reviews/{id}/drafts`
            has it.
          additionalProperties: true
        generated_text:
          type: string
          description: The reply exactly as the model wrote it, kept when `text` is edited.
        instructions:
          type: [string, "null"]
          description: The staff instructions this draft was regenerated with.
        created_by:
          type: [string, "null"]
          description: The email of the person who asked for this draft; null for the pipeline.
        edited_by:
          type: [string, "null"]
          description: The email of the person who last edited the text.
        edited_at:
          type: [string, "null"]
          format: date-time
        decided_by:
          type: [string, "null"]
          description: The email of the person who approved or rejected the draft.
        decided_at:
          type: [string, "null"]
          format: date-time
        post:
          description: The engine's newest attempt to post this draft, if it was approved.
          oneOf:
            - $ref: "#/components/schemas/ReplyPost"
            - type: "null"
        post_at:
          type: [string, "null"]
          format: date-time
          description: When a scheduled draft is posted; kept after it was.
        policy_version:
          type: [string, "null"]
          description: |
            For a draft the policy scheduled: the version of the rules that
            decided it (a short hash of the prompt version, the resolved reply
            policy and the location's auto-posting settings).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReplyDraftList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReplyDraft"

    AiStatus:
      type: object
      description: The analysis pipeline.
      additionalProperties: false
      required:
        - llm_configured
        - providers
        - enabled
        - analyzer_provider
        - analyzer_model
        - generator_provider
        - generator_model
        - last_ok_at
        - last_error
        - last_error_at
        - waiting_reviews
        - analyzed_reviews
      properties:
        llm_configured:
          type: boolean
          description: The providers both tasks name have an address and a key. Otherwise nothing is analyzed.
        providers:
          type: array
          description: The model providers the engine has an address and a key for (D-059), in name order.
          items:
            type: string
        enabled:
          type: boolean
        analyzer_provider:
          type: string
        analyzer_model:
          type: string
        generator_provider:
          type: string
        generator_model:
          type: string
        last_ok_at:
          type: [string, "null"]
          format: date-time
        last_error:
          type: [string, "null"]
        last_error_at:
          type: [string, "null"]
          format: date-time
        waiting_reviews:
          type: integer
          format: int64
          description: Reviews that still lack an analysis, or a draft while they have no reply.
        analyzed_reviews:
          type: integer
          format: int64

    # ---- industry profiles -------------------------------------------------------

    Topic:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        label:
          type: string
    ItemType:
      type: object
      additionalProperties: false
      required: [id, description, person]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        description:
          type: string
        person:
          description: >-
            True: an item of this type is a staff member a reviewer named; a location's report lists such items in its
            employee recognition section, not among the items (D-086). Null where the profile does not say, which
            means no. The analyzer is not told it.
          type: [boolean, "null"]
    SeverityFlag:
      type: object
      additionalProperties: false
      required: [id, label, description, enabled]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        label:
          type: string
        description:
          type: string
          description: The definition the analyzer is given.
        enabled:
          type: boolean
          description: Off, the analyzer is not told about the flag and can't raise it.

    # ---- voice, localization, policy ---------------------------------------------

    EmojiRule:
      type: object
      additionalProperties: false
      required: [allowed, max, preferred]
      properties:
        allowed:
          type: boolean
        max:
          type: integer
          minimum: 0
          maximum: 10
        preferred:
          type: array
          items:
            type: string
    LengthRange:
      type: object
      description: Characters.
      additionalProperties: false
      required: [min, max]
      properties:
        min:
          type: integer
          minimum: 0
        max:
          type: integer
          maximum: 4000
    LengthLimits:
      type: object
      description: Reply length per kind of reply.
      additionalProperties: false
      required: [rating_only, positive, complaint, severity]
      properties:
        rating_only:
          description: |
            For a review with no text. A draft of `mode` `rating_only_low`
            (no text, three stars or fewer) uses this range too: there is no
            range of its own.
          $ref: "#/components/schemas/LengthRange"
        positive:
          $ref: "#/components/schemas/LengthRange"
        complaint:
          $ref: "#/components/schemas/LengthRange"
        severity:
          $ref: "#/components/schemas/LengthRange"
    Voice:
      type: object
      description: A complete brand voice (FR-4).
      additionalProperties: false
      required:
        - reply_name
        - business_facts
        - sign_off
        - owner_name
        - emoji
        - promos_allowed
        - contact_allowed
        - words_to_avoid
        - length
        - style_notes
        - example_replies
        - temperature
        - base_style
      properties:
        reply_name:
          type: string
          description: How replies refer to the business. Empty, the location's title (D-102).
        business_facts:
          type: array
          description: The only facts about the business the generator may rely on.
          items:
            type: string
        sign_off:
          type: string
          description: May contain `{owner_name}`.
        owner_name:
          type: string
        emoji:
          $ref: "#/components/schemas/EmojiRule"
        promos_allowed:
          type: boolean
          description: May a reply mention promotions, discounts or free items?
        contact_allowed:
          type: boolean
          description: May a reply carry a phone number, an email address or a link?
        words_to_avoid:
          type: array
          items:
            type: string
        length:
          type: object
          description: By reply language (`en`, `zh`, `es`).
          additionalProperties:
            $ref: "#/components/schemas/LengthLimits"
        style_notes:
          type: array
          items:
            type: string
        example_replies:
          type: array
          description: Replies the business wrote itself. A tone reference, never copied.
          items:
            type: string
        temperature:
          type: number
          minimum: 0
          maximum: 2
          description: |
            The temperature the writer is asked with (D-074). Not part of
            the prompt. A change needs a new go-live test.
        base_style:
          type: string
          maxLength: 2000
          description: |
            One line the writer is given as the base of the style. Taking a
            voice template fills it with the template's label and
            description (D-080); empty, the writer is given none.
    VoiceLayer:
      type: object
      description: |
        The voice fields a voice template sets; a field that is absent is
        left as it is by taking the template. `emoji` and `length` may be
        partial too: `{"emoji": {"max": 1}}` changes only that number.
      additionalProperties: false
      properties:
        reply_name:
          type: string
        business_facts:
          type: array
          items:
            type: string
        sign_off:
          type: string
        owner_name:
          type: string
        emoji:
          type: object
          additionalProperties: false
          properties:
            allowed:
              type: boolean
            max:
              type: integer
              minimum: 0
              maximum: 10
            preferred:
              type: array
              items:
                type: string
        promos_allowed:
          type: boolean
        contact_allowed:
          type: boolean
        words_to_avoid:
          type: array
          items:
            type: string
        length:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              rating_only:
                $ref: "#/components/schemas/LengthRange"
              positive:
                $ref: "#/components/schemas/LengthRange"
              complaint:
                $ref: "#/components/schemas/LengthRange"
              severity:
                $ref: "#/components/schemas/LengthRange"
        style_notes:
          type: array
          items:
            type: string
        example_replies:
          type: array
          items:
            type: string
        temperature:
          type: number
          minimum: 0
          maximum: 2
        base_style:
          type: string
          maxLength: 2000
    ReplyLanguage:
      type: string
      enum: [en, zh, es]
      description: The languages the engine can check a reply in.
    Localization:
      type: object
      description: Complete localization preferences (FR-4, D-022).
      additionalProperties: false
      required: [reply_languages, chinese_script, chinese_region, english_variant, fallback_language]
      properties:
        reply_languages:
          type: array
          description: A review in one of these languages is answered in it; any other gets `fallback_language`.
          minItems: 1
          items:
            $ref: "#/components/schemas/ReplyLanguage"
        chinese_script:
          type: string
          enum: [match, simplified, traditional]
          description: "`match`: the script the reviewer used."
        chinese_region:
          type: string
          enum: [mainland, taiwan, hong_kong]
          description: Phrasing of a Traditional reply.
        english_variant:
          type: string
          enum: [us, ca]
        fallback_language:
          $ref: "#/components/schemas/ReplyLanguage"
    PolicyRules:
      type: object
      description: The complete tiered reply policy (FR-5), with the timing of auto-posts.
      additionalProperties: false
      required:
        - auto_post_positive
        - auto_post_rating_only
        - auto_post_min_stars
        - auto_post_delay_min_minutes
        - auto_post_delay_max_minutes
        - auto_post_window_start
        - auto_post_window_end
      properties:
        auto_post_positive:
          type: boolean
          description: A review with text, enough stars and no complaint goes to auto-post when every check passes.
        auto_post_rating_only:
          type: boolean
          description: The same for a review without text.
        auto_post_min_stars:
          type: integer
          minimum: 1
          maximum: 5
          description: Reviews below this many stars always wait for a person.
        auto_post_delay_min_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: An auto-post waits a random time between this and the maximum, so replies look human. 0 and 0, no delay.
        auto_post_delay_max_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        auto_post_window_start:
          type: string
          pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9])?$"
          description: |
            The posting window in the location's local time, `HH:MM`; empty,
            none. A reply due outside it moves into the next one. A start
            later than the end crosses midnight. A window needs the
            location's time zone (`AutoPosting.time_zone`).
        auto_post_window_end:
          type: string
          pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9])?$"
    ReplySettings:
      type: object
      description: What a location's replies are written with (D-093).
      additionalProperties: false
      required: [location_id, location_title, client_id, client_name, industry_key, voice, localization, policy, updated_at]
      properties:
        location_id:
          type: integer
          format: int64
        location_title:
          type: string
        client_id:
          type: [integer, "null"]
          format: int64
          description: The client the location is grouped under, for display only; null when it has none.
        client_name:
          type: [string, "null"]
        industry_key:
          type: [string, "null"]
          description: The location's industry (`Location.industry_key`); null, the location's reviews are not analyzed.
        voice:
          $ref: "#/components/schemas/Voice"
        localization:
          $ref: "#/components/schemas/Localization"
        policy:
          $ref: "#/components/schemas/PolicyRules"
        updated_at:
          type: string
          format: date-time
    ReplySettingsUpdate:
      type: object
      description: A location's complete reply settings; every field of every part is sent.
      additionalProperties: false
      required: [voice, localization, policy]
      properties:
        voice:
          $ref: "#/components/schemas/Voice"
        localization:
          $ref: "#/components/schemas/Localization"
        policy:
          $ref: "#/components/schemas/PolicyRules"

    # ---- pipeline settings and LLM usage -----------------------------------------

    ModelPrice:
      type: object
      description: USD per million tokens.
      additionalProperties: false
      required: [input_per_mtok, output_per_mtok]
      properties:
        input_per_mtok:
          type: number
          minimum: 0
        output_per_mtok:
          type: number
          minimum: 0

    # ---- the knowledge base (read-only) ------------------------------------------

    Knowledge:
      type: object
      description: The knowledge base as it is seeded (FR-13, D-078).
      additionalProperties: false
      required: [version, format, seeded_at, industries, common_severity_flags, voice_templates, defaults, model_prices]
      properties:
        version:
          type: string
          description: A hash of the knowledge files' content.
        format:
          type: integer
          description: The shape of the knowledge files.
        seeded_at:
          type: string
          description: When this version was seeded.
        industries:
          type: array
          description: The supported industries; a location can be given one of these.
          items:
            $ref: "#/components/schemas/KnowledgeIndustry"
        common_severity_flags:
          type: array
          description: The severity flags of every industry.
          items:
            $ref: "#/components/schemas/SeverityFlag"
        voice_templates:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeVoiceTemplate"
        defaults:
          $ref: "#/components/schemas/KnowledgeDefaults"
        model_prices:
          type: object
          description: By model name, for the cost estimate. A model without a price has no estimate.
          additionalProperties:
            $ref: "#/components/schemas/ModelPrice"
    KnowledgeIndustry:
      type: object
      description: A supported industry. Its pack was complete when it was seeded.
      additionalProperties: false
      required: [key, label, topics, item_types, severity_flags, test_client_name, corpus, location_count]
      properties:
        key:
          type: string
          description: What `Location.industry_key` names.
        label:
          type: string
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
        item_types:
          type: array
          items:
            $ref: "#/components/schemas/ItemType"
        severity_flags:
          type: array
          description: The industry's own flags; `common_severity_flags` apply as well.
          items:
            $ref: "#/components/schemas/SeverityFlag"
        test_client_name:
          type: string
          description: The made-up business the test suites run as.
        corpus:
          $ref: "#/components/schemas/KnowledgeCorpusSummary"
        location_count:
          type: integer
          format: int64
          description: Enabled locations that name this industry.
    KnowledgeCorpusSummary:
      type: object
      additionalProperties: false
      required: [version, severity_cases, manipulation_cases, control_cases]
      properties:
        version:
          type: string
          description: A hash of the cases.
        severity_cases:
          type: integer
          format: int64
        manipulation_cases:
          type: integer
          format: int64
        control_cases:
          type: integer
          format: int64
          description: Ordinary reviews.
    KnowledgeVoiceTemplate:
      type: object
      additionalProperties: false
      required: [key, label, description, voice]
      properties:
        key:
          type: string
        label:
          type: string
        description:
          type: string
          description: With the label, what `Voice.base_style` becomes when the template is taken.
        voice:
          $ref: "#/components/schemas/VoiceLayer"
    KnowledgeDefaults:
      type: object
      description: |
        What every location starts from when it is discovered (D-093, D-102), and the default of
        every analysis setting.
      additionalProperties: false
      required: [voice, localization, policy, analysis]
      properties:
        voice:
          $ref: "#/components/schemas/Voice"
        localization:
          $ref: "#/components/schemas/Localization"
        policy:
          $ref: "#/components/schemas/PolicyRules"
        analysis:
          type: object
          description: By the names of `AiSettings`' fields.
          additionalProperties: true
    KnowledgeCorpus:
      type: object
      additionalProperties: false
      required: [industry_key, version, cases]
      properties:
        industry_key:
          type: string
        version:
          type: string
        cases:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeCorpusCase"
    KnowledgeCorpusCase:
      type: object
      description: One synthetic review and what is expected of it.
      additionalProperties: false
      required: [id, category, stars, lang, text, severity_any, manipulation, action]
      properties:
        id:
          type: string
        category:
          type: string
          enum: [severity, manipulation, control]
        stars:
          type: integer
          minimum: 1
          maximum: 5
        lang:
          type: string
        text:
          type: string
        severity_any:
          type: array
          description: At least one of these flags must be raised.
          items:
            type: string
        manipulation:
          type: boolean
        action:
          type: string
          description: The route the gate must give when the models behave.
          enum: [auto_post, approval_queue, escalate]
    AiSettings:
      type: object
      additionalProperties: false
      required:
        - enabled
        - analyzer_provider
        - analyzer_model
        - generator_provider
        - generator_model
        - judge_provider
        - judge_model
        - summary_provider
        - summary_model
        - posts_provider
        - posts_model
        - providers
        - analyzer_temperature
        - analyzer_send_temperature
        - generator_send_temperature
        - max_output_tokens
        - request_extras
        - batch_size
        - prompt_version
        - updated_at
      properties:
        enabled:
          type: boolean
          description: Off, no review is analyzed or drafted.
        analyzer_provider:
          type: string
          description: |
            The model provider that reads each review: one of `providers`
            (D-059). A provider is configured on the engine as
            `PONI_LLM_<NAME>_BASE_URL` and `PONI_LLM_<NAME>_API_KEY`; its
            name here is `<NAME>` in lower case.
        analyzer_model:
          type: string
          description: The model's name at `analyzer_provider`.
        generator_provider:
          type: string
          description: The model provider that writes the draft replies.
        generator_model:
          type: string
          description: The model's name at `generator_provider`.
        judge_provider:
          type: string
          description: |
            The model provider that rates the replies of a go-live test
            (D-031, D-074). A provider that speaks Anthropic's own API is
            configured with `PONI_LLM_<NAME>_PROTOCOL=anthropic`.
        judge_model:
          type: string
          description: The model's name at `judge_provider`.
        summary_provider:
          type: string
          description: The model provider that writes the summary of a report (D-085), a fourth task.
        summary_model:
          type: string
          description: The model's name at `summary_provider`.
        posts_provider:
          type: string
          description: |
            The model provider that writes ideas and texts for local posts
            (D-088), a fifth task. It is asked only when a person presses a
            button; no job calls it.
        posts_model:
          type: string
          description: The model's name at `posts_provider`.
        analyzer_temperature:
          type: number
          minimum: 0
          maximum: 2
          description: The writer's temperature is a field of the voice (`Voice.temperature`).
        analyzer_send_temperature:
          type: boolean
          description: Off, the analyzer's requests carry no temperature, for a model that refuses one.
        generator_send_temperature:
          type: boolean
          description: |
            Off, the writer's requests carry no temperature. A provider with
            the Anthropic protocol is never sent one.
        max_output_tokens:
          type: integer
          minimum: 100
          maximum: 8000
        request_extras:
          type: object
          description: |
            Extra members for the requests to a provider, by provider name,
            for example `{"dashscope": {"enable_thinking": false}}`. Another
            provider's requests don't carry them.
          additionalProperties:
            type: object
            additionalProperties: true
        batch_size:
          type: integer
          minimum: 0
          maximum: 100
          description: Reviews picked up per minute. 0 pauses the pipeline.
        prompt_version:
          type: string
          description: Of the prompts built into the engine. Read-only.
          readOnly: true
        providers:
          type: array
          description: The providers the engine has an address and a key for, in name order. Read-only.
          readOnly: true
          items:
            type: string
        updated_at:
          type: string
          format: date-time
    AiSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        analyzer_provider:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 60
          description: Must be one of `AiSettings.providers`.
        generator_provider:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 60
          description: Must be one of `AiSettings.providers`.
        analyzer_model:
          type: string
          minLength: 1
          maxLength: 100
        generator_model:
          type: string
          minLength: 1
          maxLength: 100
        judge_provider:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 60
          description: Must be one of `AiSettings.providers`.
        judge_model:
          type: string
          minLength: 1
          maxLength: 100
        summary_provider:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 60
          description: Must be one of `AiSettings.providers`.
        summary_model:
          type: string
          minLength: 1
          maxLength: 100
        posts_provider:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 60
          description: Must be one of `AiSettings.providers`.
        posts_model:
          type: string
          minLength: 1
          maxLength: 100
        analyzer_temperature:
          type: number
          minimum: 0
          maximum: 2
        analyzer_send_temperature:
          type: boolean
        generator_send_temperature:
          type: boolean
        max_output_tokens:
          type: integer
          minimum: 100
          maximum: 8000
        request_extras:
          type: object
          description: |
            By provider name. One free-form value: what is given replaces
            the stored map as a whole, and nothing in it is merged.
          additionalProperties:
            type: object
            additionalProperties: true
        batch_size:
          type: integer
          minimum: 0
          maximum: 100
    LlmUsageRow:
      type: object
      additionalProperties: false
      required:
        - key
        - label
        - calls
        - errors
        - prompt_tokens
        - completion_tokens
        - cost_usd
        - unpriced_calls
        - average_latency_ms
      properties:
        key:
          type: string
          description: The day (`2026-11-11`), the model, the task, the provider or the location's id, by grouping. `total` for the total.
        label:
          type: string
        calls:
          type: integer
          format: int64
          description: Requests sent, failed attempts included.
        errors:
          type: integer
          format: int64
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        cost_usd:
          type: number
          description: Estimated.
        unpriced_calls:
          type: integer
          format: int64
          description: Calls of a model without a price; they are not part of `cost_usd`.
        average_latency_ms:
          type: integer
          format: int64
    LlmUsage:
      type: object
      additionalProperties: false
      required: [from, to, total, by_day, by_model, by_task, by_location, by_provider]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
          description: Exclusive.
        total:
          $ref: "#/components/schemas/LlmUsageRow"
        by_day:
          type: array
          items:
            $ref: "#/components/schemas/LlmUsageRow"
        by_model:
          type: array
          items:
            $ref: "#/components/schemas/LlmUsageRow"
        by_task:
          type: array
          items:
            $ref: "#/components/schemas/LlmUsageRow"
        by_location:
          type: array
          description: One row per location, labelled with its title (D-057, D-102). Most expensive first.
          items:
            $ref: "#/components/schemas/LlmUsageRow"
        by_provider:
          type: array
          description: One row per model provider. Calls made before providers were named are under `Not recorded`.
          items:
            $ref: "#/components/schemas/LlmUsageRow"
    LlmCall:
      type: object
      description: One request to the model.
      additionalProperties: false
      required:
        - id
        - occurred_at
        - task
        - provider
        - model
        - location_id
        - review_id
        - attempt
        - status
        - error
        - http_status
        - prompt_tokens
        - completion_tokens
        - latency_ms
        - estimated_cost_usd
      properties:
        id:
          type: integer
          format: int64
        occurred_at:
          type: string
          format: date-time
        task:
          type: string
          description: "`analyzer`, `generator`, `judge` (the go-live test, D-074), `summary` (a report's, D-085) or `posts` (ideas and texts for local posts, D-088)."
        provider:
          type: [string, "null"]
          description: The model provider the request went to. Null for calls made before providers were named.
        model:
          type: string
        location_id:
          type: [integer, "null"]
          format: int64
        review_id:
          type: [integer, "null"]
          format: int64
        attempt:
          type: integer
          format: int64
          description: 1 for the first request of a call, 2 for its first retry.
        status:
          type: string
          enum: [ok, error]
        error:
          type: [string, "null"]
        http_status:
          type: [integer, "null"]
          format: int64
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        latency_ms:
          type: integer
          format: int64
        estimated_cost_usd:
          type: [number, "null"]
    LlmCallList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LlmCall"
        total:
          type: integer
          format: int64

    ReplyPost:
      type: object
      description: One attempt of the engine to put a reply on Google.
      additionalProperties: false
      required: [id, status, started_at, posted_at, published_at, error]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [posting, posted, published, failed, unconfirmed, superseded]
          description: |
            `posting`: the request was sent or is about to be, and its
            outcome isn't known yet. `posted`: Google accepted it.
            `published`: a later read saw the reply on Google. `failed`:
            Google refused it, nothing was posted. `unconfirmed`: the reply
            did not appear on Google in time. `superseded`: another reply was
            found on the review, or the review was removed.
        started_at:
          type: string
          format: date-time
        posted_at:
          type: [string, "null"]
          format: date-time
        published_at:
          type: [string, "null"]
          format: date-time
        error:
          type: [string, "null"]
    DraftUpdate:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
    DraftApproval:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          description: The reply as the approver read it. Must equal the draft's stored text.
    DraftRejection:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    DraftRegeneration:
      type: object
      additionalProperties: false
      required: [instructions]
      properties:
        instructions:
          type: string
          minLength: 1
          maxLength: 1000
          description: What to do differently, in the staff member's words.

    EscalationStatus:
      type: string
      enum: [open, closed]
    EscalationCloseReason:
      type: string
      enum: [resolved, review_removed, review_updated, no_response, dropped]
      description: "`dropped`: the owner of the business decided not to pursue it."
    Escalation:
      type: object
      description: A review that needs a person, opened by a severity flag (D-054).
      additionalProperties: false
      required:
        - id
        - review_id
        - status
        - severity_flags
        - assignee
        - assigned_at
        - close_reason
        - close_note
        - closed_by
        - closed_at
        - opened_at
        - updated_at
        - review
      properties:
        id:
          type: integer
          format: int64
        review_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/EscalationStatus"
        severity_flags:
          type: array
          description: The flags of the analysis that opened it (or opened it again).
          items:
            $ref: "#/components/schemas/RaisedFlag"
        assignee:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        assigned_at:
          type: [string, "null"]
          format: date-time
        close_reason:
          oneOf:
            - $ref: "#/components/schemas/EscalationCloseReason"
            - type: "null"
        close_note:
          type: string
        closed_by:
          type: [string, "null"]
          description: The email of the person who closed it.
        closed_at:
          type: [string, "null"]
          format: date-time
        opened_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        review:
          $ref: "#/components/schemas/Review"
    EscalationList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Escalation"
        total:
          type: integer
          format: int64
    EscalationAssignment:
      type: object
      additionalProperties: false
      required: [assignee_id]
      properties:
        assignee_id:
          type: [integer, "null"]
          format: int64
          description: A user's id; null for nobody. It must be there.
    EscalationClosure:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          $ref: "#/components/schemas/EscalationCloseReason"
        note:
          type: string
          maxLength: 2000
    UserList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"

    NotificationEventType:
      type: string
      enum: [escalation, approval_needed, system_problem, test, location_report]
      description: |
        `escalation`: a severity flag opened an escalation, or opened a
        closed one again. Subject: `Escalation: <location title> - <flag
        labels, joined with ", ">`. It carries the ids of the escalation,
        its review and its location.

        `approval_needed`: a reply draft waits in the approval queue, or
        was on its way to an automatic post and is back in the queue.
        Subject: `Approval needed: <location title>`. Email
        only; its ids are the review and the location.

        `location_report`: a location's report was sent (D-102, D-104). It
        is the report's email to the location's recipients: subject `Your
        Google reviews and visibility report, <period>`. Email only, and a
        rule for it names one location. Its deliveries are written by a send
        of a report, one per address, already `sent` or `failed`, with
        `report_id` and `requested_by`. It carries the location's id.

        `test`: a test message; no rule can name it.

        `system_problem`: something the engine cannot put right by itself.
        These are all of them, with the subject as a person reads it (what
        is in `<>` varies) and the ids a push carries beside `event_type`
        (see `PushPayload`):

        - `The Google Business Profile token stopped working`: the managing
          account's token was refused. At most once a day. No ids.
        - `A background job failed: <job kind>`: a job was given up on after
          its last attempt, for example `local_posts.publish`. At most once
          a day for each kind. No ids.
        - `Apple refused the engine's push settings`: the APNs key, team or
          topic was refused. At most once a day. No ids.
        - `Lost access to a location`: two listings of the managing account
          in a row did not include a location that is enabled.
          `location_id`.
        - `Auto-posting paused: <location title>`: the engine paused
          auto-posting at one location (checks kept failing, an automatic
          reply did not appear on Google, or Google refused one).
          `location_id`.
        - `Auto-posting paused for every location`: Google refused an
          automatic reply as unauthenticated or not configured. No ids.
        - `A reply could not be posted`: an approved or scheduled reply was
          not posted because its review could not be read from Google on the
          job's last attempt. `review_id`, `location_id`.
        - `Google refused a reply`: a reply was refused and will not be
          tried again. `review_id`, `location_id`.
        - `A reply did not appear on Google`: a reply was sent and did not
          show on the review in time. `review_id`, `location_id`.
        - `Google refused a post`: a local post was refused for certain; it
          is back among the drafts. `location_id`, `local_post_id`.
        - `A post may or may not have reached Google`: a local post was sent
          and no answer came, or the engine stopped while sending. It is not
          sent again. `location_id`, `local_post_id`.
        - `A post did not reach Google`: such a post was not found at Google
          after 15 minutes. `location_id`, `local_post_id`.
        - `A post could not be removed`: a request to remove a local post at
          Google was given back (refused, out of attempts, not carried out
          within an hour, its job is gone, or the post's address cannot be
          used). The post may still be on the profile. `location_id`, `local_post_id`.
        - `Google rejected a post`: Google took a local post and now shows
          it as rejected. `location_id`, `local_post_id`.
        - `A post could not be edited`: an approved edit of a post at Google
          was not made, for certain: Google refused it, Google does not find
          the post, or the post could not be read from Google before the
          edit. The post is as it was and the edit is a draft again.
          `location_id`, `local_post_id`.
        - `An edit of a post may or may not have reached Google`: an
          approved edit was sent and Google did not confirm it, or the
          engine stopped while sending it. It is not sent again; the post
          may or may not have changed. `location_id`, `local_post_id`.
        - `Google accepted an edit, but the post does not show it`: Google
          answered an edit with a post that does not say what was sent in a
          field the edit wrote. The post is as Google answered.
          `location_id`, `local_post_id`.

        New problems are added to this list, and a client shows a subject
        it does not know as it is.
    DeliveryStatus:
      type: string
      enum: [pending, sent, failed, not_sent]
    NotificationRule:
      type: object
      additionalProperties: false
      required: [id, event_type, location_id, location_title, channel, recipients, enabled, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        event_type:
          type: string
          enum: [escalation, approval_needed, system_problem, location_report]
        location_id:
          type: [integer, "null"]
          format: int64
          description: The location the rule is for (D-102); null applies it to every location.
        location_title:
          type: [string, "null"]
        channel:
          type: string
          enum: [email, push]
        recipients:
          type: array
          description: |
            Email addresses. For `push`, the staff whose devices are told;
            what a push says is `PushPayload`.
          items:
            type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NotificationRuleList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationRule"
        total:
          type: integer
          format: int64
    NotificationRuleCreate:
      type: object
      additionalProperties: false
      required: [event_type, recipients]
      properties:
        event_type:
          type: string
          enum: [escalation, approval_needed, system_problem, location_report]
        channel:
          type: string
          enum: [email, push]
          default: email
          description: >-
            `push` only for `escalation` and `system_problem`, and only on an
            engine that has the APNs settings (otherwise a 409,
            `push_not_configured`).
        location_id:
          type: [integer, "null"]
          format: int64
          description: |
            The location the rule is for; null or left out for every
            location. A `location_report` rule must name one.
        recipients:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
        enabled:
          type: boolean
          default: true
    NotificationRuleUpdate:
      type: object
      additionalProperties: false
      properties:
        recipients:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
        enabled:
          type: boolean
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [apns_token, environment, app_version]
      properties:
        apns_token:
          type: string
          description: The device token from APNs, in hex.
        environment:
          type: string
          enum: [production, sandbox]
          description: TestFlight and App Store builds use `production`; builds run from Xcode use `sandbox`.
        app_version:
          type: string
          description: For example "1.0 (12)".
    Device:
      type: object
      additionalProperties: false
      required: [id, environment, app_version, created_at, last_seen_at]
      properties:
        id:
          type: integer
          format: int64
        environment:
          type: string
          enum: [production, sandbox]
        app_version:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: The last request of the session the device belongs to.
    PushPayload:
      type: object
      description: |
        The JSON the engine gives Apple for a push to the phone app, not a
        response of this API. It is built from the event's subject, its type
        and its ids, and from nothing else: the body of an event, which may
        quote a review, never reaches a push.

        Only an `escalation` event has the title `New escalation`, the
        category `ESCALATION` and the thread `escalation`; a
        `system_problem` event has the title `System problem`, the category
        `SYSTEM` and the thread `system`. There is no title per kind of
        problem: the subject says what happened (the list is in
        `NotificationEventType`). `aps.alert.body` is the event's subject,
        cut to 178 characters (code points) with `…` added when it was
        longer. The sound is always `default`.

        Each id is there only when the event has it. An `escalation` event
        carries `escalation_id`, `review_id` and `location_id`; a
        `system_problem` carries the ids listed with its subject in
        `NotificationEventType`. An app opens a screen from
        the ids and reads the rest from the API.

        Apple is given a collapse id made from the event, so the same event
        sent again (a retry) replaces the alert already shown and does
        not add one.
      additionalProperties: false
      required: [aps, event_type]
      properties:
        aps:
          type: object
          additionalProperties: false
          required: [alert, sound, category, thread-id]
          properties:
            alert:
              type: object
              additionalProperties: false
              required: [title, body]
              properties:
                title:
                  type: string
                  enum: [New escalation, System problem]
                body:
                  type: string
                  description: The event's subject, cut to 178 characters.
            sound:
              type: string
              enum: [default]
            category:
              type: string
              enum: [ESCALATION, SYSTEM]
            thread-id:
              type: string
              enum: [escalation, system]
        event_type:
          type: string
          enum: [escalation, system_problem]
        escalation_id:
          type: integer
          format: int64
        review_id:
          type: integer
          format: int64
        location_id:
          type: integer
          format: int64
        local_post_id:
          type: integer
          format: int64
    NotificationDelivery:
      type: object
      description: One message to one recipient.
      additionalProperties: false
      required:
        - id
        - event_type
        - location_id
        - review_id
        - escalation_id
        - report_id
        - requested_by
        - channel
        - recipient
        - subject
        - body
        - status
        - status_reason
        - attempts
        - created_at
        - sent_at
      properties:
        id:
          type: integer
          format: int64
        event_type:
          $ref: "#/components/schemas/NotificationEventType"
        location_id:
          type: [integer, "null"]
          format: int64
        review_id:
          type: [integer, "null"]
          format: int64
        escalation_id:
          type: [integer, "null"]
          format: int64
          description: The escalation the event was about; set for an `escalation` event and null for every other one.
        report_id:
          type: [integer, "null"]
          format: int64
          description: The report this email carried; null for any other delivery.
        requested_by:
          type: [string, "null"]
          description: |
            The email of the person who asked for a report's send; null when
            its schedule sent it, and for any other delivery.
        channel:
          type: string
        recipient:
          type: string
          description: Empty when no rule named a recipient for the event.
        subject:
          type: string
        body:
          type: string
          description: Plain text. May quote a review, which is untrusted text.
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        status_reason:
          type: [string, "null"]
          description: Why it failed or was not sent.
        attempts:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        sent_at:
          type: [string, "null"]
          format: date-time
    NotificationDeliveryList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationDelivery"
        total:
          type: integer
          format: int64
    TestNotification:
      type: object
      additionalProperties: false
      required: [recipient]
      properties:
        recipient:
          type: string
          description: An email address.

    AutoPosting:
      type: object
      description: |
        Auto-posting at one location (D-069). `enabled` and the
        star ratings are a person's switches, off after installation. The
        delay and the window come from the location's resolved reply policy
        and are changed there. `paused` is set by the engine and lifted by a
        person.
      additionalProperties: false
      required:
        - location_id
        - location_title
        - client_id
        - client_name
        - enabled
        - five_star
        - four_star
        - daily_cap
        - time_zone
        - delay_min_minutes
        - delay_max_minutes
        - window_start
        - window_end
        - timing_problem
        - posting_enabled
        - paused
        - paused_at
        - pause_reason
        - pause_detail
        - posted_last_24h
        - scheduled
        - pause_after_failures
        - go_live_state
      properties:
        location_id:
          type: integer
          format: int64
        location_title:
          type: string
        client_id:
          type: [integer, "null"]
          format: int64
        client_name:
          type: [string, "null"]
        enabled:
          type: boolean
          description: Replies to this location's reviews may be posted without a person.
        five_star:
          type: boolean
          description: Five-star reviews may be answered automatically.
        four_star:
          type: boolean
          description: Four-star reviews may be answered automatically. Three stars and fewer never are.
        daily_cap:
          type: integer
          minimum: 1
          maximum: 1000
          description: At most this many automatic replies in any 24 hours; the next draft waits for a person. 100 unless changed.
        time_zone:
          type: [string, "null"]
          description: |
            IANA name, for example `America/New_York`. Needed for a posting
            window. The same value as `Location.time_zone`, set here.
        delay_min_minutes:
          type: integer
        delay_max_minutes:
          type: integer
        window_start:
          type: string
        window_end:
          type: string
        timing_problem:
          type: [string, "null"]
          description: Why the timing can't be used. While it is set, nothing is auto-posted here.
        posting_enabled:
          type: boolean
          description: The location's posting switch (`Location.posting_enabled`), which auto-posting needs too.
        paused:
          type: boolean
        paused_at:
          type: [string, "null"]
          format: date-time
        pause_reason:
          oneOf:
            - $ref: "#/components/schemas/AutoPostPauseReason"
            - type: "null"
        pause_detail:
          type: [string, "null"]
        posted_last_24h:
          type: integer
          format: int64
          description: Automatic replies sent in the last 24 hours, which the cap counts.
        scheduled:
          type: integer
          format: int64
          description: Drafts scheduled and not yet posted.
        pause_after_failures:
          type: integer
          minimum: 1
          maximum: 20
          description: This many replies in a row that fail a reply check pause auto-posting here (D-076). 3 unless changed.
        go_live_state:
          $ref: "#/components/schemas/GoLiveState"
    AutoPostPauseReason:
      type: string
      enum: [checks_failing, post_unconfirmed, post_refused]
      description: |
        `checks_failing`: the location's last replies each failed a reply
        check, as many in a row as `pause_after_failures`. `post_unconfirmed`: an automatic reply was sent and did
        not appear on Google. `post_refused`: Google refused an automatic
        reply.
    AutoPostingUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        five_star:
          type: boolean
        four_star:
          type: boolean
        daily_cap:
          type: integer
          minimum: 1
          maximum: 1000
        pause_after_failures:
          type: integer
          minimum: 1
          maximum: 20
        time_zone:
          type: [string, "null"]
          description: An IANA name; null for none. Left out, it stays as it is.
    AutoPostingOverview:
      type: object
      additionalProperties: false
      required:
        - posting_enabled
        - paused
        - paused_at
        - pause_reason
        - pause_detail
        - locations
      properties:
        posting_enabled:
          type: boolean
          description: The global posting switch (`SystemSettings.posting_enabled`).
        paused:
          type: boolean
          description: The engine paused auto-posting for every location.
        paused_at:
          type: [string, "null"]
          format: date-time
        pause_reason:
          oneOf:
            - $ref: "#/components/schemas/AutoPostPauseReason"
            - type: "null"
        pause_detail:
          type: [string, "null"]
        locations:
          type: array
          description: Every enabled location, by title.
          items:
            $ref: "#/components/schemas/AutoPosting"
    GoLiveState:
      type: string
      enum: [not_tested, running, passed, failed, inconclusive, cancelled]
      description: |
        Where the go-live test of a configuration stands (D-074). Only
        `passed` lets it auto-post: a passing test of this exact
        configuration that covers what its reply policy auto-posts today,
        with no failed test of the same configuration after it.
        `inconclusive`: a model could not be reached or gave no usable
        answer, so nothing was decided. A pass keeps counting while the same
        configuration is tested again (`running`).
    GoLiveRunStatus:
      type: string
      enum: [running, passed, failed, inconclusive, cancelled]
    GoLiveAttempt:
      type: object
      description: One of the repeats of a case, as the pipeline's decisions made of it.
      additionalProperties: false
      required: [route, reasons, reply, failed_checks, rating, rating_reason, rated_by]
      properties:
        route:
          $ref: "#/components/schemas/DraftRoute"
        reasons:
          type: array
          description: Why the reply did not go to auto-post; empty for `auto_post`.
          items:
            type: string
        reply:
          type: string
          description: As the model wrote it; empty when it wrote none. Untrusted text.
        failed_checks:
          type: array
          items:
            type: string
        rating:
          type: [string, "null"]
          enum: [post_as_is, minor_edit, rewrite, unacceptable, null]
          description: The judge's rating. Only replies routed to `auto_post` are judged.
        rating_reason:
          type: [string, "null"]
        rated_by:
          type: [string, "null"]
          description: |
            The model that rated, when it was not the judge named in the
            settings: the provider's fallback model, after the judge's model
            declined the case. Null when the judge itself rated, or nothing did.
    GoLiveCase:
      type: object
      additionalProperties: false
      required: [id, case_key, category, review_id, stars, text, verdict, detail, attempts, finished_at]
      properties:
        id:
          type: integer
          format: int64
        case_key:
          type: string
          description: The corpus case's id (`M-01`), or `review:<id>` for one of the location's own reviews.
        category:
          type: string
          enum: [manipulation, severity, control, real]
          description: |
            `manipulation` and `severity` cases must not reach auto-post.
            `control` (an ordinary review from the corpus) and `real` (one
            of the location's reviews, D-075) may, and are then judged.
        review_id:
          type: [integer, "null"]
          format: int64
        stars:
          type: integer
        text:
          type: [string, "null"]
          description: The review. Untrusted text; null for a rating without text.
        verdict:
          type: string
          enum: [pending, ok, leaked, unacceptable, inconclusive]
          description: |
            `leaked`: an attack or severity case was routed to auto-post in
            at least one repeat. `unacceptable`: the judge said so of a
            reply that would have been posted. `inconclusive`: a model gave
            no answer. `pending`: not run (yet, or the run ended first).
        detail:
          type: [string, "null"]
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/GoLiveAttempt"
        finished_at:
          type: [string, "null"]
          format: date-time
    GoLiveRun:
      type: object
      description: One test of one configuration.
      additionalProperties: false
      required:
        - id
        - location_id
        - location_title
        - fingerprint
        - status
        - summary
        - auto_post_positive
        - auto_post_rating_only
        - auto_post_min_stars
        - corpus_version
        - corpus_current
        - kb_version
        - repeats
        - real_reviews
        - cases_total
        - cases_done
        - model_calls
        - spent_usd
        - started_by
        - started_at
        - finished_at
        - cases
      properties:
        id:
          type: integer
          format: int64
        location_id:
          type: integer
          format: int64
          description: The location the run was submitted for (D-102).
        location_title:
          type: string
        fingerprint:
          type: string
        status:
          $ref: "#/components/schemas/GoLiveRunStatus"
        summary:
          type: [string, "null"]
          description: A sentence on the outcome, including how many real reviews were tested or that none were.
        auto_post_positive:
          type: boolean
          description: With the next two, how wide the reply policy was that the cases were routed with. A wider policy needs a new test.
        auto_post_rating_only:
          type: boolean
        auto_post_min_stars:
          type: integer
        corpus_version:
          type: string
          description: A hash of the cases of the location's industry that the run used.
        corpus_current:
          type: boolean
          description: False when the industry's corpus in the knowledge base has changed since. The pass still counts.
        kb_version:
          type: [string, "null"]
          description: The knowledge base the run started against. Null, a run from before there was one.
        repeats:
          type: integer
        real_reviews:
          type: integer
          description: How many of the location's own reviews were among the cases (D-075).
        cases_total:
          type: integer
          format: int64
        cases_done:
          type: integer
          format: int64
        model_calls:
          type: integer
          format: int64
          description: Requests to the models so far.
        spent_usd:
          type: [number, "null"]
          description: Their cost by the price settings; null when no call had a price.
        started_by:
          type: [string, "null"]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        cases:
          type: [array, "null"]
          description: Only when one run is read.
          items:
            $ref: "#/components/schemas/GoLiveCase"
    GoLiveEstimate:
      type: object
      description: What a test would take, from the cases, the repeats, the price settings and the recent model calls.
      additionalProperties: false
      required: [cases, real_reviews, model_calls, judge_calls, seconds, cost_usd, notes]
      properties:
        cases:
          type: integer
          format: int64
        real_reviews:
          type: integer
          format: int64
        model_calls:
          type: integer
          format: int64
          description: Requests to the analyzer and the writer.
        judge_calls:
          type: integer
          format: int64
          description: At most this many requests to the judge.
        seconds:
          type: [integer, "null"]
          format: int64
          description: Null when there are no recent calls to measure.
        cost_usd:
          type: [number, "null"]
        notes:
          type: array
          description: What the numbers leave out.
          items:
            type: string
    GoLiveLocation:
      type: object
      description: |
        Where one location's configuration stands (D-102). Locations with
        the same fingerprint share their runs and their pass, but each is
        submitted on its own.
      additionalProperties: false
      required:
        [location_id, location_title, client_id, client_name, problem, fingerprint, state, state_detail, pass, latest_run, estimate]
      properties:
        location_id:
          type: integer
          format: int64
        location_title:
          type: string
        client_id:
          type: [integer, "null"]
          format: int64
          description: The client the location is grouped under, for display only.
        client_name:
          type: [string, "null"]
        problem:
          type: [string, "null"]
          description: Why this location can't be tested (no industry profile); null when it can.
        fingerprint:
          type: [string, "null"]
          description: Null when the location can't be tested.
        state:
          $ref: "#/components/schemas/GoLiveState"
        state_detail:
          type: [string, "null"]
        pass:
          description: The pass that lets this location auto-post, if there is one.
          oneOf:
            - $ref: "#/components/schemas/GoLiveRun"
            - type: "null"
        latest_run:
          oneOf:
            - $ref: "#/components/schemas/GoLiveRun"
            - type: "null"
        estimate:
          oneOf:
            - $ref: "#/components/schemas/GoLiveEstimate"
            - type: "null"
          description: Null when the location can't be tested.
    GoLiveOverview:
      type: object
      additionalProperties: false
      required: [repeats, judge_provider, judge_model, providers_configured, locations]
      properties:
        repeats:
          type: integer
        judge_provider:
          type: string
        judge_model:
          type: string
        providers_configured:
          type: boolean
          description: The analyzer's, the writer's and the judge's provider each have an address and a key. A test needs all three.
        locations:
          type: array
          description: Every enabled location, by title.
          items:
            $ref: "#/components/schemas/GoLiveLocation"
    AutoPost:
      type: object
      description: One reply the engine posted without a person.
      additionalProperties: false
      required:
        - id
        - review_id
        - location_id
        - location_title
        - rating
        - review_text
        - reply_text
        - status
        - policy_version
        - started_at
        - posted_at
        - published_at
        - seconds_to_post
      properties:
        id:
          type: integer
          format: int64
        review_id:
          type: integer
          format: int64
        location_id:
          type: integer
          format: int64
        location_title:
          type: string
        rating:
          type: [integer, "null"]
        review_text:
          type: [string, "null"]
          description: Untrusted. Render as plain text.
        reply_text:
          type: string
        status:
          type: string
          enum: [posting, posted, published, failed, unconfirmed, superseded]
        policy_version:
          type: string
        started_at:
          type: string
          format: date-time
        posted_at:
          type: [string, "null"]
          format: date-time
        published_at:
          type: [string, "null"]
          format: date-time
        seconds_to_post:
          type: [integer, "null"]
          format: int64
          description: From Google returning the review to Google accepting the reply.
    AutoPostList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AutoPost"
        total:
          type: integer
          format: int64
    SystemSettings:
      type: object
      additionalProperties: false
      required: [posting_enabled, email_sending_enabled, updated_at]
      properties:
        posting_enabled:
          type: boolean
          description: The global kill switch for posting, replies and local posts alike. Off after installation.
        email_sending_enabled:
          type: boolean
          description: Off, notifications are logged as `not_sent` and no email leaves.
        updated_at:
          type: string
          format: date-time
    SystemSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        posting_enabled:
          type: boolean
        email_sending_enabled:
          type: boolean
    PostingStatus:
      type: object
      description: Reply posting.
      additionalProperties: false
      required: [enabled, paused_locations, drafts_waiting, in_flight, published, last_posted_at, open_escalations]
      properties:
        enabled:
          type: boolean
          description: The global switch.
        paused_locations:
          type: integer
          format: int64
          description: Synced locations whose own switch is off.
        drafts_waiting:
          type: integer
          format: int64
          description: |
            Reply drafts with the status `draft`, waiting for a person. It is
            the `total` of `GET /api/reviews?draft_status=draft`: that list
            shows the reviews that are not removed by default and takes each
            review's newest draft, a review has at most one live draft (which
            is its newest), and the drafts of a removed review are
            cancelled, so the two count the same drafts.
        in_flight:
          type: integer
          format: int64
          description: Replies approved or sent that Google has not shown yet.
        published:
          type: integer
          format: int64
          description: Replies of the engine seen on Google.
        last_posted_at:
          type: [string, "null"]
          format: date-time
        open_escalations:
          type: integer
          format: int64
    EmailStatus:
      type: object
      description: The email channel.
      additionalProperties: false
      required: [sending_enabled, connected, account_email, last_ok_at, last_error, last_error_at, pending, failed]
      properties:
        sending_enabled:
          type: boolean
        connected:
          type: boolean
          description: A token of the sending mailbox is stored (connected on the status page).
        account_email:
          type: [string, "null"]
          description: |
            The address of the connected mailbox, as Google named it when it
            was connected (D-100); email is sent from it. Null while nothing
            is connected, and for a token stored before the engine kept the
            address: no email is sent until the mailbox is connected again.
        last_ok_at:
          type: [string, "null"]
          format: date-time
        last_error:
          type: [string, "null"]
        last_error_at:
          type: [string, "null"]
          format: date-time
        pending:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
          description: Deliveries that failed in the last 7 days.

    ReportStatus:
      type: string
      enum: [building, failed, ready, discarding, discarded, expired]
      description: |
        (D-104) `building`: its job has not finished. `failed`: it could not
        be built; `error` says why, and a person generates it again.
        `ready`: built; its page is at `url`. `discarding`: a discard was
        begun and has not finished moving the page. `discarded`: withdrawn
        for good; its page, if it had one, is at `archive_url`. `expired`:
        the same, by the retention's clean-up; nothing in the engine writes
        it yet.
    Report:
      type: object
      description: |
        A location's report (D-085, D-102, D-104). Its numbers and its page are made once,
        when it is built, and never change; "generate again" makes a new
        report.
      additionalProperties: false
      required:
        - id
        - location_id
        - location_title
        - period_start
        - period_end
        - time_zone
        - schedule_id
        - requested_by
        - status
        - error
        - url
        - archive_url
        - auto_send_status
        - new_reviews
        - average_rating
        - response_rate
        - summary
        - summary_note
        - created_at
        - recipients
        - deliveries
      properties:
        id:
          type: integer
          format: int64
        location_id:
          type: integer
          format: int64
          description: The location the report covers (D-102).
        location_title:
          type: string
        period_start:
          type: string
          format: date
          description: The first day of the period, in `time_zone`.
        period_end:
          type: string
          format: date
          description: The last day of the period; it is part of it.
        time_zone:
          type: string
          description: An IANA time zone name.
        schedule_id:
          type: [integer, "null"]
          format: int64
          description: The schedule that asked for the report; null when a person did, or the schedule is gone.
        requested_by:
          type: [string, "null"]
          description: The email of the person who generated it; null for a schedule.
        status:
          $ref: "#/components/schemas/ReportStatus"
        error:
          type: [string, "null"]
          description: Why a failed report failed.
        url:
          type: [string, "null"]
          description: |
            The address of the report's page in the public bucket while the
            report is `ready`; null otherwise. The page is public to whoever
            has the address: the address is the secret.
        archive_url:
          type: [string, "null"]
          description: |
            The address of the archived page once the report is `discarded`
            or `expired`, if an upload of its page was ever begun; null
            otherwise. For staff only. It may answer Cloud Storage's "not
            found" when the page was never stored (a report whose every
            upload failed).
        auto_send_status:
          type: string
          enum: ["off", pending, done]
          description: |
            `off`: a person's report, or one of a schedule without "send
            automatically". `pending`: its schedule sends it by itself and
            has not sent it. `done`: its schedule sent it, once.
        new_reviews:
          type: [integer, "null"]
          format: int64
          description: The reviews written in the period; null until the report is built.
        average_rating:
          type: [number, "null"]
          description: |
            The average star rating of the period's reviews, as the built
            report holds it. Null until the report is built, and when no
            review of the period has a rating.
        response_rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: |
            The share of the period's reviews that have a reply, 0 to 1 (0.75
            is 75 %), as the built report holds it. Null until the report is
            built, and when the period had no reviews.
        summary:
          type: [string, "null"]
          description: The model's summary of the figures; null when it gave none that could be used.
        summary_note:
          type: [string, "null"]
          description: Why there is no summary.
        created_at:
          type: string
          format: date-time
        recipients:
          type: array
          items:
            type: string
          description: |
            The addresses a send can go to now: those of the location's
            enabled `location_report` rule, sorted, each once. Empty in a
            list of reports.
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/NotificationDelivery"
          description: |
            The report's rows of the delivery log, newest first: one per
            address of every send, by a person or by its schedule. Empty in
            a list of reports.
    ReportList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        total:
          type: integer
          format: int64
    ReportCreate:
      type: object
      additionalProperties: false
      required: [period_start, period_end]
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
          description: Must be before today in the report's time zone, and at most 400 days after `period_start`.
        time_zone:
          type: string
          maxLength: 64
          description: An IANA name. Without one, the location's time zone, else UTC.
    ReportSendRequest:
      type: object
      additionalProperties: false
      properties:
        recipients:
          type: array
          minItems: 1
          items:
            type: string
          description: |
            Some of `Report.recipients`, compared after trimming and
            lower-casing; an address that is not one of them is a 400. Left
            out: every one of them.
    ReportFrequency:
      type: string
      enum: [daily, weekly, monthly]
      description: |
        `daily`: covers the day before. `weekly`: the seven days before the
        run day. `monthly`: the calendar month before.
    ReportSchedule:
      type: object
      additionalProperties: false
      required:
        - id
        - location_id
        - location_title
        - frequency
        - weekday
        - month_day
        - time
        - time_zone
        - auto_send
        - enabled
        - last_run_on
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        location_id:
          type: integer
          format: int64
          description: The location whose reports the schedule builds (D-102).
        location_title:
          type: string
        frequency:
          $ref: "#/components/schemas/ReportFrequency"
        weekday:
          type: [integer, "null"]
          minimum: 1
          maximum: 7
          description: 1 (Monday) to 7 (Sunday); weekly schedules only.
        month_day:
          type: [integer, "null"]
          minimum: 1
          maximum: 28
          description: The day of the month; monthly schedules only.
        time:
          type: string
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
          description: The local time of the run, HH:MM.
        time_zone:
          type: string
        auto_send:
          type: boolean
          description: |
            Off (the default): a report this schedule builds is `ready` and
            nothing is sent (`auto_send_status` `off`). On: it is sent once,
            to the location's recipients, when it is built, if the checks of
            a send pass then (`auto_send_status` `done`); otherwise it stays
            `pending` for a person to send. No reason is stored: a person's
            send says why it is refused.
        enabled:
          type: boolean
        last_run_on:
          type: [string, "null"]
          format: date
          description: The local day of the last run a report was built for.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReportScheduleList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReportSchedule"
        total:
          type: integer
          format: int64
    ReportScheduleCreate:
      type: object
      additionalProperties: false
      required: [location_id, frequency, time, time_zone]
      properties:
        location_id:
          type: integer
          format: int64
          description: An enabled location.
        frequency:
          $ref: "#/components/schemas/ReportFrequency"
        weekday:
          type: [integer, "null"]
          minimum: 1
          maximum: 7
          description: Needed for `weekly`; null or left out otherwise.
        month_day:
          type: [integer, "null"]
          minimum: 1
          maximum: 28
          description: Needed for `monthly`; null or left out otherwise.
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        time_zone:
          type: string
          maxLength: 64
        auto_send:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: true
    ReportScheduleUpdate:
      type: object
      description: |
        `weekday` and `month_day` can't be cleared by the caller: the
        engine drops the one the schedule's frequency does not use.
      additionalProperties: false
      properties:
        frequency:
          $ref: "#/components/schemas/ReportFrequency"
        weekday:
          type: integer
          minimum: 1
          maximum: 7
        month_day:
          type: integer
          minimum: 1
          maximum: 28
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        time_zone:
          type: string
          maxLength: 64
        auto_send:
          type: boolean
        enabled:
          type: boolean

    LocalPostStatus:
      type: string
      enum: [draft, approved, sending, sent, unknown, failed, rejected, removed]
      description: |
        Where the post stands with us (D-088). `draft`: waiting for a
        person. `approved`: a person approved the content and the job has
        not started. `sending`: the create is being sent. `sent`: Google
        has the post; `google_state` says what Google does with it.
        `unknown`: the create may or may not have arrived; it is not sent
        again, and the sync looks for the post at Google. `failed`: it was
        not at Google 15 minutes later. `rejected`: a person decided
        against the draft. `removed`: Google no longer has it.
    LocalPostGoogleState:
      type: string
      enum: [processing, scheduled, live, recurring, rejected]
      description: |
        Google's own state of the post, as last read. `processing`: Google
        is still taking it in. `scheduled`: it will be published at
        `scheduled_time`. `live`: it is shown. `recurring`: a repeating
        post that is shown. `rejected`: Google refused it for its content;
        Google does not say why.
    LocalPostGoogleStateFilter:
      type: string
      enum: [processing, scheduled, live, recurring, rejected, none]
      description: |
        A value of the list's `google_state` filter: one of Google's states
        (`LocalPostGoogleState`), or `none` for a post that has no state.
    LocalPostCopy:
      type: object
      description: A post copied from another post, as that post lists it.
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/LocalPostStatus"
    LocalPostEditStatus:
      type: string
      enum: [draft, approved, sending]
      description: |
        Where an edit of a post at Google stands (D-099). `draft`: waiting
        for a person; also an edit that came back, with the reason in its
        `status_reason`. `approved`: a person approved the content and the
        job has not started. `sending`: the request is being sent. An edit
        Google accepted is no longer there: the post has its content.
    LocalPostEditRequest:
      type: object
      description: |
        An edit of a post that is at Google, as a client writes it.
        `content`: the whole content the post should have. `based_on`: the
        post's content exactly as the client last got it from the engine
        (the content members of `LocalPost`), which is what the person was
        looking at. The edit changes the fields in which `content` differs
        from `based_on`. Refused with `local_post_changed` when `based_on`
        is not the post's content now.
      additionalProperties: false
      required: [content, based_on]
      properties:
        content:
          $ref: "#/components/schemas/LocalPostContent"
        based_on:
          $ref: "#/components/schemas/LocalPostContent"
    LocalPostEditField:
      type: string
      enum: [summary, call_to_action, event, offer, media, language_code]
      description: |
        A part of a post that an edit can change, by the name of its member
        in `LocalPostContent` (`media` for `media_ids`).
    LocalPostEdit:
      type: object
      description: |
        The open edit of a post that is at Google (D-099): a change
        proposed by a person and not at Google until a person approved it
        and Google accepted it. `content` is the post as it would say with
        the edit applied now: the post's content as the engine holds it at
        this moment, with the edit's `fields` laid over it. A field the
        edit does not change always shows what the post has now, however
        long the edit has been open. Send `content` as it is to approve it.
      additionalProperties: false
      required: [content, fields, media, checks, status, status_reason, written_by, written_at, decided_by, decided_at]
      properties:
        content:
          $ref: "#/components/schemas/LocalPostContent"
        fields:
          type: array
          description: |
            What the edit changes, and all it ever writes at Google: the
            parts in which the content its author sent differed from the
            post they were looking at. Empty: the edit changes nothing and
            can't be approved.
          items:
            $ref: "#/components/schemas/LocalPostEditField"
        media:
          type: array
          description: |
            What the post would show with the edit applied, for the person
            who approves it: the edit's uploaded photos and videos, in
            order, where the edit changes the media (empty where it takes
            them away), and what the post shows now (`LocalPost.media`)
            where it does not.
          items:
            $ref: "#/components/schemas/LocalPostMediaItem"
        checks:
          type: array
          description: The checks on the edit's content as of its last change (see `PUT /api/local-posts/{id}/edit` for the three that differ from a draft's).
          items:
            $ref: "#/components/schemas/CheckResult"
        status:
          $ref: "#/components/schemas/LocalPostEditStatus"
        status_reason:
          type: [string, "null"]
          description: |
            Why the edit is a draft again, when it came back: Google's
            message for an edit it refused, that Google did not confirm it,
            that the post changed at Google in a part the edit changes, or
            why else the approval was not carried out.
        written_by:
          type: string
          description: The email of the person who wrote the edit, or replaced it last.
        written_at:
          type: string
          format: date-time
        decided_by:
          type: [string, "null"]
          description: The email of the person who approved the edit last; null until someone has, and again after the edit was sent anew.
        decided_at:
          type: [string, "null"]
          format: date-time
    LocalPostOrigin:
      type: string
      enum: [system, google]
      description: "`system`: written here. `google`: made in Google's own interface and found by the sync."
    LocalPostTopicType:
      type: string
      enum: [standard, event, offer, alert]
      description: |
        Google's kind of post. `standard`: an update. `event`: with a title
        and dates. `offer`: an event with a coupon code, a link and terms.
        `alert` only comes from Google; a draft can't have it.
    LocalPostCallToAction:
      type: object
      description: The post's button.
      additionalProperties: false
      required: [action_type, url]
      properties:
        action_type:
          type: string
          description: |
            `book`, `order`, `shop`, `learn_more`, `sign_up` or `call` in a
            draft. A post made at Google may carry another value, given
            here in lower case as Google has it.
        url:
          type: [string, "null"]
          maxLength: 2000
          description: Where the button leads, an `https` address. Null for `call`, which dials the profile's number.
    LocalPostSchedule:
      type: object
      description: The dates of an event or an offer, in the business's own time; Google's `TimeInterval`.
      additionalProperties: false
      required: [start_date, start_time, end_date, end_time]
      properties:
        start_date:
          type: string
          format: date
        start_time:
          type: string
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
        end_date:
          type: string
          format: date
        end_time:
          type: string
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
    LocalPostRecurrence:
      type: object
      description: |
        Google repeats the post. `weekly` repeats on the weekday of the
        event's start, `monthly` on its day of the month. A post made at
        Google may repeat in a finer pattern, which only Google shows.
      additionalProperties: false
      required: [frequency, until]
      properties:
        frequency:
          type: string
          enum: [daily, weekly, monthly]
        until:
          type: [string, "null"]
          format: date-time
          description: When the series ends. A draft needs it; a post made at Google may have none.
    LocalPostEvent:
      type: object
      additionalProperties: false
      required: [title, schedule, recurrence]
      properties:
        title:
          type: string
          description: At most 58 characters (Google's limit).
        schedule:
          $ref: "#/components/schemas/LocalPostSchedule"
        recurrence:
          oneOf:
            - $ref: "#/components/schemas/LocalPostRecurrence"
            - type: "null"
    LocalPostOffer:
      type: object
      additionalProperties: false
      required: [coupon_code, redeem_online_url, terms_conditions]
      properties:
        coupon_code:
          type: [string, "null"]
          maxLength: 58
        redeem_online_url:
          type: [string, "null"]
          maxLength: 2000
        terms_conditions:
          type: [string, "null"]
          maxLength: 5000
    LocalPostContent:
      type: object
      description: |
        What a local post says: Google's `LocalPost` in our spelling
        (D-088). It is what a person writes, edits and approves, so every
        field is sent every time. Limits Google sets (the lengths, no phone
        number in the text) are checks, reported in `LocalPost.checks`:
        they don't refuse a draft, they block its approval.
      additionalProperties: false
      required: [topic_type, summary, language_code, call_to_action, event, offer, media_ids, scheduled_time]
      properties:
        topic_type:
          $ref: "#/components/schemas/LocalPostTopicType"
        summary:
          type: string
          maxLength: 6000
          description: The text. At most 1500 characters (Google's limit).
        language_code:
          type: string
          minLength: 2
          maxLength: 35
          description: The language the post is in, a BCP 47 tag such as `en` or `zh-Hant`.
        call_to_action:
          description: The button; null for none. An offer has none (Google ignores it there).
          oneOf:
            - $ref: "#/components/schemas/LocalPostCallToAction"
            - type: "null"
        event:
          description: Needed for `event` and `offer`; null for `standard`.
          oneOf:
            - $ref: "#/components/schemas/LocalPostEvent"
            - type: "null"
        offer:
          description: Only for `offer`.
          oneOf:
            - $ref: "#/components/schemas/LocalPostOffer"
            - type: "null"
        media_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          description: |
            The uploaded photos and videos (`POST /api/local-post-media`),
            in the order the post shows them; empty for none. At most 10,
            photos and videos mixed, each at most once (D-101). More, or one
            twice, is a 400.
          items:
            type: integer
            format: int64
        scheduled_time:
          type: [string, "null"]
          format: date-time
          description: When Google is to publish the post; null for at once.
    LocalPostMediaItem:
      type: object
      description: A photo or video of a post, for showing it.
      additionalProperties: false
      required: [format, url]
      properties:
        format:
          type: string
          enum: [photo, video]
        url:
          type: string
          description: Google's address of it once Google has the post, the uploaded file's before.
    LocalPost:
      type: object
      description: |
        A post on a location's Google Business Profile (FR-14, D-088): a
        draft, a post the engine sent, or one made in Google's own
        interface. `status` is ours, `google_state` is Google's.
      additionalProperties: false
      required:
        - id
        - location_id
        - location_title
        - client_id
        - client_name
        - origin
        - status
        - status_reason
        - google_state
        - google_name
        - search_url
        - topic_type
        - summary
        - language_code
        - call_to_action
        - event
        - offer
        - media_ids
        - scheduled_time
        - media
        - checks
        - copied_from_id
        - copies
        - edit
        - created_by
        - edited_by
        - edited_at
        - decided_by
        - decided_at
        - sent_at
        - removal_requested_by
        - removal_requested_at
        - removed_at
        - google_created_at
        - synced_at
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        location_id:
          type: integer
          format: int64
        location_title:
          type: string
        client_id:
          type: [integer, "null"]
          format: int64
          description: The client the location is grouped under, for display only; null when it has none.
        client_name:
          type: [string, "null"]
        origin:
          $ref: "#/components/schemas/LocalPostOrigin"
        status:
          $ref: "#/components/schemas/LocalPostStatus"
        status_reason:
          type: [string, "null"]
          description: Why the post is where it is, when that needs saying. Google's message for a draft it refused, for example.
        google_state:
          description: Null until Google has the post, and when Google names a state the engine doesn't know.
          oneOf:
            - $ref: "#/components/schemas/LocalPostGoogleState"
            - type: "null"
        google_name:
          type: [string, "null"]
          description: Google's name of the post, `accounts/{a}/locations/{l}/localPosts/{p}`. Null until Google has it.
        search_url:
          type: [string, "null"]
          description: Google's link to the post in Search.
        topic_type:
          $ref: "#/components/schemas/LocalPostTopicType"
        summary:
          type: string
        language_code:
          type: string
        call_to_action:
          oneOf:
            - $ref: "#/components/schemas/LocalPostCallToAction"
            - type: "null"
        event:
          oneOf:
            - $ref: "#/components/schemas/LocalPostEvent"
            - type: "null"
        offer:
          oneOf:
            - $ref: "#/components/schemas/LocalPostOffer"
            - type: "null"
        media_ids:
          type: array
          maxItems: 10
          description: The uploaded files of a post written here, in order; empty for none, and for a post made at Google.
          items:
            type: integer
            format: int64
        scheduled_time:
          type: [string, "null"]
          format: date-time
        media:
          type: array
          description: |
            What the post shows, in order: Google's copies of its files once
            Google has the post, the uploads before that. Up to 10 items.
          items:
            $ref: "#/components/schemas/LocalPostMediaItem"
        checks:
          type: array
          description: The checks on the content of a post written here, as of its last change; empty for a post made at Google.
          items:
            $ref: "#/components/schemas/CheckResult"
        copied_from_id:
          type: [integer, "null"]
          format: int64
          description: |
            The post this post was copied from (`POST /api/local-posts/{id}/copy`, D-098).
            A copy keeps it after it is approved, sent or removed. Null for a post that
            is no copy, and null again when the post it was copied from was deleted. The
            link is not content: it is not approved and changes nothing about either post.
        copies:
          type: array
          description: |
            The posts copied from this one, newest first, each with its status as it
            is now; empty when there are none. A copy that is deleted leaves the list.
          items:
            $ref: "#/components/schemas/LocalPostCopy"
        edit:
          description: |
            The open edit of a post that is at Google (D-099), or null. While
            there is one, nobody starts another: a second person reads this
            one, replaces it while it is a `draft`, or waits. The content
            members of the post itself stay what Google has.
          oneOf:
            - $ref: "#/components/schemas/LocalPostEdit"
            - type: "null"
        created_by:
          type: [string, "null"]
          description: The email of the person who wrote the draft; null for a post made at Google.
        edited_by:
          type: [string, "null"]
          description: |
            The email of the person who last edited the draft or, once Google
            has accepted an edit of the post, of the person who wrote that edit.
        edited_at:
          type: [string, "null"]
          format: date-time
          description: When the draft was last edited or, for an edit of a post at Google, when Google accepted it.
        decided_by:
          type: [string, "null"]
          description: The email of the person who approved or rejected the draft.
        decided_at:
          type: [string, "null"]
          format: date-time
        sent_at:
          type: [string, "null"]
          format: date-time
          description: When Google accepted the create, or when the sync found the post at Google after a send whose outcome was unknown.
        removal_requested_by:
          type: [string, "null"]
          description: The email of the person who asked for the post to be deleted at Google.
        removal_requested_at:
          type: [string, "null"]
          format: date-time
        removed_at:
          type: [string, "null"]
          format: date-time
          description: When Google answered that the post is gone.
        google_created_at:
          type: [string, "null"]
          format: date-time
        synced_at:
          type: [string, "null"]
          format: date-time
          description: When the post was last read from Google.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LocalPostList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LocalPost"
        total:
          type: integer
          format: int64
    LocalPostRejection:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
          description: Why, for the others. Optional.
    LocalPostMedia:
      type: object
      description: An uploaded photo or video for local posts, stored as it was uploaded.
      additionalProperties: false
      required: [id, format, bytes, width, height, url, created_by, created_at]
      properties:
        id:
          type: integer
          format: int64
        format:
          type: string
          enum: [photo, video]
        bytes:
          type: integer
          format: int64
        width:
          type: [integer, "null"]
          description: In pixels, as the file stores it (a phone's rotation is not applied).
        height:
          type: [integer, "null"]
        url:
          type: string
          description: Its public address, which Google reads it from.
        created_by:
          type: [string, "null"]
          description: The email of the person who uploaded it.
        created_at:
          type: string
          format: date-time
    HighlightCount:
      type: object
      additionalProperties: false
      required: [label, count]
      properties:
        label:
          type: string
        count:
          type: integer
          format: int64
          description: In how many reviews.
    HighlightReview:
      type: object
      description: A recent review that praised something, without the reviewer's name, which the review's page has.
      additionalProperties: false
      required: [review_id, rating, day, language, text]
      properties:
        review_id:
          type: integer
          format: int64
        rating:
          type: integer
          minimum: 1
          maximum: 5
        day:
          type: string
          format: date
        language:
          type: string
        text:
          type: string
          description: The review's text. It is untrusted, so show it as plain text.
    ReviewHighlights:
      type: object
      description: What the location's customers praised in the period, from the stored analysis (D-088).
      additionalProperties: false
      required:
        - location_id
        - period_start
        - period_end
        - reviews
        - analysed_reviews
        - enough_for_ideas
        - topics
        - items
        - languages
        - recent
      properties:
        location_id:
          type: integer
          format: int64
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        reviews:
          type: integer
          format: int64
          description: Reviews written in the period.
        analysed_reviews:
          type: integer
          format: int64
          description: Of those, the ones with an analysis and no severity flag or suspected manipulation. The highlights count these.
        enough_for_ideas:
          type: boolean
          description: Whether `local-post-ideas` would ask the model (at least 10 analysed reviews).
        topics:
          type: array
          description: The topics praised most, most first.
          items:
            $ref: "#/components/schemas/HighlightCount"
        items:
          type: array
          description: The dishes, services and other items praised most.
          items:
            $ref: "#/components/schemas/HighlightCount"
        languages:
          type: array
          description: The languages the reviews are written in.
          items:
            $ref: "#/components/schemas/HighlightCount"
        recent:
          type: array
          description: Up to 5 recent reviews of 4 or 5 stars with text.
          items:
            $ref: "#/components/schemas/HighlightReview"
    LocalPostIdea:
      type: object
      additionalProperties: false
      required: [topic_type, headline, brief, reason]
      properties:
        topic_type:
          type: string
          enum: [standard, event, offer]
        headline:
          type: string
          description: The idea in a few words.
        brief:
          type: string
          description: What the post would say; it can be sent to `local-post-drafts` as the brief.
        reason:
          type: string
          description: What in the location's reviews or figures suggests it.
    LocalPostIdeas:
      type: object
      additionalProperties: false
      required: [ideas, model]
      properties:
        ideas:
          type: array
          description: Three to five.
          items:
            $ref: "#/components/schemas/LocalPostIdea"
        model:
          type: string
    LocalPostDraftRequest:
      type: object
      description: A brief to write from, a text to improve, or both; one of them must say something.
      additionalProperties: false
      required: [topic_type, language_code, brief, summary, title]
      properties:
        topic_type:
          type: string
          enum: [standard, event, offer]
        language_code:
          type: string
          minLength: 2
          maxLength: 35
          description: The language to write in.
        brief:
          type: string
          maxLength: 2000
          description: What the post should say, in the staff member's words. May be empty when `summary` is not.
        summary:
          type: string
          maxLength: 6000
          description: The current text, to improve. May be empty.
        title:
          type: [string, "null"]
          maxLength: 200
          description: The current title of an event or offer.
    LocalPostSuggestion:
      type: object
      additionalProperties: false
      required: [summary, title, notes_for_staff, model]
      properties:
        summary:
          type: string
          description: The suggested text, at most 1500 characters.
        title:
          type: [string, "null"]
          description: A suggested title, for an event or offer.
        notes_for_staff:
          type: string
          description: A note from the model for the person, such as a fact it could not know.
        model:
          type: string
