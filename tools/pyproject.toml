[project]
name = "poni-tools"
version = "0.1.0"
description = "Operations scripts of the PONI GBP Manager: migrations and the knowledge base (D-079)"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-storage>=3.0",
    "jsonschema>=4.23",
    "psycopg[binary]>=3.2",
]

[project.scripts]
poni-tools = "poni_tools.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poni_tools"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# SQL and expected messages read better on one line.
"tests/*" = ["E501"]
